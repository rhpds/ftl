---
# ServiceAccount for FTL grader pods
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ftl-grader
  namespace: ftl-grading
---
# ClusterRoleBinding: view all namespaces (for checking student resources)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ftl-grader-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
- kind: ServiceAccount
  name: ftl-grader
  namespace: ftl-grading
---
# ClusterRole: allow impersonation for oc --as checks
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ftl-grader-impersonate
rules:
- apiGroups: [""]
  resources: ["users", "groups", "serviceaccounts"]
  verbs: ["impersonate"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ftl-grader-impersonate
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ftl-grader-impersonate
subjects:
- kind: ServiceAccount
  name: ftl-grader
  namespace: ftl-grading
