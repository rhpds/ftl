---
- name: Test kubernetes.core.k8s_info with MCPToolConfig
  hosts: localhost
  gather_facts: false
  
  vars:
    lab_user: "{{ lookup('env', 'LAB_USER') | default('user1') }}"
  
  tasks:
    - name: Show what we're looking for
      debug:
        msg:
          - "API Version: toolhive.stacklok.dev/v1alpha1"
          - "Kind: MCPToolConfig"
          - "Namespace: mcp-openshift-{{ lab_user }}"
          - "Name: openshift-tool-filter"
    
    - name: Test 1 - k8s_info with all parameters
      kubernetes.core.k8s_info:
        api_version: "toolhive.stacklok.dev/v1alpha1"
        kind: "MCPToolConfig"
        namespace: "mcp-openshift-{{ lab_user }}"
        name: "openshift-tool-filter"
      register: r_test1
      ignore_errors: true
    
    - name: Show Test 1 result
      debug:
        msg:
          - "Succeeded: {{ r_test1 is succeeded }}"
          - "Failed: {{ r_test1 is failed }}"
          - "Resources count: {{ r_test1.resources | default([]) | length }}"
          - "Full result: {{ r_test1 }}"
    
    - name: Test 2 - k8s_info without name (list all)
      kubernetes.core.k8s_info:
        api_version: "toolhive.stacklok.dev/v1alpha1"
        kind: "MCPToolConfig"
        namespace: "mcp-openshift-{{ lab_user }}"
      register: r_test2
      ignore_errors: true
    
    - name: Show Test 2 result
      debug:
        msg:
          - "Succeeded: {{ r_test2 is succeeded }}"
          - "Resources count: {{ r_test2.resources | default([]) | length }}"
          - "Resource names: {{ r_test2.resources | map(attribute='metadata.name') | list }}"
