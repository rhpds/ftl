---
# Test different authentication methods for RHDH Permission API

- name: Test RHDH Permission API Authentication Methods
  hosts: localhost
  gather_facts: false
  become: false

  vars:
    portal_url: "{{ lookup('env', 'SELF_SERVICE_PORTAL_URL') }}"
    aap_admin_password: "{{ lookup('env', 'AAP_ADMIN_PASSWORD') }}"
    rhdh_namespace: "user1-aap-ssap"  # Portal namespace

  tasks:
    - name: "Display test info"
      ansible.builtin.debug:
        msg:
          - "Portal URL: {{ portal_url }}"
          - "RHDH Namespace: {{ rhdh_namespace }}"

    # =============================================
    # Method 1: Get RHDH backend token from OpenShift secret
    # =============================================
    - name: "Method 1: Try to get RHDH backend auth token from OpenShift"
      block:
        - name: "Get all secrets in Portal namespace"
          kubernetes.core.k8s_info:
            api_version: v1
            kind: Secret
            namespace: "{{ rhdh_namespace }}"
          register: r_all_secrets
          ignore_errors: true

        - name: "Display secret names"
          ansible.builtin.debug:
            msg: "Secrets in {{ rhdh_namespace }}: {{ r_all_secrets.resources | map(attribute='metadata.name') | list }}"
          when: r_all_secrets.resources is defined

        - name: "Look for backstage-related secrets"
          kubernetes.core.k8s_info:
            api_version: v1
            kind: Secret
            namespace: "{{ rhdh_namespace }}"
            label_selectors:
              - app.kubernetes.io/name=backstage
          register: r_backstage_secrets
          ignore_errors: true

        - name: "Display backstage secret names"
          ansible.builtin.debug:
            msg: "Backstage secrets: {{ r_backstage_secrets.resources | map(attribute='metadata.name') | list if r_backstage_secrets.resources is defined else [] }}"

        - name: "Search for backend-auth-secret"
          kubernetes.core.k8s_info:
            api_version: v1
            kind: Secret
            name: "rhdh-backend-auth-secret"
            namespace: "{{ rhdh_namespace }}"
          register: r_backend_auth
          ignore_errors: true

        - name: "Display backend auth secret"
          ansible.builtin.debug:
            var: r_backend_auth
          when: r_backend_auth.resources is defined and r_backend_auth.resources | length > 0

    # =============================================
    # Method 2: Get OAuth token via Playwright login
    # =============================================
    - name: "Method 2: Get OAuth session token via Playwright"
      shell: |
        python3 << 'PYTHON_SCRIPT'
        from playwright.sync_api import sync_playwright
        import os
        import json

        portal_url = os.environ['SELF_SERVICE_PORTAL_URL']
        username = "admin"
        password = os.environ['AAP_ADMIN_PASSWORD']

        try:
            with sync_playwright() as p:
                browser = p.chromium.launch(headless=True)
                context = browser.new_context(ignore_https_errors=True)
                page = context.new_page()

                # Login via OAuth
                page.goto(portal_url, timeout=60000)
                page.wait_for_load_state('networkidle')

                try:
                    page.click("button:has-text('Sign In')", timeout=10000)
                    page.wait_for_load_state('networkidle', timeout=30000)
                except:
                    pass

                page.wait_for_timeout(3000)
                username_input = page.locator("input[type='text'], input[name='username']").first
                if username_input.is_visible(timeout=5000):
                    username_input.fill(username)
                password_input = page.locator("input[type='password']").first
                if password_input.is_visible(timeout=5000):
                    password_input.fill(password)
                page.click("button:has-text('Log in')", timeout=5000)
                page.wait_for_load_state('networkidle', timeout=60000)
                page.wait_for_timeout(3000)

                # Extract cookies
                cookies = context.cookies()
                cookie_dict = {}
                for cookie in cookies:
                    cookie_dict[cookie['name']] = cookie['value']

                browser.close()

                # Output as JSON
                print(json.dumps({
                    "success": True,
                    "cookies": cookie_dict,
                    "cookie_count": len(cookies)
                }))

        except Exception as e:
            print(json.dumps({"success": False, "error": str(e)}))
        PYTHON_SCRIPT
      environment:
        SELF_SERVICE_PORTAL_URL: "{{ portal_url }}"
        AAP_ADMIN_PASSWORD: "{{ aap_admin_password }}"
      register: r_oauth_token
      ignore_errors: true

    - name: "Parse OAuth result"
      ansible.builtin.set_fact:
        oauth_result: "{{ r_oauth_token.stdout | from_json }}"
      when: r_oauth_token.rc == 0

    - name: "Display OAuth cookies"
      ansible.builtin.debug:
        msg:
          - "OAuth login success: {{ oauth_result.success }}"
          - "Cookies obtained: {{ oauth_result.cookie_count }}"
          - "Cookie names: {{ oauth_result.cookies.keys() | list }}"
      when: oauth_result is defined and oauth_result.success

    # =============================================
    # Method 3: Try API with OAuth cookies
    # =============================================
    - name: "Method 3: Test Permission API with OAuth cookies"
      when: oauth_result is defined and oauth_result.success
      block:
        - name: "Try /api/permission/policies with session cookies"
          ansible.builtin.uri:
            url: "{{ portal_url }}/api/permission/policies"
            method: GET
            validate_certs: false
            headers:
              Content-Type: "application/json"
              Cookie: "{{ oauth_result.cookies.items() | map('join', '=') | join('; ') }}"
            status_code: [200, 401, 403]
          register: r_api_with_cookies
          ignore_errors: true

        - name: "Display result with cookies"
          ansible.builtin.debug:
            msg:
              - "Status with cookies: {{ r_api_with_cookies.status }}"
              - "Response: {{ r_api_with_cookies.json if r_api_with_cookies.status == 200 else r_api_with_cookies.msg }}"

    # =============================================
    # Method 4: Try API with Bearer token (if found in cookies)
    # =============================================
    - name: "Method 4: Try with Bearer token from cookies"
      when: oauth_result is defined and oauth_result.success
      block:
        - name: "Check if we have a token cookie"
          ansible.builtin.set_fact:
            bearer_token: "{{ oauth_result.cookies.get('token', oauth_result.cookies.get('auth_token', oauth_result.cookies.get('access_token', ''))) }}"

        - name: "Try API with Bearer token"
          when: bearer_token | length > 0
          ansible.builtin.uri:
            url: "{{ portal_url }}/api/permission/policies"
            method: GET
            validate_certs: false
            headers:
              Content-Type: "application/json"
              Authorization: "Bearer {{ bearer_token }}"
            status_code: [200, 401, 403]
          register: r_api_with_bearer
          ignore_errors: true

        - name: "Display result with bearer token"
          when: bearer_token | length > 0
          ansible.builtin.debug:
            msg:
              - "Status with Bearer: {{ r_api_with_bearer.status }}"
              - "Response: {{ r_api_with_bearer.json if r_api_with_bearer.status == 200 else r_api_with_bearer.msg }}"

    # =============================================
    # Summary
    # =============================================
    - name: "Summary of authentication attempts"
      ansible.builtin.debug:
        msg:
          - "================================================"
          - "RHDH Permission API Authentication Test Results"
          - "================================================"
          - "Method 1 (OpenShift secrets): {{ 'Secrets found: ' + (r_backstage_secrets.resources | map(attribute='metadata.name') | list | join(', ')) if r_backstage_secrets.resources is defined and r_backstage_secrets.resources | length > 0 else 'No backstage secrets found' }}"
          - "Method 2 (OAuth login): {{ 'Success - ' + (oauth_result.cookie_count | string) + ' cookies' if oauth_result is defined and oauth_result.success else 'Failed' }}"
          - "Method 3 (Session cookies): {{ 'Status ' + (r_api_with_cookies.status | string) if r_api_with_cookies is defined else 'Not tested' }}"
          - "Method 4 (Bearer token): {{ 'Status ' + (r_api_with_bearer.status | string) if r_api_with_bearer is defined else 'No token found or not tested' }}"
          - "================================================"
          - "{{ '✅ SUCCESS: Found working authentication!' if (r_api_with_cookies is defined and r_api_with_cookies.status == 200) or (r_api_with_bearer is defined and r_api_with_bearer.status == 200) else '⚠️  No working authentication method found yet' }}"
