---
# Solve Module 1: Configure AAP for Self-Service Portal
# Automatically creates teams and assigns users (RBAC configuration)

- name: Solve Module 1 - Configure AAP RBAC
  hosts: localhost
  gather_facts: false
  become: false

  vars:
    aap_gateway_url: "{{ lookup('env', 'AAP_CONTROLLER_URL') }}"
    aap_admin_username: "admin"
    aap_admin_password: "{{ lookup('env', 'AAP_ADMIN_PASSWORD') }}"
    # Default organization ID (usually 1 for 'Default' org)
    organization_id: 1

  tasks:
    # ========================================================================
    # Section 1.1: Create Teams
    # ========================================================================

    - name: "Create cloud-team"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}/api/gateway/v1/teams/"
        method: POST
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
        body_format: json
        body:
          name: "cloud-team"
          organization: "{{ organization_id }}"
        status_code: [200, 201, 400]
      register: r_cloud_team_create
      # 400 means team already exists

    - name: "Create network-team"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}/api/gateway/v1/teams/"
        method: POST
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
        body_format: json
        body:
          name: "network-team"
          organization: "{{ organization_id }}"
        status_code: [200, 201, 400]
      register: r_network_team_create

    - name: "Create rhel-team"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}/api/gateway/v1/teams/"
        method: POST
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
        body_format: json
        body:
          name: "rhel-team"
          organization: "{{ organization_id }}"
        status_code: [200, 201, 400]
      register: r_rhel_team_create

    # ========================================================================
    # Section 1.2: Get Team IDs for User Assignments
    # ========================================================================

    - name: "Get cloud-team ID"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}/api/gateway/v1/teams/?name=cloud-team"
        method: GET
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
      register: r_cloud_team

    - name: "Get network-team ID"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}/api/gateway/v1/teams/?name=network-team"
        method: GET
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
      register: r_network_team

    - name: "Get rhel-team ID"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}/api/gateway/v1/teams/?name=rhel-team"
        method: GET
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
      register: r_rhel_team

    - name: "Set team IDs"
      ansible.builtin.set_fact:
        cloud_team_id: "{{ r_cloud_team.json.results[0].id }}"
        network_team_id: "{{ r_network_team.json.results[0].id }}"
        rhel_team_id: "{{ r_rhel_team.json.results[0].id }}"

    # ========================================================================
    # Section 1.3: Clean up existing team memberships
    # ========================================================================

    - name: "Get current cloud-team members"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}{{ r_cloud_team.json.results[0].related.users }}"
        method: GET
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
      register: r_cloud_team_current_users
      when: r_cloud_team.json.count | default(0) | int > 0

    - name: "Remove all users from cloud-team"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}/api/gateway/v1/teams/{{ cloud_team_id }}/users/disassociate/"
        method: POST
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
        body_format: json
        body:
          instances: ["{{ item.id }}"]
        status_code: [200, 201, 204, 400, 404]
      loop: "{{ r_cloud_team_current_users.json.results | default([]) }}"
      when:
        - r_cloud_team.json.count | default(0) | int > 0
        - r_cloud_team_current_users.json.results | default([]) | length > 0

    - name: "Get current network-team members"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}{{ r_network_team.json.results[0].related.users }}"
        method: GET
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
      register: r_network_team_current_users
      when: r_network_team.json.count | default(0) | int > 0

    - name: "Remove all users from network-team"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}/api/gateway/v1/teams/{{ network_team_id }}/users/disassociate/"
        method: POST
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
        body_format: json
        body:
          instances: ["{{ item.id }}"]
        status_code: [200, 201, 204, 400, 404]
      loop: "{{ r_network_team_current_users.json.results | default([]) }}"
      when:
        - r_network_team.json.count | default(0) | int > 0
        - r_network_team_current_users.json.results | default([]) | length > 0

    - name: "Get current rhel-team members"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}{{ r_rhel_team.json.results[0].related.users }}"
        method: GET
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
      register: r_rhel_team_current_users
      when: r_rhel_team.json.count | default(0) | int > 0

    - name: "Remove all users from rhel-team"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}/api/gateway/v1/teams/{{ rhel_team_id }}/users/disassociate/"
        method: POST
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
        body_format: json
        body:
          instances: ["{{ item.id }}"]
        status_code: [200, 201, 204, 400, 404]
      loop: "{{ r_rhel_team_current_users.json.results | default([]) }}"
      when:
        - r_rhel_team.json.count | default(0) | int > 0
        - r_rhel_team_current_users.json.results | default([]) | length > 0

    # ========================================================================
    # Section 1.4: Assign Correct Users to Teams
    # ========================================================================

    - name: "Get clouduser1 ID"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}/api/gateway/v1/users/?username=clouduser1"
        method: GET
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
      register: r_clouduser1

    - name: "Assign clouduser1 to cloud-team"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}/api/gateway/v1/teams/{{ cloud_team_id }}/users/associate/"
        method: POST
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
        body_format: json
        body:
          instances: ["{{ r_clouduser1.json.results[0].id }}"]
        status_code: [200, 201, 204, 400]
      when: r_clouduser1.json.count | default(0) | int > 0

    - name: "Get networkuser1 ID"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}/api/gateway/v1/users/?username=networkuser1"
        method: GET
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
      register: r_networkuser1

    - name: "Assign networkuser1 to network-team"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}/api/gateway/v1/teams/{{ network_team_id }}/users/associate/"
        method: POST
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
        body_format: json
        body:
          instances: ["{{ r_networkuser1.json.results[0].id }}"]
        status_code: [200, 201, 204, 400]
      when: r_networkuser1.json.count | default(0) | int > 0

    - name: "Get rheluser1 ID"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}/api/gateway/v1/users/?username=rheluser1"
        method: GET
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
      register: r_rheluser1

    - name: "Assign rheluser1 to rhel-team"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}/api/gateway/v1/teams/{{ rhel_team_id }}/users/associate/"
        method: POST
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
        body_format: json
        body:
          instances: ["{{ r_rheluser1.json.results[0].id }}"]
        status_code: [200, 201, 204, 400]
      when: r_rheluser1.json.count | default(0) | int > 0

    # ========================================================================
    # Section 1.5: Get Role Definition IDs (dynamic lookup for AAP 2.6)
    # ========================================================================

    - name: "Get all role definitions"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}/api/controller/v2/role_definitions/"
        method: GET
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
      register: r_role_definitions

    - name: "Set role definition IDs"
      ansible.builtin.set_fact:
        role_jt_execute_id: "{{ r_role_definitions.json.results | selectattr('name', 'equalto', 'JobTemplate Execute') | map(attribute='id') | first }}"
        role_inv_use_id: "{{ r_role_definitions.json.results | selectattr('name', 'equalto', 'Inventory Use') | map(attribute='id') | first }}"
        role_cred_use_id: "{{ r_role_definitions.json.results | selectattr('name', 'equalto', 'Credential Use') | map(attribute='id') | first }}"

    # ========================================================================
    # Section 1.6: Assign Roles to cloud-team
    # ========================================================================

    - name: "Get Cloud/AWS job templates"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}/api/controller/v2/job_templates/?name__istartswith=Cloud/AWS"
        method: GET
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
      register: r_cloud_templates

    - name: "Assign Execute role on Cloud/AWS templates to cloud-team"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}/api/controller/v2/role_team_assignments/"
        method: POST
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
        body_format: json
        body:
          team: "{{ cloud_team_id }}"
          role_definition: "{{ role_jt_execute_id }}"
          content_type: "awx.jobtemplate"
          object_id: "{{ item.id }}"
        status_code: [200, 201, 204, 400]
      loop: "{{ r_cloud_templates.json.results }}"
      when: r_cloud_templates.json.count | default(0) | int > 0

    - name: "Get cloud inventories"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}/api/controller/v2/inventories/?name__in=AWS%20Inventory,Azure%20Inventory,GCP%20Inventory"
        method: GET
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
      register: r_cloud_inventories

    - name: "Assign Use role on cloud inventories to cloud-team"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}/api/controller/v2/role_team_assignments/"
        method: POST
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
        body_format: json
        body:
          team: "{{ cloud_team_id }}"
          role_definition: "{{ role_inv_use_id }}"
          content_type: "awx.inventory"
          object_id: "{{ item.id }}"
        status_code: [200, 201, 204, 400]
      loop: "{{ r_cloud_inventories.json.results }}"
      when: r_cloud_inventories.json.count | default(0) | int > 0

    - name: "Get cloud credentials"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}/api/controller/v2/credentials/?name__in=AWS%20Credential,Azure%20Credential,RHEL%20-%20SSH%20Credentials"
        method: GET
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
      register: r_cloud_credentials

    - name: "Assign Use role on cloud credentials to cloud-team"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}/api/controller/v2/role_team_assignments/"
        method: POST
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
        body_format: json
        body:
          team: "{{ cloud_team_id }}"
          role_definition: "{{ role_cred_use_id }}"
          content_type: "awx.credential"
          object_id: "{{ item.id }}"
        status_code: [200, 201, 204, 400]
      loop: "{{ r_cloud_credentials.json.results }}"
      when: r_cloud_credentials.json.count | default(0) | int > 0

    # ========================================================================
    # Section 1.7: Assign Roles to network-team
    # ========================================================================

    - name: "Get Network job templates"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}/api/controller/v2/job_templates/?name__istartswith=Network/"
        method: GET
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
      register: r_network_templates

    - name: "Assign Execute role on Network templates to network-team"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}/api/controller/v2/role_team_assignments/"
        method: POST
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
        body_format: json
        body:
          team: "{{ network_team_id }}"
          role_definition: "{{ role_jt_execute_id }}"
          content_type: "awx.jobtemplate"
          object_id: "{{ item.id }}"
        status_code: [200, 201, 204, 400]
      loop: "{{ r_network_templates.json.results }}"
      when: r_network_templates.json.count | default(0) | int > 0

    - name: "Get Network Inventory"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}/api/controller/v2/inventories/?name=Network%20Inventory"
        method: GET
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
      register: r_network_inventory

    - name: "Assign Use role on Network Inventory to network-team"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}/api/controller/v2/role_team_assignments/"
        method: POST
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
        body_format: json
        body:
          team: "{{ network_team_id }}"
          role_definition: "{{ role_inv_use_id }}"
          content_type: "awx.inventory"
          object_id: "{{ r_network_inventory.json.results[0].id }}"
        status_code: [200, 201, 204, 400]
      when: r_network_inventory.json.count | default(0) | int > 0

    - name: "Get Network Credential"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}/api/controller/v2/credentials/?name=Network%20Credential"
        method: GET
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
      register: r_network_credential

    - name: "Assign Use role on Network Credential to network-team"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}/api/controller/v2/role_team_assignments/"
        method: POST
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
        body_format: json
        body:
          team: "{{ network_team_id }}"
          role_definition: "{{ role_cred_use_id }}"
          content_type: "awx.credential"
          object_id: "{{ item.id }}"
        status_code: [200, 201, 204, 400]
      when: r_network_credential.json.count | default(0) | int > 0

    # ========================================================================
    # Section 1.8: Assign Roles to rhel-team
    # ========================================================================

    - name: "Get Linux/RHEL job templates"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}/api/controller/v2/job_templates/?name__istartswith=Linux/RHEL"
        method: GET
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
      register: r_rhel_templates

    - name: "Get additional RHEL job templates (Cloud/AWS Create RHEL instances)"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}/api/controller/v2/job_templates/?name__in=Cloud/AWS%20Create%20RHEL10%20instance,Cloud/AWS%20Create%20RHEL9%20instance,RHEL%20/%20Update%20RHEL%20Time%20Servers"
        method: GET
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
      register: r_rhel_additional_templates

    - name: "Combine RHEL templates"
      ansible.builtin.set_fact:
        all_rhel_templates: "{{ r_rhel_templates.json.results + r_rhel_additional_templates.json.results }}"

    - name: "Assign Execute role on RHEL templates to rhel-team"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}/api/controller/v2/role_team_assignments/"
        method: POST
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
        body_format: json
        body:
          team: "{{ rhel_team_id }}"
          role_definition: "{{ role_jt_execute_id }}"
          content_type: "awx.jobtemplate"
          object_id: "{{ item.id }}"
        status_code: [200, 201, 204, 400]
      loop: "{{ all_rhel_templates }}"
      when: all_rhel_templates | length > 0

    - name: "Get RHEL inventories"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}/api/controller/v2/inventories/?name__in=RHEL%20Inventory,AWS%20Inventory"
        method: GET
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
      register: r_rhel_inventories

    - name: "Assign Use role on RHEL inventories to rhel-team"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}/api/controller/v2/role_team_assignments/"
        method: POST
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
        body_format: json
        body:
          team: "{{ rhel_team_id }}"
          role_definition: "{{ role_inv_use_id }}"
          content_type: "awx.inventory"
          object_id: "{{ item.id }}"
        status_code: [200, 201, 204, 400]
      loop: "{{ r_rhel_inventories.json.results }}"
      when: r_rhel_inventories.json.count | default(0) | int > 0

    - name: "Get RHEL credentials"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}/api/controller/v2/credentials/?name__in=AWS%20Credential,RHEL%20-%20SSH%20Credentials"
        method: GET
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
      register: r_rhel_credentials

    - name: "Assign Use role on RHEL credentials to rhel-team"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}/api/controller/v2/role_team_assignments/"
        method: POST
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
        body_format: json
        body:
          team: "{{ rhel_team_id }}"
          role_definition: "{{ role_cred_use_id }}"
          content_type: "awx.credential"
          object_id: "{{ item.id }}"
        status_code: [200, 201, 204, 400]
      loop: "{{ r_rhel_credentials.json.results }}"
      when: r_rhel_credentials.json.count | default(0) | int > 0

    # ========================================================================
    # Section 1.9: Create Portal RBAC Policies
    # ========================================================================

    - name: "Create Portal RBAC policies via browser automation"
      script: create_portal_rbac.py
      environment:
        SELF_SERVICE_PORTAL_URL: "{{ lookup('env', 'SELF_SERVICE_PORTAL_URL') }}"
        AAP_ADMIN_PASSWORD: "{{ aap_admin_password }}"
      register: r_portal_rbac_solve
      ignore_errors: true

    - name: "Display Portal RBAC solver result"
      ansible.builtin.debug:
        var: r_portal_rbac_solve.stdout_lines
      when: r_portal_rbac_solve is defined

    - name: "Module 1 solve complete"
      ansible.builtin.debug:
        msg: "✅ Module 1 solve complete - Teams, users, AAP RBAC, and Portal RBAC all configured (11 tasks)"
