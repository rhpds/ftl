---
# Grade Module 1: Verify Pre-Configured AAP Content
# Module 1 is OBSERVATION - students verify pre-configured content exists
# This grader validates the environment is correctly set up for Portal usage

- name: Grade Module 1 - Verify Pre-Configured AAP Content
  hosts: localhost
  gather_facts: false
  become: false

  vars:
    # Environment variables from AgnosticD or bastion environment
    aap_gateway_url: "{{ lookup('env', 'AAP_CONTROLLER_URL') }}"
    aap_admin_username: "admin"
    aap_admin_password: "{{ lookup('env', 'AAP_ADMIN_PASSWORD') }}"
    self_service_portal_url: "{{ lookup('env', 'SELF_SERVICE_PORTAL_URL') }}"

  tasks:
    # ========================================================================
    # Section 1.1: Verify Demo Users Exist
    # ========================================================================

    - name: "Module 1.1: Check clouduser1 exists in AAP"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}/api/gateway/v1/users/?username=clouduser1"
        method: GET
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
        status_code: [200, 404]
      register: r_user1_check

    - name: "Module 1.1: Evaluate and log result"
      ansible.builtin.set_fact:
        grader_output_message: "{{ 'PASS: Demo user clouduser1 exists in AAP' if (r_user1_check.json.count | default(0) | int > 0) else 'FAIL: Demo user clouduser1 exists in AAP: User not found in Gateway' }}"

    - name: "Module 1.1: Log result"
      include_role:
        name: ftl_run_log_grade_to_log

    - name: "Module 1.2: Check networkuser1 exists in AAP"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}/api/gateway/v1/users/?username=networkuser1"
        method: GET
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
        status_code: [200, 404]
      register: r_user2_check

    - name: "Module 1.2: Evaluate and log result"
      ansible.builtin.set_fact:
        grader_output_message: "{{ 'PASS: Demo user networkuser1 exists in AAP' if (r_user2_check.json.count | default(0) | int > 0) else 'FAIL: Demo user networkuser1 exists in AAP: User not found in Gateway' }}"

    - name: "Module 1.2: Log result"
      include_role:
        name: ftl_run_log_grade_to_log

    - name: "Module 1.3: Check rheluser1 exists in AAP"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}/api/gateway/v1/users/?username=rheluser1"
        method: GET
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
        status_code: [200, 404]
      register: r_user3_check

    - name: "Module 1.3: Evaluate and log result"
      ansible.builtin.set_fact:
        grader_output_message: "{{ 'PASS: Demo user rheluser1 exists in AAP' if (r_user3_check.json.count | default(0) | int > 0) else 'FAIL: Demo user rheluser1 exists in AAP: User not found in Gateway' }}"

    - name: "Module 1.3: Log result"
      include_role:
        name: ftl_run_log_grade_to_log

    # ========================================================================
    # Section 1.2: Verify Inventories Exist (using Controller API via Gateway proxy)
    # ========================================================================

    - name: "Module 1.4: Check AWS Inventory exists"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}/api/controller/v2/inventories/?name=AWS%20Inventory"
        method: GET
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
        status_code: [200, 404]
      register: r_inv1_check

    - name: "Module 1.4: Evaluate and log result"
      ansible.builtin.set_fact:
        grader_output_message: "{{ 'PASS: AWS Inventory exists in AAP' if (r_inv1_check.json.count | default(0) | int > 0) else 'FAIL: AWS Inventory exists in AAP: Inventory not found' }}"

    - name: "Module 1.4: Log result"
      include_role:
        name: ftl_run_log_grade_to_log

    - name: "Module 1.5: Check Network Inventory exists"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}/api/controller/v2/inventories/?name=Network%20Inventory"
        method: GET
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
        status_code: [200, 404]
      register: r_inv2_check

    - name: "Module 1.5: Evaluate and log result"
      ansible.builtin.set_fact:
        grader_output_message: "{{ 'PASS: Network Inventory exists in AAP' if (r_inv2_check.json.count | default(0) | int > 0) else 'FAIL: Network Inventory exists in AAP: Inventory not found' }}"

    - name: "Module 1.5: Log result"
      include_role:
        name: ftl_run_log_grade_to_log

    - name: "Module 1.6: Check RHEL Inventory exists"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}/api/controller/v2/inventories/?name=RHEL%20Inventory"
        method: GET
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
        status_code: [200, 404]
      register: r_inv3_check

    - name: "Module 1.6: Evaluate and log result"
      ansible.builtin.set_fact:
        grader_output_message: "{{ 'PASS: RHEL Inventory exists in AAP' if (r_inv3_check.json.count | default(0) | int > 0) else 'FAIL: RHEL Inventory exists in AAP: Inventory not found' }}"

    - name: "Module 1.6: Log result"
      include_role:
        name: ftl_run_log_grade_to_log

    # ========================================================================
    # Section 1.3: Verify Project Exists and Synced
    # ========================================================================

    - name: "Module 1.7: Check SelfService Demo playbooks project"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}/api/controller/v2/projects/?name=SelfService%20Demo%20playbooks"
        method: GET
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
        status_code: [200, 404]
      register: r_project_check

    - name: "Module 1.7: Evaluate and log result"
      ansible.builtin.set_fact:
        grader_output_message: "{{ 'PASS: Project SelfService Demo playbooks exists and is synced' if (r_project_check.json.count | default(0) | int > 0 and r_project_check.json.results[0].status | default('') == 'successful') else 'FAIL: Project SelfService Demo playbooks exists and is synced: Project not found or not synced' }}"

    - name: "Module 1.7: Log result"
      include_role:
        name: ftl_run_log_grade_to_log

    # ========================================================================
    # Section 1.4: Verify Job Templates Exist
    # ========================================================================

    - name: "Module 1.8: Check Cloud/AWS job templates"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}/api/controller/v2/job_templates/?name__startswith=Cloud/AWS"
        method: GET
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
        status_code: [200, 404]
      register: r_jt1_check

    - name: "Module 1.8: Evaluate and log result"
      ansible.builtin.set_fact:
        grader_output_message: "{{ 'PASS: At least 5 Cloud/AWS job templates exist' if (r_jt1_check.json.count | default(0) | int >= 5) else 'FAIL: At least 5 Cloud/AWS job templates exist: Found ' + (r_jt1_check.json.count | default(0) | string) + ' templates' }}"

    - name: "Module 1.8: Log result"
      include_role:
        name: ftl_run_log_grade_to_log

    - name: "Module 1.9: Check Network job templates"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}/api/controller/v2/job_templates/?name__startswith=Network/"
        method: GET
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
        status_code: [200, 404]
      register: r_jt2_check

    - name: "Module 1.9: Evaluate and log result"
      ansible.builtin.set_fact:
        grader_output_message: "{{ 'PASS: At least 4 Network job templates exist' if (r_jt2_check.json.count | default(0) | int >= 4) else 'FAIL: At least 4 Network job templates exist: Found ' + (r_jt2_check.json.count | default(0) | string) + ' templates' }}"

    - name: "Module 1.9: Log result"
      include_role:
        name: ftl_run_log_grade_to_log

    - name: "Module 1.10: Check Linux/RHEL job templates"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}/api/controller/v2/job_templates/?name__startswith=Linux/RHEL"
        method: GET
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
        status_code: [200, 404]
      register: r_jt3_check

    - name: "Module 1.10: Evaluate and log result"
      ansible.builtin.set_fact:
        grader_output_message: "{{ 'PASS: At least 5 Linux/RHEL job templates exist' if (r_jt3_check.json.count | default(0) | int >= 5) else 'FAIL: At least 5 Linux/RHEL job templates exist: Found ' + (r_jt3_check.json.count | default(0) | string) + ' templates' }}"

    - name: "Module 1.10: Log result"
      include_role:
        name: ftl_run_log_grade_to_log

    # ========================================================================
    # Section 1.5: Verify Self-Service Portal Accessible
    # ========================================================================

    - name: "Module 1.11: Check Self-Service Portal responds"
      ansible.builtin.uri:
        url: "{{ self_service_portal_url }}"
        method: GET
        validate_certs: false
        status_code: [200, 404]
      register: r_portal_check

    - name: "Module 1.11: Evaluate and log result"
      ansible.builtin.set_fact:
        grader_output_message: "{{ 'PASS: Self-Service Portal is accessible' if r_portal_check.status == 200 else 'FAIL: Self-Service Portal is accessible: Portal returned status ' + (r_portal_check.status | string) }}"

    - name: "Module 1.11: Log result"
      include_role:
        name: ftl_run_log_grade_to_log

    - name: "Module 1 grading complete"
      ansible.builtin.debug:
        msg: |
          ✅ Module 1 grading complete

          All pre-configured content verified:
          - ✓ 3 demo users (clouduser1, networkuser1, rheluser1)
          - ✓ 3 inventories (AWS, Network, RHEL)
          - ✓ Project synced
          - ✓ 15+ job templates (Cloud/AWS, Network, Linux/RHEL)
          - ✓ Self-Service Portal accessible

          Students are ready to use the Portal!
