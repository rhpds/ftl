---
# Solve Module 3: Surveys and Custom Templates
# Automatically adds survey question to job template via API

- name: Solve Module 3 - Surveys and Custom Templates
  hosts: localhost
  gather_facts: false
  become: false

  vars:
    aap_gateway_url: "{{ lookup('env', 'AAP_CONTROLLER_URL') }}"
    aap_admin_username: "admin"
    aap_admin_password: "{{ lookup('env', 'AAP_ADMIN_PASSWORD') }}"

  tasks:
    # ========================================================================
    # Section 3.1: Get Job Template and Current Survey Spec
    # ========================================================================

    - name: "Get Linux/RHEL START Service on RHEL job template"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}/api/controller/v2/job_templates/?name=Linux/RHEL START Service on RHEL"
        method: GET
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
        status_code: [200, 404]
      register: r_rhel_start_jt

    - name: "Get current survey spec"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}{{ r_rhel_start_jt.json.results[0].related.survey_spec }}"
        method: GET
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
        status_code: [200, 404]
      register: r_survey_spec
      when: r_rhel_start_jt.json.count | default(0) | int > 0

    - name: "Store current survey questions"
      ansible.builtin.set_fact:
        current_survey_questions: "{{ r_survey_spec.json.spec | default([]) }}"
      when:
        - r_rhel_start_jt.json.count | default(0) | int > 0
        - r_survey_spec.json.spec is defined

    # ========================================================================
    # Section 3.2: Add New Survey Question
    # ========================================================================

    - name: "Check if enable_service question already exists"
      ansible.builtin.set_fact:
        enable_service_exists: "{{ current_survey_questions | selectattr('variable', 'equalto', 'enable_service') | list | length > 0 }}"
      when: current_survey_questions is defined

    - name: "Create new survey question for enable_service"
      ansible.builtin.set_fact:
        new_survey_question:
          question: "Do you want to ENABLE the service (starts after a reboot)?"
          description: ""
          variable: "enable_service"
          type: "multiplechoice"
          required: false
          default: ""
          choices:
            - "yes"
            - "no"
      when:
        - current_survey_questions is defined
        - not (enable_service_exists | default(false))

    - name: "Combine existing questions with new question"
      ansible.builtin.set_fact:
        updated_survey_spec:
          name: ""
          description: ""
          spec: "{{ current_survey_questions + [new_survey_question] }}"
      when:
        - current_survey_questions is defined
        - not (enable_service_exists | default(false))
        - new_survey_question is defined

    - name: "Update job template with new survey"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}/api/controller/v2/job_templates/{{ r_rhel_start_jt.json.results[0].id }}/survey_spec/"
        method: POST
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
        body_format: json
        body: "{{ updated_survey_spec }}"
        status_code: [200, 201, 400]
      when:
        - r_rhel_start_jt.json.count | default(0) | int > 0
        - updated_survey_spec is defined
      register: r_survey_update

    - name: "Enable survey on job template"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}/api/controller/v2/job_templates/{{ r_rhel_start_jt.json.results[0].id }}/"
        method: PATCH
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
        body_format: json
        body:
          survey_enabled: true
        status_code: [200, 400]
      when: r_rhel_start_jt.json.count | default(0) | int > 0

    - name: "Module 3 solve complete"
      ansible.builtin.debug:
        msg: "✅ Module 3 solve complete - Survey question added to Linux/RHEL START Service job template"
