---
# Solve Module 1: Configure AAP for Self-Service Portal (UI-Based)
# This solver uses browser automation to mirror actual student UI interactions

- name: Solve Module 1 - Configure AAP RBAC and Portal RBAC via UI
  hosts: localhost
  gather_facts: false
  become: false

  vars:
    aap_controller_url: "{{ lookup('env', 'AAP_CONTROLLER_URL') }}"
    aap_admin_username: "admin"
    aap_admin_password: "{{ lookup('env', 'AAP_ADMIN_PASSWORD') }}"
    self_service_portal_url: "{{ lookup('env', 'SELF_SERVICE_PORTAL_URL') }}"

    # Teams to create
    teams:
      - name: "cloud-team"
        description: "Cloud automation team"
        users: ["clouduser1"]
        job_templates_filter: "Cloud/AWS"
        inventories: ["AWS Inventory", "Azure Inventory", "GCP Inventory"]
        credentials: ["AWS Credential", "Azure Credential", "RHEL - SSH Credentials"]

      - name: "network-team"
        description: "Network automation team"
        users: ["networkuser1"]
        job_templates_filter: "Network/"
        inventories: ["Network Inventory"]
        credentials: ["Network Credential"]

      - name: "rhel-team"
        description: "RHEL automation team"
        users: ["rheluser1"]
        job_templates_filter: "Linux/RHEL"
        job_templates_additional: ["Cloud/AWS Create RHEL10 instance", "Cloud/AWS Create RHEL9 instance", "RHEL / Update RHEL Time Servers"]
        inventories: ["RHEL Inventory", "AWS Inventory"]
        credentials: ["AWS Credential", "RHEL - SSH Credentials"]

  tasks:
    # ========================================================================
    # Part 1: Login to AAP Controller
    # ========================================================================

    - name: Login to AAP Controller as admin
      include_role:
        name: solver_browser_action
      vars:
        url: "{{ aap_controller_url }}"
        action: "login"
        username: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"

    # ========================================================================
    # Part 2: Create Teams in AAP
    # ========================================================================

    - name: Create teams in AAP via UI
      include_tasks: create_team_ui.yml
      loop: "{{ teams }}"
      loop_control:
        loop_var: team

# ========================================================================
# Separate task file for creating teams (to be included)
# ========================================================================
