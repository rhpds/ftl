---
# Grade Module 1: Configure AAP for Self-Service Portal
# Validates that students created teams and assigned proper RBAC

- name: Initialize FTL Grading Session
  hosts: localhost
  gather_facts: false
  become: false
  vars:
    lab_id: "AAP Self-Service Portal - Module 1"
    student_name: "{{ lookup('env', 'OPENSHIFT_USERNAME') | default('student') }}"
    guid: "{{ lookup('env', 'GUID') | default('j7kml') }}"
  roles:
    - ftl_run_init

- name: Grade Module 1 - Configure AAP RBAC
  hosts: localhost
  gather_facts: false
  become: false

  vars:
    aap_gateway_url: "{{ lookup('env', 'AAP_CONTROLLER_URL') }}"
    aap_admin_username: "admin"
    aap_admin_password: "{{ lookup('env', 'AAP_ADMIN_PASSWORD') }}"

  tasks:
    # ========================================================================
    # Section 1.1: Verify Teams Created
    # ========================================================================

    - name: "Module 1.1: Check cloud-team exists"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}/api/gateway/v1/teams/?name=cloud-team"
        method: GET
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
        status_code: [200, 404]
      register: r_cloud_team

    - name: "Module 1.1: Evaluate and log result"
      ansible.builtin.set_fact:
        grader_output_message: "{{ 'PASS: Team cloud-team created' if (r_cloud_team.json.count | default(0) | int > 0) else 'FAIL: Team cloud-team created: Team not found. Create cloud-team in Access Management > Teams' }}"

    - name: "Module 1.1: Log result"
      include_role:
        name: ftl_run_log_grade_to_log

    - name: "Module 1.2: Check network-team exists"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}/api/gateway/v1/teams/?name=network-team"
        method: GET
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
        status_code: [200, 404]
      register: r_network_team

    - name: "Module 1.2: Evaluate and log result"
      ansible.builtin.set_fact:
        grader_output_message: "{{ 'PASS: Team network-team created' if (r_network_team.json.count | default(0) | int > 0) else 'FAIL: Team network-team created: Team not found. Create network-team in Access Management > Teams' }}"

    - name: "Module 1.2: Log result"
      include_role:
        name: ftl_run_log_grade_to_log

    - name: "Module 1.3: Check rhel-team exists"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}/api/gateway/v1/teams/?name=rhel-team"
        method: GET
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
        status_code: [200, 404]
      register: r_rhel_team

    - name: "Module 1.3: Evaluate and log result"
      ansible.builtin.set_fact:
        grader_output_message: "{{ 'PASS: Team rhel-team created' if (r_rhel_team.json.count | default(0) | int > 0) else 'FAIL: Team rhel-team created: Team not found. Create rhel-team in Access Management > Teams' }}"

    - name: "Module 1.3: Log result"
      include_role:
        name: ftl_run_log_grade_to_log

    # ========================================================================
    # Section 1.2: Verify Team Membership
    # ========================================================================

    - name: "Module 1.4: Get cloud-team users"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}{{ r_cloud_team.json.results[0].related.users }}"
        method: GET
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
        status_code: [200, 404]
      register: r_cloud_users
      when: r_cloud_team.json.count | default(0) | int > 0

    - name: "Module 1.4: Evaluate and log result"
      ansible.builtin.set_fact:
        grader_output_message: "{{ 'PASS: clouduser1 assigned to cloud-team' if (r_cloud_users.json.results | default([]) | selectattr('username', 'equalto', 'clouduser1') | list | length > 0) else 'FAIL: clouduser1 assigned to cloud-team: User not in team. Assign clouduser1 to cloud-team in Users tab' }}"
      when: r_cloud_team.json.count | default(0) | int > 0

    - name: "Module 1.4: Log result"
      include_role:
        name: ftl_run_log_grade_to_log
      when: r_cloud_team.json.count | default(0) | int > 0

    - name: "Module 1.5: Get network-team users"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}{{ r_network_team.json.results[0].related.users }}"
        method: GET
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
        status_code: [200, 404]
      register: r_network_users
      when: r_network_team.json.count | default(0) | int > 0

    - name: "Module 1.5: Evaluate and log result"
      ansible.builtin.set_fact:
        grader_output_message: "{{ 'PASS: networkuser1 assigned to network-team' if (r_network_users.json.results | default([]) | selectattr('username', 'equalto', 'networkuser1') | list | length > 0) else 'FAIL: networkuser1 assigned to network-team: User not in team. Assign networkuser1 to network-team in Users tab' }}"
      when: r_network_team.json.count | default(0) | int > 0

    - name: "Module 1.5: Log result"
      include_role:
        name: ftl_run_log_grade_to_log
      when: r_network_team.json.count | default(0) | int > 0

    - name: "Module 1.6: Get rhel-team users"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}{{ r_rhel_team.json.results[0].related.users }}"
        method: GET
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
        status_code: [200, 404]
      register: r_rhel_users
      when: r_rhel_team.json.count | default(0) | int > 0

    - name: "Module 1.6: Evaluate and log result"
      ansible.builtin.set_fact:
        grader_output_message: "{{ 'PASS: rheluser1 assigned to rhel-team' if (r_rhel_users.json.results | default([]) | selectattr('username', 'equalto', 'rheluser1') | list | length > 0) else 'FAIL: rheluser1 assigned to rhel-team: User not in team. Assign rheluser1 to rhel-team in Users tab' }}"
      when: r_rhel_team.json.count | default(0) | int > 0

    - name: "Module 1.6: Log result"
      include_role:
        name: ftl_run_log_grade_to_log
      when: r_rhel_team.json.count | default(0) | int > 0

    # ========================================================================
    # Section 1.3: Verify cloud-team Role Assignments
    # ========================================================================

    - name: "Module 1.7: Get cloud-team roles via Controller API"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}/api/controller/v2/role_team_assignments/?team__id={{ r_cloud_team.json.results[0].id }}"
        method: GET
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
      register: r_cloud_team_roles
      when: r_cloud_team.json.count | default(0) | int > 0

    - name: "Module 1.7: Check cloud-team has role assignments"
      ansible.builtin.set_fact:
        cloud_team_has_roles: "{{ r_cloud_team_roles.json.count | default(0) | int > 0 }}"
      when: r_cloud_team.json.count | default(0) | int > 0

    - name: "Module 1.7: Evaluate and log result"
      ansible.builtin.set_fact:
        grader_output_message: "{{ 'PASS: cloud-team has role assignments configured' if (cloud_team_has_roles | default(false)) else 'FAIL: cloud-team has role assignments configured: No roles found. Assign Execute permission on Cloud/AWS job templates, Use permission on AWS/Azure/GCP inventories and credentials' }}"
      when: r_cloud_team.json.count | default(0) | int > 0

    - name: "Module 1.7: Log result"
      include_role:
        name: ftl_run_log_grade_to_log
      when: r_cloud_team.json.count | default(0) | int > 0

    # ========================================================================
    # Section 1.4: Verify network-team Role Assignments
    # ========================================================================

    - name: "Module 1.8: Get network-team roles via Controller API"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}/api/controller/v2/role_team_assignments/?team__id={{ r_network_team.json.results[0].id }}"
        method: GET
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
      register: r_network_team_roles
      when: r_network_team.json.count | default(0) | int > 0

    - name: "Module 1.8: Check network-team has role assignments"
      ansible.builtin.set_fact:
        network_team_has_roles: "{{ r_network_team_roles.json.count | default(0) | int > 0 }}"
      when: r_network_team.json.count | default(0) | int > 0

    - name: "Module 1.8: Evaluate and log result"
      ansible.builtin.set_fact:
        grader_output_message: "{{ 'PASS: network-team has role assignments configured' if (network_team_has_roles | default(false)) else 'FAIL: network-team has role assignments configured: No roles found. Assign Execute permission on Network/ job templates, Use permission on Network inventory and credential' }}"
      when: r_network_team.json.count | default(0) | int > 0

    - name: "Module 1.8: Log result"
      include_role:
        name: ftl_run_log_grade_to_log
      when: r_network_team.json.count | default(0) | int > 0

    # ========================================================================
    # Section 1.5: Verify rhel-team Role Assignments
    # ========================================================================

    - name: "Module 1.9: Get rhel-team roles via Controller API"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}/api/controller/v2/role_team_assignments/?team__id={{ r_rhel_team.json.results[0].id }}"
        method: GET
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
      register: r_rhel_team_roles
      when: r_rhel_team.json.count | default(0) | int > 0

    - name: "Module 1.9: Check rhel-team has role assignments"
      ansible.builtin.set_fact:
        rhel_team_has_roles: "{{ r_rhel_team_roles.json.count | default(0) | int > 0 }}"
      when: r_rhel_team.json.count | default(0) | int > 0

    - name: "Module 1.9: Evaluate and log result"
      ansible.builtin.set_fact:
        grader_output_message: "{{ 'PASS: rhel-team has role assignments configured' if (rhel_team_has_roles | default(false)) else 'FAIL: rhel-team has role assignments configured: No roles found. Assign Execute permission on Linux/RHEL job templates, Use permission on RHEL/AWS inventories and credentials' }}"
      when: r_rhel_team.json.count | default(0) | int > 0

    - name: "Module 1.9: Log result"
      include_role:
        name: ftl_run_log_grade_to_log
      when: r_rhel_team.json.count | default(0) | int > 0

    # ========================================================================
    # Section 1.6: Verify Portal RBAC Policies
    # ========================================================================

    - name: "Module 1.10: Check Portal RBAC policies via HTML parsing"
      shell: |
        python3 << 'PYTHON_SCRIPT'
        from playwright.sync_api import sync_playwright
        import os
        import sys

        portal_url = os.environ['SELF_SERVICE_PORTAL_URL']
        username = "admin"
        password = os.environ['AAP_ADMIN_PASSWORD']

        try:
            with sync_playwright() as p:
                browser = p.chromium.launch(headless=True)
                context = browser.new_context(ignore_https_errors=True)
                page = context.new_page()

                # Login
                page.goto(portal_url, timeout=60000)
                page.wait_for_load_state('networkidle')

                try:
                    page.click("button:has-text('Sign In')", timeout=10000)
                    page.wait_for_load_state('networkidle', timeout=30000)
                except:
                    pass

                page.wait_for_timeout(3000)
                username_input = page.locator("input[type='text'], input[name='username']").first
                if username_input.is_visible(timeout=5000):
                    username_input.fill(username)
                password_input = page.locator("input[type='password']").first
                if password_input.is_visible(timeout=5000):
                    password_input.fill(password)
                page.click("button:has-text('Log in')", timeout=5000)
                page.wait_for_load_state('networkidle', timeout=60000)

                # Navigate to RBAC page
                page.wait_for_selector('text=Templates', timeout=10000)
                page.wait_for_timeout(2000)
                page.click('text=Administration', timeout=10000)
                page.wait_for_timeout(2000)
                page.click('text=RBAC', timeout=10000)
                page.wait_for_load_state('networkidle')
                page.wait_for_timeout(3000)

                # Parse HTML for policies
                page_text = page.inner_text('body')

                # Check for policies
                ssa_users_found = 'ssa-portal-users' in page_text
                ssa_rhel_found = 'ssa-portal-rhel-team' in page_text

                browser.close()

                # Output JSON for Ansible parsing
                import json
                print(json.dumps({
                    "ssa_users_found": ssa_users_found,
                    "ssa_rhel_found": ssa_rhel_found
                }))

                sys.exit(0)

        except Exception as e:
            print(json.dumps({
                "ssa_users_found": False,
                "ssa_rhel_found": False,
                "error": str(e)
            }))
            sys.exit(0)
        PYTHON_SCRIPT
      environment:
        SELF_SERVICE_PORTAL_URL: "{{ lookup('env', 'SELF_SERVICE_PORTAL_URL') }}"
        AAP_ADMIN_PASSWORD: "{{ aap_admin_password }}"
      register: r_portal_rbac
      ignore_errors: true

    - name: "Module 1.10: Parse Portal RBAC result"
      ansible.builtin.set_fact:
        portal_rbac_result: "{{ r_portal_rbac.stdout | from_json }}"
      when: r_portal_rbac.rc == 0

    - name: "Module 1.10: Evaluate ssa-portal-users policy"
      ansible.builtin.set_fact:
        grader_output_message: "{{ 'PASS: Portal policy ssa-portal-users created' if (portal_rbac_result.ssa_users_found | default(false)) else 'FAIL: Portal policy ssa-portal-users created: Policy not found. Create role ssa-portal-users in Self-Service Portal > Administration > RBAC' }}"

    - name: "Module 1.10: Log result"
      include_role:
        name: ftl_run_log_grade_to_log

    - name: "Module 1.11: Evaluate saa-portal-rhel-team policy"
      ansible.builtin.set_fact:
        grader_output_message: "{{ 'PASS: Portal policy saa-portal-rhel-team created' if (portal_rbac_result.ssa_rhel_found | default(false)) else 'FAIL: Portal policy saa-portal-rhel-team created: Policy not found. Create role saa-portal-rhel-team in Self-Service Portal > Administration > RBAC' }}"

    - name: "Module 1.11: Log result"
      include_role:
        name: ftl_run_log_grade_to_log

    - name: "Module 1 grading complete"
      ansible.builtin.debug:
        msg: "✅ Module 1 grading complete - AAP RBAC and Portal RBAC verified (11 checkpoints)"

- name: Generate Grading Report
  hosts: localhost
  gather_facts: false
  become: false
  roles:
    - ftl_run_grade_report_generation
    - ftl_run_finish
