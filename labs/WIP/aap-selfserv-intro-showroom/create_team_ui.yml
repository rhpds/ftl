---
# Task file: Create team via AAP UI
# This file is included in solve_module_01_ui.yml for each team

- name: "Navigate to Teams page for {{ team.name }}"
  include_role:
    name: solver_browser_action
  vars:
    url: "{{ aap_controller_url }}/#/teams"
    action: "navigate"

- name: "Click Create Team button for {{ team.name }}"
  include_role:
    name: solver_browser_action
  vars:
    url: "{{ aap_controller_url }}/#/teams"
    action: "click"
    selector: 'button[data-cy="create-team"], button:has-text("Create Team")'

- name: "Fill team name: {{ team.name }}"
  include_role:
    name: solver_browser_action
  vars:
    url: "{{ aap_controller_url }}/#/teams/add"
    action: "fill_form"
    selector: 'input[id="name"], input[name="name"]'
    text: "{{ team.name }}"

- name: "Fill team description for {{ team.name }}"
  include_role:
    name: solver_browser_action
  vars:
    url: "{{ aap_controller_url }}/#/teams/add"
    action: "fill_form"
    selector: 'textarea[id="description"], textarea[name="description"]'
    text: "{{ team.description }}"

- name: "Select organization for {{ team.name }}"
  include_role:
    name: solver_browser_action
  vars:
    url: "{{ aap_controller_url }}/#/teams/add"
    action: "click"
    selector: 'select[name="organization"] option:has-text("Default")'

- name: "Click Create team button to save {{ team.name }}"
  include_role:
    name: solver_browser_action
  vars:
    url: "{{ aap_controller_url }}/#/teams/add"
    action: "click"
    selector: 'button[type="submit"]:has-text("Create team"), button:has-text("Save")'

- name: "Verify {{ team.name}} created successfully"
  include_role:
    name: solver_browser_action
  vars:
    url: "{{ aap_controller_url }}/#/teams"
    action: "wait_for_text"
    text: "{{ team.name }}"

- name: Display team creation success
  ansible.builtin.debug:
    msg: "✅ Team '{{ team.name }}' created successfully via UI"
