---
# =============================================================================
# FTL Solver: OpenShift 4 Getting Started - Full Lab
# =============================================================================
#
# Runs all module solvers in sequence (1 → 2 → 3).
#
# Usage via wrapper (recommended):
#   solve_lab ocp4-getting-started user1
#
# Or directly:
#   export LAB_USER="user1"
#   ansible-playbook solve_lab.yml
#
# =============================================================================

- name: Solve Module 1
  ansible.builtin.import_playbook: solve_module_01.yml

- name: Solve Module 2
  ansible.builtin.import_playbook: solve_module_02.yml

- name: Solve Module 3
  ansible.builtin.import_playbook: solve_module_03.yml
