---
# =============================================================================
# FTL Solver: OpenShift 4 Getting Started - Module 3
# =============================================================================
#
# Automatically completes Module 3 tasks:
# 1. Create PersistentVolumeClaim for pipeline workspace
# 2. Create Tekton pipeline definition
# 3. Create Tekton Triggers (TriggerTemplate, TriggerBinding, EventListener)
# 4. Create Gitea webhook via API pointing to EventListener
# 5. Clone repo from Gitea, make code change, push to trigger pipeline
# 6. Wait for webhook-triggered pipeline run to complete
#
# Environment Variables Required:
#   - LAB_USER: Student user (e.g., user1) - sets project to wksp-<user>
#   - PASSWORD: User password (used for Gitea auth)
#
# Usage via wrapper (recommended):
#   solve_lab ocp4-getting-started user1 3
#
# Or directly:
#   export LAB_USER="user1"
#   export PASSWORD="secret"
#   ansible-playbook solve_module_03.yml
#
# =============================================================================

- name: Solve Module 3 - CI/CD with Tekton Pipelines
  hosts: localhost
  gather_facts: false
  become: false

  vars:
    project_name: "wksp-{{ lookup('env', 'LAB_USER') | default('user1', true) }}"
    lab_user: "{{ lookup('env', 'LAB_USER') | default('user1', true) }}"
    lab_password: "{{ lookup('env', 'PASSWORD') | default(lookup('env', 'OPENSHIFT_PASSWORD'), true) }}"
    gitea_admin_user: "gitea"
    gitea_admin_password: "{{ lookup('env', 'PASSWORD') | default(lookup('env', 'OPENSHIFT_PASSWORD'), true) }}"

  tasks:

    # =========================================================================
    # Discover Gitea URL
    # =========================================================================
    - name: Get Gitea route hostname
      ansible.builtin.command: oc get route -n gitea -o jsonpath='{.items[0].spec.host}'
      register: r_gitea_route
      changed_when: false
      failed_when: false

    - name: Set Gitea URL from route discovery
      when: r_gitea_route.rc == 0 and r_gitea_route.stdout | length > 0
      ansible.builtin.set_fact:
        gitea_host: "{{ r_gitea_route.stdout }}"
        gitea_url: "https://{{ r_gitea_route.stdout }}"

    - name: Fallback - construct Gitea URL from cluster domain
      when: r_gitea_route.rc != 0 or r_gitea_route.stdout | length == 0
      block:
        - name: Get cluster ingress domain
          ansible.builtin.command: oc get ingresses.config.openshift.io cluster -o jsonpath='{.spec.domain}'
          register: r_cluster_domain
          changed_when: false

        - name: Set Gitea URL from cluster domain
          ansible.builtin.set_fact:
            gitea_host: "gitea-gitea.{{ r_cluster_domain.stdout }}"
            gitea_url: "https://gitea-gitea.{{ r_cluster_domain.stdout }}"

    - name: Display solver information
      ansible.builtin.debug:
        msg: |
          ================================================================================
          Solving Module 3: CI/CD with Tekton Pipelines
          ================================================================================
          Project: {{ project_name }}
          Gitea:   {{ gitea_url }}
          ================================================================================

    # =========================================================================
    # Step 1: Create PVC for Pipeline Workspace
    # =========================================================================
    - name: Check if app-source-pvc exists
      kubernetes.core.k8s_info:
        api_version: v1
        kind: PersistentVolumeClaim
        name: app-source-pvc
        namespace: "{{ project_name }}"
      register: r_pvc

    - name: Create app-source-pvc
      when: r_pvc.resources | length == 0
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: app-source-pvc
            namespace: "{{ project_name }}"
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi

    # =========================================================================
    # Step 2: Create Tekton Pipeline
    # =========================================================================
    - name: Check if nationalparks-pipeline exists
      kubernetes.core.k8s_info:
        api_version: tekton.dev/v1
        kind: Pipeline
        name: nationalparks-pipeline
        namespace: "{{ project_name }}"
      register: r_pipeline

    - name: Create nationalparks Tekton pipeline
      when: r_pipeline.resources | length == 0
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: tekton.dev/v1
          kind: Pipeline
          metadata:
            name: nationalparks-pipeline
            namespace: "{{ project_name }}"
          spec:
            params:
              - name: APP_NAME
                type: string
                default: nationalparks
              - name: APP_GIT_URL
                type: string
                default: "{{ gitea_url }}/{{ lab_user }}/nationalparks.git"
              - name: APP_GIT_REVISION
                type: string
                default: master
            workspaces:
              - name: app-source
              - name: maven-settings
            tasks:
              - name: git-clone
                taskRef:
                  resolver: cluster
                  params:
                    - name: kind
                      value: task
                    - name: name
                      value: git-clone
                    - name: namespace
                      value: openshift-pipelines
                params:
                  - name: URL
                    value: $(params.APP_GIT_URL)
                  - name: REVISION
                    value: $(params.APP_GIT_REVISION)
                  - name: SUBMODULES
                    value: "true"
                  - name: DEPTH
                    value: "1"
                  - name: SSL_VERIFY
                    value: "false"
                  - name: DELETE_EXISTING
                    value: "true"
                  - name: VERBOSE
                    value: "true"
                workspaces:
                  - name: output
                    workspace: app-source
              - name: build-and-test
                taskRef:
                  resolver: cluster
                  params:
                    - name: kind
                      value: task
                    - name: name
                      value: maven
                    - name: namespace
                      value: openshift-pipelines
                runAfter:
                  - git-clone
                params:
                  - name: MAVEN_IMAGE
                    value: maven:3.8.3-openjdk-11
                  - name: GOALS
                    value:
                      - package
                  - name: PROXY_PROTOCOL
                    value: http
                workspaces:
                  - name: source
                    workspace: app-source
                  - name: maven_settings
                    workspace: maven-settings
              - name: build-image
                taskRef:
                  resolver: cluster
                  params:
                    - name: kind
                      value: task
                    - name: name
                      value: buildah
                    - name: namespace
                      value: openshift-pipelines
                runAfter:
                  - build-and-test
                params:
                  - name: IMAGE
                    value: image-registry.openshift-image-registry.svc:5000/$(context.pipelineRun.namespace)/$(params.APP_NAME):latest
                  - name: BUILDER_IMAGE
                    value: registry.redhat.io/rhel8/buildah:latest
                  - name: STORAGE_DRIVER
                    value: vfs
                  - name: DOCKERFILE
                    value: ./Dockerfile
                  - name: CONTEXT
                    value: .
                  - name: TLSVERIFY
                    value: "true"
                  - name: FORMAT
                    value: oci
                workspaces:
                  - name: source
                    workspace: app-source
              - name: redeploy
                taskRef:
                  resolver: cluster
                  params:
                    - name: kind
                      value: task
                    - name: name
                      value: openshift-client
                    - name: namespace
                      value: openshift-pipelines
                runAfter:
                  - build-image
                params:
                  - name: SCRIPT
                    value: oc rollout restart deployment/$(params.APP_NAME)

    # =========================================================================
    # Step 3: Create Tekton Triggers
    # =========================================================================
    - name: Create TriggerTemplate
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: triggers.tekton.dev/v1alpha1
          kind: TriggerTemplate
          metadata:
            name: nationalparks
            namespace: "{{ project_name }}"
          spec:
            params:
              - name: git-revision
              - name: git-commit-message
              - name: git-repo-url
              - name: git-repo-name
              - name: content-type
              - name: pusher-name
            resourcetemplates:
              - apiVersion: tekton.dev/v1beta1
                kind: PipelineRun
                metadata:
                  labels:
                    tekton.dev/pipeline: nationalparks-pipeline
                  name: nationalparks-deploy-$(uid)
                spec:
                  params:
                    - name: APP_NAME
                      value: $(tt.params.git-repo-name)
                    - name: APP_GIT_URL
                      value: $(tt.params.git-repo-url)
                    - name: APP_GIT_REVISION
                      value: $(tt.params.git-revision)
                  pipelineRef:
                    name: nationalparks-pipeline
                  workspaces:
                    - name: app-source
                      persistentVolumeClaim:
                        claimName: app-source-pvc
                    - name: maven-settings
                      emptyDir: {}

    - name: Create TriggerBinding
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: triggers.tekton.dev/v1alpha1
          kind: TriggerBinding
          metadata:
            name: nationalparks
            namespace: "{{ project_name }}"
          spec:
            params:
              - name: git-repo-url
                value: $(body.repository.clone_url)
              - name: git-repo-name
                value: $(body.repository.name)
              - name: git-revision
                value: $(body.after)

    - name: Create EventListener
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: triggers.tekton.dev/v1alpha1
          kind: EventListener
          metadata:
            name: nationalparks
            namespace: "{{ project_name }}"
          spec:
            serviceAccountName: pipeline
            triggers:
              - bindings:
                  - ref: nationalparks
                template:
                  ref: nationalparks

    - name: Create EventListener Route
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: route.openshift.io/v1
          kind: Route
          metadata:
            name: el-nationalparks
            namespace: "{{ project_name }}"
            labels:
              app.kubernetes.io/managed-by: EventListener
              app.kubernetes.io/part-of: Triggers
              eventlistener: nationalparks
          spec:
            port:
              targetPort: http-listener
            to:
              kind: Service
              name: el-nationalparks
              weight: 100

    # =========================================================================
    # Step 4: Wait for EventListener and Create Gitea Webhook
    # =========================================================================
    - name: Wait for EventListener deployment to be ready
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        name: el-nationalparks
        namespace: "{{ project_name }}"
      register: r_el_deploy
      until:
        - r_el_deploy.resources | length > 0
        - r_el_deploy.resources[0].status.readyReplicas | default(0) | int >= 1
      retries: 30
      delay: 10

    - name: Get EventListener route URL
      kubernetes.core.k8s_info:
        api_version: route.openshift.io/v1
        kind: Route
        name: el-nationalparks
        namespace: "{{ project_name }}"
      register: r_el_route

    - name: Set EventListener URL
      ansible.builtin.set_fact:
        el_webhook_url: "http://{{ r_el_route.resources[0].spec.host }}/"

    - name: Display webhook info
      ansible.builtin.debug:
        msg: "EventListener webhook URL: {{ el_webhook_url }}"

    - name: Check if Gitea webhook already exists
      ansible.builtin.uri:
        url: "{{ gitea_url }}/api/v1/repos/{{ lab_user }}/nationalparks/hooks"
        method: GET
        user: "{{ gitea_admin_user }}"
        password: "{{ gitea_admin_password }}"
        force_basic_auth: true
        validate_certs: false
        status_code: 200
      register: r_existing_hooks
      failed_when: false

    - name: Create Gitea webhook
      when: >-
        r_existing_hooks.json is not defined or
        r_existing_hooks.json | selectattr('config.url', 'defined') |
        selectattr('config.url', 'equalto', el_webhook_url) | list | length == 0
      ansible.builtin.uri:
        url: "{{ gitea_url }}/api/v1/repos/{{ lab_user }}/nationalparks/hooks"
        method: POST
        user: "{{ gitea_admin_user }}"
        password: "{{ gitea_admin_password }}"
        force_basic_auth: true
        body_format: json
        body:
          type: gitea
          config:
            url: "{{ el_webhook_url }}"
            content_type: json
            secret: ""
          events:
            - push
          active: true
        status_code: [201]
        validate_certs: false
      register: r_webhook

    # =========================================================================
    # Step 5: Clone Repo, Make Code Change, Push to Trigger Pipeline
    # =========================================================================
    - name: Remove temp directory if exists
      ansible.builtin.file:
        path: /tmp/nationalparks-solver
        state: absent

    - name: Clone nationalparks from Gitea
      ansible.builtin.command: >
        git clone
        https://{{ gitea_admin_user }}:{{ gitea_admin_password | urlencode }}@{{ gitea_host }}/{{ lab_user }}/nationalparks.git
        /tmp/nationalparks-solver
      environment:
        GIT_SSL_NO_VERIFY: "true"
      changed_when: true

    - name: Update display name in BackendController.java
      ansible.builtin.replace:
        path: /tmp/nationalparks-solver/src/main/java/com/openshift/evg/roadshow/parks/rest/BackendController.java
        regexp: '"National Parks"'
        replace: '"Amazing National Parks"'
      register: r_code_change

    - name: Configure git user
      when: r_code_change is changed
      ansible.builtin.shell: |
        cd /tmp/nationalparks-solver
        git config user.email "{{ lab_user }}@example.com"
        git config user.name "{{ lab_user }}"
      changed_when: false

    - name: Commit and push code change
      when: r_code_change is changed
      ansible.builtin.shell: |
        cd /tmp/nationalparks-solver
        git add -A
        git commit -m "Update display name to Amazing National Parks"
        git push
      environment:
        GIT_SSL_NO_VERIFY: "true"

    # =========================================================================
    # Step 6: Wait for Webhook-Triggered Pipeline Run
    # =========================================================================
    - name: Wait for webhook-triggered PipelineRun to appear
      kubernetes.core.k8s_info:
        api_version: tekton.dev/v1
        kind: PipelineRun
        namespace: "{{ project_name }}"
        label_selectors:
          - tekton.dev/pipeline=nationalparks-pipeline
      register: r_pipelineruns
      until:
        - r_pipelineruns.resources | length > 0
      retries: 30
      delay: 10

    - name: Wait for pipeline run to complete
      kubernetes.core.k8s_info:
        api_version: tekton.dev/v1
        kind: PipelineRun
        namespace: "{{ project_name }}"
        label_selectors:
          - tekton.dev/pipeline=nationalparks-pipeline
      register: r_pipeline_status
      until:
        - r_pipeline_status.resources | length > 0
        - r_pipeline_status.resources[-1].status.conditions is defined
        - r_pipeline_status.resources[-1].status.conditions | selectattr('type', 'equalto', 'Succeeded') | list | length > 0
        - r_pipeline_status.resources[-1].status.conditions | selectattr('type', 'equalto', 'Succeeded') | first | json_query('status') in ['True', 'False']
      retries: 120
      delay: 10

    # =========================================================================
    # Cleanup
    # =========================================================================
    - name: Remove temp directory
      ansible.builtin.file:
        path: /tmp/nationalparks-solver
        state: absent

    # =========================================================================
    # Summary
    # =========================================================================
    - name: Get pipeline run result
      ansible.builtin.set_fact:
        pipeline_result: "{{ r_pipeline_status.resources[-1].status.conditions | selectattr('type', 'equalto', 'Succeeded') | first | json_query('reason') }}"

    - name: Display completion summary
      ansible.builtin.debug:
        msg: |
          ================================================================================
          Module 3 Solver Completed Successfully
          ================================================================================

          Resources created:
            - PVC: app-source-pvc (1Gi for pipeline workspace)
            - Pipeline: nationalparks-pipeline
            - TriggerTemplate: nationalparks
            - TriggerBinding: nationalparks
            - EventListener: nationalparks
            - Route: el-nationalparks
            - Gitea webhook: {{ el_webhook_url }}

          Code change:
            - Updated "National Parks" to "Amazing National Parks" in BackendController.java
            - Pushed to Gitea, triggered webhook pipeline run

          Pipeline run result: {{ pipeline_result }}

          Next steps:
            - View pipeline runs: oc get pipelineruns -n {{ project_name }}
            - Verify change: curl -k https://nationalparks-{{ project_name }}.{{ gitea_host.split('.', 1)[1] | default('') }}/ws/info/
            - Grade Module 3: grade_lab ocp4-getting-started 3
            - Grade full lab: grade_lab ocp4-getting-started

          ================================================================================
