---
# =============================================================================
# Grade Module 1: Establish Software Composition Trust with SBOMs
# =============================================================================
#
# Validates:
# - Exercise 1.1: KeycloakRealmImport "tpa" completed in tssc-keycloak
# - Exercise 1.2: Secret "tpa-realm-cli-clients" exists in tssc-tpa (key: cli)
# - Exercise 1.3: TrustedProfileAnalyzer CR "trustedprofileanalyzer" in tssc-tpa
# - Exercise 1.4: RHTPA server pod Running in tssc-tpa
# - Exercise 1.5: SBOM uploaded to RHTPA (at least one SBOM in inventory)
#
# Environment Variables Required:
#   - OPENSHIFT_CLUSTER_INGRESS_DOMAIN: OCP apps domain
#
# Auto-discovered by grade_lab wrapper (do NOT set manually):
#   - PASSWORD: user password = TPA CLI client secret for this lab
#
# Usage:
#   OCP_API_URL="https://api.cluster-xxxx.dynamic.redhatworkshops.io:6443" \
#   OCP_ADMIN_PASSWORD="<admin-pass>" \
#   OPENSHIFT_CLUSTER_INGRESS_DOMAIN="apps.cluster-xxxx.dynamic.redhatworkshops.io" \
#   grade_lab build-secure-dev-workflow-rhads student 1 --podman
# =============================================================================


# =============================================================================
# Play 1: Initialize Grading Session
# =============================================================================
- name: Initialize FTL Grading Session - Module 1
  hosts: localhost
  gather_facts: false
  become: false
  vars:
    lab_id: "Build Secure Dev Workflows (RHADS) - Module 1: Establish Software Composition Trust"
    module_number: "01"
    student_name: "{{ lookup('env', 'LAB_USER') | default('student') }}"
    grader_student_report_file: "grading_report_{{ lookup('env', 'LAB_USER') | default(lookup('env', 'USER')) | default('student') }}_module_01.txt"
  roles:
    - ftl_run_init


# =============================================================================
# Play 2: Grade Module 1
# =============================================================================
- name: Grade Module 1 - Establish Software Composition Trust with SBOMs
  hosts: localhost
  gather_facts: false
  become: false

  vars:
    ingress_domain: "{{ lookup('env', 'OPENSHIFT_CLUSTER_INGRESS_DOMAIN') }}"
    # TPA CLI client secret equals PASSWORD for this lab (both are common_password)
    tpa_cli_client_secret: "{{ lookup('env', 'PASSWORD') }}"
    tpa_realm: "tpa"
    tpa_server_url: "https://server-tssc-tpa.{{ ingress_domain }}"
    keycloak_url: "https://sso.{{ ingress_domain }}"
    grader_student_report_file: "grading_report_{{ lookup('env', 'LAB_USER') | default(lookup('env', 'USER')) | default('student') }}_module_01.txt"

  tasks:
    # =========================================================================
    # Environment Variable Validation
    # =========================================================================
    - name: Validate required environment variables
      ansible.builtin.assert:
        that:
          - ingress_domain | length > 0
        fail_msg: |
          Required environment variable not set:
          - OPENSHIFT_CLUSTER_INGRESS_DOMAIN: OCP cluster apps domain

          Example:
            export OPENSHIFT_CLUSTER_INGRESS_DOMAIN="apps.cluster-xxxx.dynamic.redhatworkshops.io"

          Or run via grade_lab wrapper with OCP_API_URL + OCP_ADMIN_PASSWORD
          for full auto-discovery from the Showroom ConfigMap.

    # =========================================================================
    # Exercise 1.1: TPA Realm Import Completed in tssc-keycloak
    # =========================================================================
    # Student action (Module 1, Step 1.1):
    #   envsubst '${TPA_REALM} ${TPA_CLI_CLIENT_SECRET} ...' \
    #     < ~/lab-assets/keycloak-tpa-realm.yml | oc apply -n tssc-keycloak -f -
    # Creates: KeycloakRealmImport "tpa" in tssc-keycloak
    # Note: KeycloakRealmImport "sso" is pre-deployed by AgnosticD — "tpa" is the student's
    - name: "Exercise 1.1: Get KeycloakRealmImport 'tpa' from tssc-keycloak"
      kubernetes.core.k8s_info:
        api_version: k8s.keycloak.org/v2alpha1
        kind: KeycloakRealmImport
        name: tpa
        namespace: tssc-keycloak
      register: r_realm_import
      failed_when: false

    - name: "Exercise 1.1: Evaluate TPA realm import status"
      ansible.builtin.set_fact:
        grader_output_message: "{{
          'PASS: Exercise 1.1: KeycloakRealmImport tpa exists and is Done in tssc-keycloak'
          if (r_realm_import.resources | length > 0) and
             (r_realm_import.resources[0].status.conditions |
              selectattr('type', 'equalto', 'Done') |
              selectattr('status', 'equalto', 'True') |
              list | length > 0)
          else 'FAIL: Exercise 1.1: KeycloakRealmImport tpa not found or not Done in tssc-keycloak'
        }}"

    - name: "Exercise 1.1: Log result"
      ansible.builtin.include_role:
        name: ftl_run_log_grade_to_log
      vars:
        task_description_message: "Exercise 1.1: TPA Keycloak realm import completed"
        student_error_message: |
          KeycloakRealmImport 'tpa' not found or not completed in tssc-keycloak.

          Create it (Module 1, Step 1.1) by running in the Showroom terminal:
            envsubst '${TPA_REALM} ${TPA_CLI_CLIENT_SECRET} ${TPA_ADMIN_USERNAME} ${TPA_ADMIN_PASSWORD}' \
              < ~/lab-assets/keycloak-tpa-realm.yml | oc apply -n tssc-keycloak -f -

          Then switch to the OpenShift Console → tssc-keycloak project → Installed
          Operators → RHBK Operator → KeycloakRealmImport tab and wait for Done.

          Check status via CLI:
            oc get keycloakrealmimport tpa -n tssc-keycloak
            oc get keycloakrealmimport tpa -n tssc-keycloak \
              -o jsonpath='{.status.conditions[*]}'

    # =========================================================================
    # Exercise 1.2: Secret tpa-realm-cli-clients exists in tssc-tpa
    # =========================================================================
    # Student action (Module 1, Step 2.1):
    #   envsubst < ~/lab-assets/tpa-cli-credentials.yml | oc apply -n tssc-tpa -f -
    # Creates: Secret "tpa-realm-cli-clients" with key "cli" in tssc-tpa
    - name: "Exercise 1.2: Verify Secret tpa-realm-cli-clients in tssc-tpa"
      ansible.builtin.include_role:
        name: grader_check_ocp_secret_exists
      vars:
        task_description_message: "Exercise 1.2: TPA CLI client secret created in tssc-tpa"
        secret_name: tpa-realm-cli-clients
        secret_namespace: tssc-tpa
        required_keys:
          - cli
        student_error_message: |
          Secret 'tpa-realm-cli-clients' not found in tssc-tpa (or missing 'cli' key).

          Create it (Module 1, Step 2.1) by running in the Showroom terminal:
            envsubst < ~/lab-assets/tpa-cli-credentials.yml | oc apply -n tssc-tpa -f -

          Verify:
            oc get secret tpa-realm-cli-clients -n tssc-tpa

    # =========================================================================
    # Exercise 1.3: TrustedProfileAnalyzer CR deployed in tssc-tpa
    # =========================================================================
    # Student action (Module 1, Step 2.2):
    #   envsubst < ~/lab-assets/tpa-instance.yml | oc apply -n tssc-tpa -f -
    # Creates: TrustedProfileAnalyzer "trustedprofileanalyzer" in tssc-tpa
    - name: "Exercise 1.3: Verify TrustedProfileAnalyzer CR in tssc-tpa"
      ansible.builtin.include_role:
        name: grader_check_ocp_resource
      vars:
        task_description_message: "Exercise 1.3: RHTPA TrustedProfileAnalyzer CR deployed"
        resource_api_version: "rhtpa.io/v1"
        resource_kind: TrustedProfileAnalyzer
        resource_name: trustedprofileanalyzer
        resource_namespace: tssc-tpa
        student_error_message: |
          TrustedProfileAnalyzer 'trustedprofileanalyzer' not found in tssc-tpa.

          Deploy the RHTPA instance (Module 1, Step 2.2) by running:
            envsubst < ~/lab-assets/tpa-instance.yml | oc apply -n tssc-tpa -f -

          Verify:
            oc get trustedprofileanalyzer -n tssc-tpa

    # =========================================================================
    # Exercise 1.4: RHTPA Server Pod Running in tssc-tpa
    # =========================================================================
    # Student action (consequence of Step 2.2 — RHTPA operator provisions the server)
    # Pod label: app.kubernetes.io/component=server in tssc-tpa
    # May take 2-5 minutes after the TrustedProfileAnalyzer CR is created
    - name: "Exercise 1.4: Get RHTPA server pods in tssc-tpa"
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        namespace: tssc-tpa
        label_selectors:
          - "app.kubernetes.io/component=server"
      register: r_tpa_server_pods
      failed_when: false

    - name: "Exercise 1.4: Evaluate RHTPA server pod status"
      ansible.builtin.set_fact:
        grader_output_message: "{{
          'PASS: Exercise 1.4: RHTPA server pod is Running in tssc-tpa'
          if r_tpa_server_pods.resources | length > 0 and
             r_tpa_server_pods.resources |
               selectattr('status.phase', 'equalto', 'Running') |
               list | length > 0
          else 'FAIL: Exercise 1.4: RHTPA server pod not found or not Running in tssc-tpa'
        }}"

    - name: "Exercise 1.4: Log result"
      ansible.builtin.include_role:
        name: ftl_run_log_grade_to_log
      vars:
        task_description_message: "Exercise 1.4: RHTPA server pod Running"
        student_error_message: |
          The RHTPA server pod is not running in tssc-tpa.

          This pod is created automatically by the RHTPA operator after the
          TrustedProfileAnalyzer CR is applied (Exercise 1.3). Allow 2-5 minutes.

          Monitor progress:
            oc get pods -n tssc-tpa -w
            oc describe trustedprofileanalyzer trustedprofileanalyzer -n tssc-tpa

          If nothing appears after 5 minutes, check operator logs:
            oc logs -n tssc-tpa deploy/rhtpa-operator-controller-manager

    # =========================================================================
    # Exercise 1.5: SBOM Uploaded to RHTPA
    # =========================================================================
    # Student action (Module 1, Step 3.1):
    #   Get OIDC token from Keycloak and POST SBOM to /api/v2/sbom?id=test-sbom
    # Check: at least one SBOM exists in the RHTPA inventory
    - name: "Exercise 1.5: Get OIDC token from Keycloak (TPA CLI client)"
      ansible.builtin.uri:
        url: "{{ keycloak_url }}/realms/{{ tpa_realm }}/protocol/openid-connect/token"
        method: POST
        body_format: form-urlencoded
        body:
          grant_type: client_credentials
          client_id: "cli"
          client_secret: "{{ tpa_cli_client_secret }}"
        validate_certs: false
        status_code: [200, 400, 401, 404, 503]
      register: r_tpa_token
      failed_when: false
      no_log: true

    - name: "Exercise 1.5: Query RHTPA SBOM inventory"
      when:
        - r_tpa_token is not skipped
        - r_tpa_token.status is defined
        - r_tpa_token.status == 200
        - r_tpa_token.json.access_token is defined
      ansible.builtin.uri:
        url: "{{ tpa_server_url }}/api/v2/sbom?offset=0&limit=1"
        method: GET
        headers:
          Authorization: "Bearer {{ r_tpa_token.json.access_token }}"
        validate_certs: false
        status_code: [200, 401, 404, 503]
      register: r_tpa_sbom_list
      failed_when: false

    - name: "Exercise 1.5: Evaluate SBOM upload"
      ansible.builtin.set_fact:
        grader_output_message: "{{
          'PASS: Exercise 1.5: SBOM uploaded to RHTPA (' +
            (r_tpa_sbom_list.json.total | default(0) | string) + ' SBOM(s) in inventory)'
          if r_tpa_token is not skipped and
             (r_tpa_token.status | default(0)) == 200 and
             r_tpa_sbom_list is not skipped and
             (r_tpa_sbom_list.status | default(0)) == 200 and
             (r_tpa_sbom_list.json.total | default(0) | int) > 0
          else 'FAIL: Exercise 1.5: No SBOM found in RHTPA — complete Module 1 Step 3 to upload the example SBOM'
        }}"

    - name: "Exercise 1.5: Log result"
      ansible.builtin.include_role:
        name: ftl_run_log_grade_to_log
      vars:
        task_description_message: "Exercise 1.5: SBOM uploaded to RHTPA"
        student_error_message: |
          No SBOM found in RHTPA, or the server is not reachable.

          Exercises 1.1-1.4 must pass first (TPA realm, secret, CR, and server pod).

          Upload the SBOM (Module 1, Step 3.1) from the Showroom terminal:
            export TPA_SERVER_URL="https://$(oc get route \
              -l app.kubernetes.io/component=server -n tssc-tpa \
              -o jsonpath='{.items[0].spec.host}')"

            TOKEN_EP=$(curl -s "$KEYCLOAK_URL/realms/$TPA_REALM/.well-known/openid-configuration" \
              | jq -r .token_endpoint)

            TOKEN=$(curl -s -X POST "$TOKEN_EP" \
              -d grant_type=client_credentials \
              -d client_id="cli" \
              -d client_secret="$TPA_CLI_CLIENT_SECRET" | jq -r .access_token)

            curl -X POST "${TPA_SERVER_URL}/api/v2/sbom?id=test-sbom" \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Content-Type: application/json" \
              --data-binary @/home/lab-user/lab-assets/example-sbom.json

          A successful upload returns {"id":"urn:uuid:..."}.
          If the token request fails, ensure Exercise 1.1 is complete.


# =============================================================================
# Play 3: Finalize Grading Session
# =============================================================================
- name: Finalize FTL Grading Session - Module 1
  hosts: localhost
  gather_facts: false
  vars:
    module_number: "01"
    grader_student_report_file: "grading_report_{{ lookup('env', 'LAB_USER') | default(lookup('env', 'USER')) | default('student') }}_module_01.txt"
  roles:
    - ftl_run_grade_report_generation
    - ftl_run_finish
