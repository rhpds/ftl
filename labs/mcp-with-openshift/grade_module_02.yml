---
# Grade Module 2: Sovereign SRE Agent Demo
# Validates agent deployment, MCP connections, pipeline failure scenario, and automated issue creation

- name: Initialize FTL Grading Session - Module 2
  hosts: localhost
  gather_facts: false
  become: false
  vars:
    lab_id: "MCP Lab - Module 2: Sovereign SRE Agent Demo"
    module_number: "02"
    student_name: "{{ lookup('env', 'LAB_USER') | default('student') }}"
    grader_student_report_file: "grading_report_{{ lookup('env', 'LAB_USER') | default(lookup('env', 'USER')) | default('student') }}_module_02.txt"
  roles:
    - ftl_run_init

- name: Grade Module 2 - Sovereign SRE Agent Demo
  hosts: localhost
  gather_facts: false
  become: false

  vars:
    base_namespace_prefix: "{{ lookup('env', 'LAB_USER') | default('user1') }}"
    agent_namespace: "agent-{{ base_namespace_prefix }}"
    librechat_namespace: "librechat-{{ base_namespace_prefix }}"
    openshift_cluster_ingress_domain: "{{ lookup('env', 'OPENSHIFT_CLUSTER_INGRESS_DOMAIN') | default('apps.cluster.example.com') }}"
    gitea_user: "{{ base_namespace_prefix }}"
    gitea_password: "{{ lookup('env', 'PASSWORD') | default('changeme') }}"
    grader_student_report_file: "grading_report_{{ lookup('env', 'LAB_USER') | default(lookup('env', 'USER')) | default('student') }}_module_02.txt"

  tasks:
    # Auto-discover gitea_url from Showroom ConfigMap
    - name: Find Showroom namespace for this user
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Namespace
      register: r_all_namespaces
      failed_when: false

    - name: Set Showroom namespace
      ansible.builtin.set_fact:
        showroom_ns: "{{ r_all_namespaces.resources | default([]) |
          map(attribute='metadata.name') |
          select('match', 'showroom.*' + base_namespace_prefix + '$') |
          list | first | default('') }}"

    - name: Read Showroom ConfigMap for credentials and URLs
      when: showroom_ns | default('') != ''
      kubernetes.core.k8s_info:
        api_version: v1
        kind: ConfigMap
        name: showroom-userdata
        namespace: "{{ showroom_ns }}"
      register: r_showroom_cm
      failed_when: false

    - name: Set URLs from ConfigMap
      when:
        - showroom_ns | default('') != ''
        - r_showroom_cm.resources | default([]) | length > 0
      ansible.builtin.set_fact:
        gitea_url_from_cm: "{{ r_showroom_cm.resources[0].data['user_data.yml'] |
          regex_search('\"gitea_url\": *\"([^\"]+)\"', '\\1') | first | default('') }}"

    - name: Set Gitea URL (env > ConfigMap > constructed fallback)
      ansible.builtin.set_fact:
        gitea_url: "{{ lookup('env', 'GITEA_URL') or
          gitea_url_from_cm | default('') or
          ('https://gitea.' + openshift_cluster_ingress_domain) }}"

    # =========================================================================
    # Pre-check: Determine if Gitea issue exists (for downstream evidence)
    # =========================================================================
    - name: "Pre-check: Query Gitea for issues (downstream evidence)"
      ansible.builtin.uri:
        url: "{{ gitea_url }}/api/v1/repos/{{ gitea_user }}/mcp/issues"
        method: GET
        user: "{{ gitea_user }}"
        password: "{{ gitea_password }}"
        force_basic_auth: yes
        validate_certs: false
        return_content: yes
        status_code: 200
      register: r_gitea_issues_precheck
      failed_when: false

    - name: "Pre-check: Store Gitea issue status"
      ansible.builtin.set_fact:
        gitea_issue_created: "{{
          r_gitea_issues_precheck is succeeded and
          r_gitea_issues_precheck.json is defined and
          r_gitea_issues_precheck.json | length > 0
        }}"

    # =========================================================================
    # Exercise 2.1: Agent Infrastructure - Agent Pod Running
    # =========================================================================
    - name: "Exercise 2.1: Verify agent pod is deployed and running"
      ansible.builtin.include_role:
        name: grader_check_ocp_pod_running
      vars:
        task_description_message: "Exercise 2.1: Agent pod is running in namespace {{ agent_namespace }}"
        pod_name: "agent-.*"
        pod_namespace: "{{ agent_namespace }}"
        student_error_message: |
          Agent pod not found or not running in namespace {{ agent_namespace }}.
          This should be pre-deployed by the lab environment.
          Check pod status: oc get pods -n {{ agent_namespace }}

    # =========================================================================
    # Exercise 2.2: Agent Connected to MCP Servers
    # =========================================================================
    - name: "Exercise 2.2: Get agent pod name"
      kubernetes.core.k8s_info:
        kind: Pod
        namespace: "{{ agent_namespace }}"
        label_selectors:
          - "app=agent"
      register: r_agent_pods

    - name: "Exercise 2.2: Get agent pod logs"
      when: r_agent_pods.resources | length > 0
      kubernetes.core.k8s_log:
        namespace: "{{ agent_namespace }}"
        name: "{{ r_agent_pods.resources[0].metadata.name }}"
        tail_lines: 100
      register: r_agent_logs
      failed_when: false

    - name: "Exercise 2.2: Evaluate MCP connection from logs"
      when:
        - r_agent_logs is not skipped
        - r_agent_logs.log is defined
      ansible.builtin.set_fact:
        mcp_connected_from_logs: "{{
          ('✅ openshift: connected' in (r_agent_logs.log | default('')) and '✅ gitea: connected' in (r_agent_logs.log | default(''))) or
          ('openshift' in (r_agent_logs.log | default('')) and 'gitea' in (r_agent_logs.log | default('')) and 'connected' in (r_agent_logs.log | default(''))) or
          ('MCP server' in (r_agent_logs.log | default('')) and 'initialized' in (r_agent_logs.log | default('')))
        }}"

    - name: "Exercise 2.2: Set default for logs check"
      when: mcp_connected_from_logs is not defined
      ansible.builtin.set_fact:
        mcp_connected_from_logs: false

    - name: "Exercise 2.2: Store connection status for later exercises"
      ansible.builtin.set_fact:
        mcp_connected: "{{ mcp_connected_from_logs }}"

    - name: "Exercise 2.2: Create result message"
      ansible.builtin.set_fact:
        grader_output_message: "{{
          'PASS: Exercise 2.2: Agent connected to both MCP servers (OpenShift + Gitea)'
          if mcp_connected
          else 'PASS: Exercise 2.2: Agent connected to MCP servers (verified by successful downstream operations)'
          if gitea_issue_created | default(false)
          else 'FAIL: Exercise 2.2: Agent connected to MCP servers: Agent logs do not show successful MCP connections. Check agent pod logs: oc logs -n ' + agent_namespace + ' <agent-pod-name>'
        }}"

    - name: "Exercise 2.2: Update connection status if downstream evidence exists"
      when: gitea_issue_created | default(false)
      ansible.builtin.set_fact:
        mcp_connected: true

    - name: "Exercise 2.2: Log result"
      ansible.builtin.include_role:
        name: ftl_run_log_grade_to_log

    # =========================================================================
    # Exercise 2.3: Pipeline Infrastructure Exists
    # =========================================================================
    - name: "Exercise 2.3: Verify build-agent pipeline exists"
      ansible.builtin.include_role:
        name: grader_check_ocp_resource
      vars:
        task_description_message: "Exercise 2.3: Pipeline 'build-agent' exists in namespace {{ agent_namespace }}"
        resource_api_version: "tekton.dev/v1"
        resource_kind: "Pipeline"
        resource_name: "build-agent"
        resource_namespace: "{{ agent_namespace }}"
        student_error_message: |
          Pipeline 'build-agent' not found in namespace {{ agent_namespace }}.
          This should be pre-deployed by the lab environment.
          Check pipelines: oc get pipelines -n {{ agent_namespace }}

    # =========================================================================
    # Exercise 2.4: Pipeline Run Triggered with Broken Branch
    # =========================================================================
    - name: "Exercise 2.4: Get all pipeline runs"
      kubernetes.core.k8s_info:
        api_version: tekton.dev/v1
        kind: PipelineRun
        namespace: "{{ agent_namespace }}"
      register: r_pipelineruns
      failed_when: false

    - name: "Exercise 2.4: Evaluate pipeline run existence"
      ansible.builtin.set_fact:
        broken_pipelineruns: "{{ r_pipelineruns.resources | default([]) |
          selectattr('spec.params', 'defined') |
          map(attribute='spec.params') |
          map('selectattr', 'name', 'equalto', 'GIT_REVISION') |
          map('selectattr', 'value', 'equalto', 'broken') |
          list }}"
        pipeline_run_exists: "{{ (r_pipelineruns.resources | default([]) |
          selectattr('spec.params', 'defined') | list | length) > 0 }}"

    - name: "Exercise 2.4: Create result message"
      ansible.builtin.set_fact:
        grader_output_message: "{{
          'PASS: Exercise 2.4: Pipeline run triggered with GIT_REVISION=broken'
          if pipeline_run_exists
          else 'FAIL: Exercise 2.4: Pipeline run with broken branch: No pipeline run found with GIT_REVISION=broken. Start the build-agent pipeline with GIT_REVISION=broken parameter.'
        }}"

    - name: "Exercise 2.4: Log result"
      ansible.builtin.include_role:
        name: ftl_run_log_grade_to_log

    # =========================================================================
    # Exercise 2.5: Pipeline Run Failed (Expected Outcome)
    # =========================================================================
    - name: "Exercise 2.5: Evaluate pipeline failure from k8s_info results"
      ansible.builtin.set_fact:
        pipeline_failed: "{{ r_pipelineruns.resources | default([]) |
          selectattr('status.conditions', 'defined') |
          map(attribute='status.conditions') | flatten |
          selectattr('type', 'equalto', 'Succeeded') |
          selectattr('status', 'equalto', 'False') | list | length > 0 }}"

    - name: "Exercise 2.5: Create result message"
      ansible.builtin.set_fact:
        grader_output_message: "{{
          'PASS: Exercise 2.5: Pipeline run failed as expected (requirements.txt missing)'
          if pipeline_failed
          else 'FAIL: Exercise 2.5: Pipeline run failed: Pipeline did not fail or has not completed. The broken branch should cause the build to fail.'
        }}"

    - name: "Exercise 2.5: Log result"
      ansible.builtin.include_role:
        name: ftl_run_log_grade_to_log

    # =========================================================================
    # Exercise 2.6: Trigger-Agent Finally Task Executed
    # =========================================================================
    - name: "Exercise 2.6: Evaluate trigger-agent task execution from k8s_info results"
      ansible.builtin.set_fact:
        trigger_agent_executed: "{{ r_pipelineruns.resources | default([]) |
          map(attribute='status.childReferences') | flatten | default([]) |
          selectattr('pipelineTaskName', 'defined') |
          selectattr('pipelineTaskName', 'equalto', 'trigger-agent') |
          list | length > 0 }}"

    - name: "Exercise 2.6: Create result message"
      ansible.builtin.set_fact:
        grader_output_message: "{{
          'PASS: Exercise 2.6: Trigger-agent finally task executed in pipeline'
          if trigger_agent_executed
          else 'FAIL: Exercise 2.6: Trigger-agent task: Finally task did not execute. Check pipeline definition has trigger-agent in finally section.'
        }}"

    - name: "Exercise 2.6: Log result"
      ansible.builtin.include_role:
        name: ftl_run_log_grade_to_log

    # =========================================================================
    # Exercise 2.8: Gitea Issue Created by Agent (uses pre-check result)
    # =========================================================================
    - name: "Exercise 2.8: Create result message"
      ansible.builtin.set_fact:
        grader_output_message: "{{
          'PASS: Exercise 2.8: Gitea issue created by agent after pipeline failure'
          if gitea_issue_created
          else 'FAIL: Exercise 2.8: Gitea issue creation: No issues found in Gitea repository ' + gitea_user + '/mcp. The agent should create an issue when the pipeline fails. Check Gitea: ' + gitea_url + '/' + gitea_user + '/mcp/issues'
        }}"

    - name: "Exercise 2.8: Log result"
      ansible.builtin.include_role:
        name: ftl_run_log_grade_to_log

    # =========================================================================
    # Exercise 2.7: Agent Investigated Failure (Use downstream evidence if logs unavailable)
    # =========================================================================
    - name: "Exercise 2.7: Check agent logs for failure investigation"
      when:
        - r_agent_logs is not skipped
        - r_agent_logs.rc is defined
        - r_agent_logs.rc == 0
      ansible.builtin.set_fact:
        agent_investigated_from_logs: "{{
          'Received failure report' in r_agent_logs.stdout or
          'pods_log' in r_agent_logs.stdout or
          'Iteration' in r_agent_logs.stdout
        }}"

    - name: "Exercise 2.7: Set default for logs check"
      when: agent_investigated_from_logs is not defined
      ansible.builtin.set_fact:
        agent_investigated_from_logs: false

    - name: "Exercise 2.7: Determine investigation success"
      ansible.builtin.set_fact:
        agent_investigated: "{{
          agent_investigated_from_logs or
          (gitea_issue_created | default(false))
        }}"

    - name: "Exercise 2.7: Create result message"
      ansible.builtin.set_fact:
        grader_output_message: "{{
          'PASS: Exercise 2.7: Agent investigated pipeline failure (verified by Gitea issue creation)'
          if agent_investigated and not agent_investigated_from_logs
          else 'PASS: Exercise 2.7: Agent investigated pipeline failure (logs show analysis)'
          if agent_investigated and agent_investigated_from_logs
          else 'FAIL: Exercise 2.7: Agent investigation: Agent logs do not show failure investigation and no Gitea issue was created. Check agent pod logs for failure report handling.'
        }}"

    - name: "Exercise 2.7: Log result"
      ansible.builtin.include_role:
        name: ftl_run_log_grade_to_log

    # =========================================================================
    # Exercise 2.9: LibreChat Can Query Infrastructure
    # =========================================================================
    - name: "Exercise 2.9: Discover LibreChat route host"
      kubernetes.core.k8s_info:
        api_version: route.openshift.io/v1
        kind: Route
        name: librechat
        namespace: "{{ librechat_namespace }}"
      register: r_librechat_route_2
      failed_when: false

    - name: "Exercise 2.9: Set LibreChat URL from route"
      ansible.builtin.set_fact:
        librechat_url_2: "https://{{ r_librechat_route_2.resources[0].spec.host }}"
      when: r_librechat_route_2.resources | default([]) | length > 0

    - name: "Exercise 2.9: Verify LibreChat UI accessible for querying"
      ansible.builtin.include_role:
        name: grader_check_http_endpoint
      vars:
        task_description_message: "Exercise 2.9: LibreChat accessible for infrastructure queries"
        url: "{{ librechat_url_2 | default('https://librechat-' + librechat_namespace + '.' + openshift_cluster_ingress_domain) }}"
        expected_status_code: 200
        student_error_message: |
          LibreChat not accessible for querying infrastructure.
          Verify LibreChat is running and accessible.
          Check route: oc get route -n {{ librechat_namespace }}

- name: Finalize FTL Grading Session - Module 2
  hosts: localhost
  gather_facts: false
  vars:
    module_number: "02"
    grader_student_report_file: "grading_report_{{ lookup('env', 'LAB_USER') | default(lookup('env', 'USER')) | default('student') }}_module_02.txt"
  roles:
    - ftl_run_grade_report_generation
    - ftl_run_finish
