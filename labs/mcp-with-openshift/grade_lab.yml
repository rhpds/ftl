---
# Grade Lab: Model Context Protocol (MCP) Enterprise Integration
# Main grading playbook that orchestrates all module graders

- name: Initialize FTL Grading Session - Full Lab
  hosts: localhost
  gather_facts: false
  become: false
  vars:
    lab_id: "MCP Lab - Full Lab"
    student_name: "{{ lookup('env', 'LAB_USER') | default('student') }}"
    grader_student_report_file: "grading_report_{{ lookup('env', 'LAB_USER') | default(lookup('env', 'USER')) | default('student') }}.txt"
  roles:
    - ftl_run_init

- name: Display Lab Grading Start
  hosts: localhost
  gather_facts: false
  become: false

  vars:
    lab_name: "Model Context Protocol (MCP) Enterprise Integration"
    total_modules: 4

  tasks:
    - name: Display grading start message
      ansible.builtin.debug:
        msg: |
          ================================================================================
          Starting Lab Grading: {{ lab_name }}
          ================================================================================
          Total Modules: {{ total_modules }}

          Module 1: Lab Setup
          Module 2: Sovereign SRE Agent Demo
          Module 3: MCP Server Administration
          Module 4: MCP Registry

          ================================================================================

# ============================================================================
# Module 1: Lab Setup
# ============================================================================
- name: Grade Module 1
  import_playbook: grade_module_01.yml
  tags: ['module1', 'setup']

# ============================================================================
# Module 2: Sovereign SRE Agent Demo
# ============================================================================
- name: Grade Module 2
  import_playbook: grade_module_02.yml
  tags: ['module2', 'agent']

# ============================================================================
# Module 3: MCP Server Administration
# ============================================================================
- name: Grade Module 3
  import_playbook: grade_module_03.yml
  tags: ['module3', 'admin']

# ============================================================================
# Module 4: MCP Registry
# ============================================================================
- name: Grade Module 4
  import_playbook: grade_module_04.yml
  tags: ['module4', 'registry']

# ============================================================================
# Consolidate Module Reports
# ============================================================================
- name: Consolidate Module Reports
  hosts: localhost
  gather_facts: false
  become: false
  vars:
    grader_working_dir: /tmp/grading_dir
    grader_student_report_file: "grading_report_{{ lookup('env', 'LAB_USER') | default(lookup('env', 'USER')) | default('student') }}.txt"
    base_user: "{{ lookup('env', 'LAB_USER') | default(lookup('env', 'USER')) | default('student') }}"

  tasks:
    - name: Read all module reports
      ansible.builtin.shell: |
        cat {{ grader_working_dir }}/grading_report_{{ base_user }}_module_*.txt 2>/dev/null || echo "No module reports found"
      register: r_module_reports
      changed_when: false
      ignore_errors: true

    - name: Append module results to main report
      ansible.builtin.lineinfile:
        path: "{{ grader_working_dir }}/{{ grader_student_report_file }}"
        line: "{{ item }}"
        create: yes
      loop: "{{ r_module_reports.stdout_lines | default([]) }}"
      when: r_module_reports.stdout_lines is defined

- name: Finalize FTL Grading Session - Full Lab
  hosts: localhost
  gather_facts: false
  vars:
    grader_student_report_file: "grading_report_{{ lookup('env', 'LAB_USER') | default(lookup('env', 'USER')) | default('student') }}.txt"
  roles:
    - ftl_run_grade_report_generation
    - ftl_run_finish

# ============================================================================
# Final Summary
# ============================================================================
- name: Display Lab Grading Complete
  hosts: localhost
  gather_facts: false
  become: false

  vars:
    lab_name: "Model Context Protocol (MCP) Enterprise Integration"
    grader_report_file: "grading_report_{{ lookup('env', 'LAB_USER') | default(lookup('env', 'USER')) | default('student') }}.txt"

  tasks:
    - name: Display completion message
      ansible.builtin.debug:
        msg: |
          ================================================================================
          Lab Grading Complete: {{ lab_name }}
          ================================================================================

          ✅ Module 1: Lab Setup
          ✅ Module 2: Sovereign SRE Agent Demo
          ✅ Module 3: MCP Server Administration
          ✅ Module 4: MCP Registry

          All modules graded successfully!

          Check the grading report at: /tmp/grading_dir/{{ grader_report_file }}
          ================================================================================
