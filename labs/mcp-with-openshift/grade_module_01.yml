---
# Grade Module 1: Lab Setup
# Validates pre-deployed environment components

- name: Initialize FTL Grading Session - Module 1
  hosts: localhost
  gather_facts: false
  become: false
  vars:
    lab_id: "MCP Lab - Module 1: Lab Setup"
    module_number: "01"
    student_name: "{{ lookup('env', 'LAB_USER') | default('student') }}"
    grader_student_report_file: "grading_report_{{ lookup('env', 'LAB_USER') | default(lookup('env', 'USER')) | default('student') }}_module_01.txt"
  roles:
    - ftl_run_init

- name: Grade Module 1 - Lab Setup
  hosts: localhost
  gather_facts: false
  become: false

  vars:
    openshift_cluster_ingress_domain: "{{ lookup('env', 'OPENSHIFT_CLUSTER_INGRESS_DOMAIN') | default('', true) }}"
    gitea_password: "{{ lookup('env', 'PASSWORD') | default('', true) }}"
    grader_student_report_file: "grading_report_{{ lookup('env', 'LAB_USER') | default(lookup('env', 'USER')) | default('student') }}_module_01.txt"

  tasks:
    # Validate required environment variables
    - name: Validate required environment variables
      ansible.builtin.fail:
        msg: |
          ERROR: Required environment variable not set: {{ item.name }}

          Please set the following environment variables before running the grader:

          export OPENSHIFT_CLUSTER_INGRESS_DOMAIN="apps.cluster-xxx.dynamic.redhatworkshops.io"
          export LAB_USER="user1"

          See labs/mcp-with-openshift/README.md for details.
      when: item.value == ''
      loop:
        - { name: 'OPENSHIFT_CLUSTER_INGRESS_DOMAIN', value: "{{ openshift_cluster_ingress_domain }}" }
      loop_control:
        label: "{{ item.name }}"

    # Set variables from environment
    # Allow environment variables to override defaults for flexibility
    - name: Set base namespace prefix
      ansible.builtin.set_fact:
        base_namespace_prefix: "{{ lookup('env', 'LAB_USER') | default('user1', true) }}"

    - name: Set gitea user
      ansible.builtin.set_fact:
        gitea_user: "{{ base_namespace_prefix }}"

    - name: Set namespace variables (env override or build from LAB_USER)
      ansible.builtin.set_fact:
        mcp_openshift_namespace: "{{ lookup('env', 'MCP_OPENSHIFT_NAMESPACE') | default('mcp-openshift-' + base_namespace_prefix, true) }}"
        mcp_gitea_namespace: "{{ lookup('env', 'MCP_GITEA_NAMESPACE') | default('mcp-gitea-' + base_namespace_prefix, true) }}"
        librechat_namespace: "{{ lookup('env', 'LIBRECHAT_NAMESPACE') | default('librechat-' + base_namespace_prefix, true) }}"

    # Read Showroom ConfigMap for credentials and URLs
    # Always read — needed for both Gitea credentials and URL auto-discovery
    - name: Find Showroom namespace for this user
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Namespace
      register: r_all_namespaces
      failed_when: false

    - name: Set Showroom namespace
      ansible.builtin.set_fact:
        showroom_ns: "{{ r_all_namespaces.resources | default([]) |
          map(attribute='metadata.name') |
          select('match', 'showroom.*' + base_namespace_prefix + '$') |
          list | first | default('') }}"

    - name: Read Showroom ConfigMap for credentials and URLs
      when: showroom_ns | default('') != ''
      kubernetes.core.k8s_info:
        api_version: v1
        kind: ConfigMap
        name: showroom-userdata
        namespace: "{{ showroom_ns }}"
      register: r_showroom_cm
      failed_when: false

    - name: Set credentials and URLs from ConfigMap
      when:
        - showroom_ns | default('') != ''
        - r_showroom_cm.resources | default([]) | length > 0
      ansible.builtin.set_fact:
        gitea_admin_user_from_cm: "{{ r_showroom_cm.resources[0].data['user_data.yml'] |
          regex_search('\"gitea_admin_username\": *\"([^\"]+)\"', '\\1') | first | default('mcpadmin') }}"
        gitea_admin_pass_from_cm: "{{ r_showroom_cm.resources[0].data['user_data.yml'] |
          regex_search('\"gitea_admin_password\": *\"([^\"]+)\"', '\\1') | first | default('') }}"
        gitea_url_from_cm: "{{ r_showroom_cm.resources[0].data['user_data.yml'] |
          regex_search('\"gitea_url\": *\"([^\"]+)\"', '\\1') | first | default('') }}"

    - name: Set Gitea URL (env > ConfigMap > constructed fallback)
      ansible.builtin.set_fact:
        gitea_url: "{{ lookup('env', 'GITEA_URL') or
          gitea_url_from_cm | default('') or
          ('https://gitea.' + openshift_cluster_ingress_domain) }}"

    # =========================================================================
    # Exercise 1.1: OpenShift Console Login
    # =========================================================================
    # Use kubernetes.core.k8s_info instead of oc CLI — works reliably across platforms
    - name: "Exercise 1.1: Get pods in mcp-openshift namespace"
      kubernetes.core.k8s_info:
        kind: Pod
        namespace: "{{ mcp_openshift_namespace }}"
      register: r_mcp_pods

    - name: "Exercise 1.1: Evaluate pod count"
      ansible.builtin.set_fact:
        grader_output_message: "{{
          'PASS: Exercise 1.1: OpenShift Console accessible - ' + (r_mcp_pods.resources | length | string) + ' pod(s) running in ' + mcp_openshift_namespace
          if r_mcp_pods.resources | length > 0
          else 'FAIL: Exercise 1.1: OpenShift Console accessible: No pods found in ' + mcp_openshift_namespace + '. Log in to OpenShift Console and verify access.'
        }}"

    - name: "Exercise 1.1: Log result"
      ansible.builtin.include_role:
        name: ftl_run_log_grade_to_log

    # =========================================================================
    # Exercise 1.2: LibreChat Login and Configuration
    # =========================================================================
    - name: "Exercise 1.2a: Verify LibreChat pod is running"
      ansible.builtin.include_role:
        name: grader_check_ocp_pod_running
      vars:
        task_description_message: "Exercise 1.2: LibreChat pod is running"
        pod_name: "librechat-.*"
        pod_namespace: "{{ librechat_namespace }}"
        student_error_message: |
          LibreChat pod not found or not running in namespace {{ librechat_namespace }}.
          This should be pre-deployed by the lab environment.
          Check pods: oc get pods -n {{ librechat_namespace }}

    - name: "Exercise 1.2b: Verify LibreChat route exists"
      ansible.builtin.include_role:
        name: grader_check_ocp_route_exists
      vars:
        task_description_message: "Exercise 1.2: LibreChat route exists"
        route_name: "librechat"
        route_namespace: "{{ librechat_namespace }}"
        student_error_message: |
          LibreChat route not found in namespace {{ librechat_namespace }}.
          Check routes: oc get routes -n {{ librechat_namespace }}

    - name: "Exercise 1.2c: Verify LibreChat UI is responding"
      ansible.builtin.include_role:
        name: grader_check_command_output
      vars:
        task_description_message: "Exercise 1.2: LibreChat UI is accessible via HTTP"
        command: >
          curl -s -k -o /dev/null -w '%{http_code}'
          https://librechat-{{ librechat_namespace }}.{{ lookup('env', 'OPENSHIFT_CLUSTER_INGRESS_DOMAIN') | default('apps.cluster.example.com') }}
        expected_output: "200"
        student_error_message: |
          LibreChat is not responding to HTTP requests.
          The pod is running but the application may not be healthy.
          Check logs: oc get logs -n {{ librechat_namespace }} deployment/librechat

    # =========================================================================
    # Exercise 1.3: MCP OpenShift Server Available
    # =========================================================================
    - name: "Exercise 1.3: Verify MCP OpenShift Server pod is running"
      ansible.builtin.include_role:
        name: grader_check_ocp_pod_running
      vars:
        task_description_message: "Exercise 1.3: MCP OpenShift Server pod is running"
        pod_name: "openshift-.*"  # Regex to match deployment pod
        pod_namespace: "{{ mcp_openshift_namespace }}"
        student_error_message: "MCP OpenShift Server pod not found or not running in namespace {{ mcp_openshift_namespace }}. This should be pre-deployed. Check pod status: oc get pods -n {{ mcp_openshift_namespace }}"

    # =========================================================================
    # Exercise 1.4: MCP Gitea Server Available
    # =========================================================================
    - name: "Exercise 1.4: Verify MCP Gitea Server pod is running"
      ansible.builtin.include_role:
        name: grader_check_ocp_pod_running
      vars:
        task_description_message: "Exercise 1.4: MCP Gitea Server pod is running"
        pod_name: "gitea-.*"  # Regex to match deployment pod
        pod_namespace: "{{ mcp_gitea_namespace }}"
        student_error_message: "MCP Gitea Server pod not found or not running in namespace {{ mcp_gitea_namespace }}. This should be pre-deployed. Check pod status: oc get pods -n {{ mcp_gitea_namespace }}"

    # =========================================================================
    # Exercise 1.5: Gitea Login
    # =========================================================================
    # Use Gitea admin token — works even if student hasn't logged in yet
    - name: "Exercise 1.5: Verify Gitea repository exists (admin API)"
      ansible.builtin.include_role:
        name: grader_check_command_output
      vars:
        task_description_message: "Exercise 1.5: Gitea repository 'mcp' exists for user {{ gitea_user }}"
        command: >
          curl -sk
          -u "{{ lookup('env', 'GITEA_ADMIN_USER') | default(gitea_admin_user_from_cm | default('mcpadmin'), true) }}:{{ lookup('env', 'GITEA_ADMIN_PASSWORD') | default(gitea_admin_pass_from_cm | default(''), true) }}"
          {{ gitea_url }}/api/v1/repos/{{ gitea_user }}/mcp | jq -r '.name'
        expected_output: "mcp"
        student_error_message: |
          Gitea repository '{{ gitea_user }}/mcp' not found.
          Log in to Gitea at {{ gitea_url }} and verify the repository exists.
          The mcp repository should be pre-initialized for your user.

- name: Finalize FTL Grading Session - Module 1
  hosts: localhost
  gather_facts: false
  vars:
    module_number: "01"
    grader_student_report_file: "grading_report_{{ lookup('env', 'LAB_USER') | default(lookup('env', 'USER')) | default('student') }}_module_01.txt"
  roles:
    - ftl_run_grade_report_generation
    - ftl_run_finish
