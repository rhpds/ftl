---
# Grade Module 1: Lab Setup
# Validates pre-deployed environment components

- name: Initialize FTL Grading Session - Module 1
  hosts: localhost
  gather_facts: false
  become: false
  vars:
    lab_id: "MCP Lab - Module 1: Lab Setup"
    module_number: "01"
    student_name: "{{ lookup('env', 'LAB_USER') | default('student') }}"
    grader_student_report_file: "grading_report_{{ lookup('env', 'LAB_USER') | default(lookup('env', 'USER')) | default('student') }}_module_01.txt"
  roles:
    - ftl_run_init

- name: Grade Module 1 - Lab Setup
  hosts: localhost
  gather_facts: false
  become: false

  vars:
    openshift_cluster_ingress_domain: "{{ lookup('env', 'OPENSHIFT_CLUSTER_INGRESS_DOMAIN') | default('', true) }}"
    gitea_password: "{{ lookup('env', 'PASSWORD') | default('', true) }}"
    grader_student_report_file: "grading_report_{{ lookup('env', 'LAB_USER') | default(lookup('env', 'USER')) | default('student') }}_module_01.txt"

  tasks:
    # Validate required environment variables
    - name: Validate required environment variables
      ansible.builtin.fail:
        msg: |
          ERROR: Required environment variable not set: {{ item.name }}

          Please set the following environment variables before running the grader:

          export OPENSHIFT_CLUSTER_INGRESS_DOMAIN="apps.cluster-kg5jj.dynamic.redhatworkshops.io"
          export PASSWORD="<your_password_from_agv_user_data>"
          export LAB_USER="user1"

          See labs/mcp-with-openshift/README.md for details.
      when: item.value == ''
      loop:
        - { name: 'OPENSHIFT_CLUSTER_INGRESS_DOMAIN', value: "{{ openshift_cluster_ingress_domain }}" }
        - { name: 'PASSWORD', value: "{{ gitea_password }}" }
      loop_control:
        label: "{{ item.name }}"

    # Set variables from environment
    # Allow environment variables to override defaults for flexibility
    - name: Set base namespace prefix
      ansible.builtin.set_fact:
        base_namespace_prefix: "{{ lookup('env', 'LAB_USER') | default('user1', true) }}"

    - name: Set gitea user
      ansible.builtin.set_fact:
        gitea_user: "{{ base_namespace_prefix }}"

    - name: Set namespace variables (env override or default)
      ansible.builtin.set_fact:
        mcp_openshift_namespace: "{{ lookup('env', 'MCP_OPENSHIFT_NAMESPACE') | default('mcp-openshift', true) }}"
        mcp_gitea_namespace: "{{ lookup('env', 'MCP_GITEA_NAMESPACE') | default('mcp-gitea', true) }}"
        librechat_namespace: "{{ lookup('env', 'LIBRECHAT_NAMESPACE') | default('librechat', true) }}"

    - name: Set Gitea URL (env override or build from ingress domain)
      ansible.builtin.set_fact:
        gitea_url: "{{ lookup('env', 'GITEA_URL') | default('https://gitea.' + openshift_cluster_ingress_domain, true) }}"

    # =========================================================================
    # Exercise 1.1: OpenShift Console Login
    # =========================================================================
    - name: "Exercise 1.1: Verify OpenShift CLI access"
      ansible.builtin.include_role:
        name: grader_check_command_output
      vars:
        task_description_message: "Exercise 1.1: OpenShift Console accessible - can list pods"
        command: "oc get pods -n {{ mcp_openshift_namespace }} --no-headers | wc -l"
        expected_output_regex: "^[1-9][0-9]*$"  # At least 1 pod exists
        student_error_message: "Unable to access OpenShift. Log in to OpenShift Console and verify access to namespace {{ mcp_openshift_namespace }}"

    # =========================================================================
    # Exercise 1.2: LibreChat Login and Configuration
    # =========================================================================
    - name: "Exercise 1.2a: Verify LibreChat pod is running"
      ansible.builtin.include_role:
        name: grader_check_ocp_pod_running
      vars:
        task_description_message: "Exercise 1.2: LibreChat pod is running"
        pod_name: "librechat-.*"
        pod_namespace: "{{ librechat_namespace }}"
        student_error_message: |
          LibreChat pod not found or not running in namespace {{ librechat_namespace }}.
          This should be pre-deployed by the lab environment.
          Check pods: oc get pods -n {{ librechat_namespace }}

    - name: "Exercise 1.2b: Verify LibreChat route exists"
      ansible.builtin.include_role:
        name: grader_check_ocp_route_exists
      vars:
        task_description_message: "Exercise 1.2: LibreChat route exists"
        route_name: "librechat"
        route_namespace: "{{ librechat_namespace }}"
        student_error_message: |
          LibreChat route not found in namespace {{ librechat_namespace }}.
          Check routes: oc get routes -n {{ librechat_namespace }}

    - name: "Exercise 1.2c: Verify LibreChat UI is responding"
      ansible.builtin.include_role:
        name: grader_check_command_output
      vars:
        task_description_message: "Exercise 1.2: LibreChat UI is accessible via HTTP"
        command: >
          curl -s -k -o /dev/null -w '%{http_code}'
          https://librechat-{{ librechat_namespace }}.{{ lookup('env', 'OPENSHIFT_CLUSTER_INGRESS_DOMAIN') | default('apps.cluster.example.com') }}
        expected_output: "200"
        student_error_message: |
          LibreChat is not responding to HTTP requests.
          The pod is running but the application may not be healthy.
          Check logs: oc get logs -n {{ librechat_namespace }} deployment/librechat

    # =========================================================================
    # Exercise 1.3: MCP OpenShift Server Available
    # =========================================================================
    - name: "Exercise 1.3: Verify MCP OpenShift Server pod is running"
      ansible.builtin.include_role:
        name: grader_check_ocp_pod_running
      vars:
        task_description_message: "Exercise 1.3: MCP OpenShift Server pod is running"
        pod_name: "openshift-.*"  # Regex to match deployment pod
        pod_namespace: "{{ mcp_openshift_namespace }}"
        student_error_message: "MCP OpenShift Server pod not found or not running in namespace {{ mcp_openshift_namespace }}. This should be pre-deployed. Check pod status: oc get pods -n {{ mcp_openshift_namespace }}"

    # =========================================================================
    # Exercise 1.4: MCP Gitea Server Available
    # =========================================================================
    - name: "Exercise 1.4: Verify MCP Gitea Server pod is running"
      ansible.builtin.include_role:
        name: grader_check_ocp_pod_running
      vars:
        task_description_message: "Exercise 1.4: MCP Gitea Server pod is running"
        pod_name: "gitea-.*"  # Regex to match deployment pod
        pod_namespace: "{{ mcp_gitea_namespace }}"
        student_error_message: "MCP Gitea Server pod not found or not running in namespace {{ mcp_gitea_namespace }}. This should be pre-deployed. Check pod status: oc get pods -n {{ mcp_gitea_namespace }}"

    # =========================================================================
    # Exercise 1.5: Gitea Login
    # =========================================================================
    - name: "Exercise 1.5: Verify Gitea repository exists"
      ansible.builtin.include_role:
        name: grader_check_command_output
      vars:
        task_description_message: "Exercise 1.5: Gitea repository 'mcp' accessible for user {{ gitea_user }}"
        command: "curl -s -u {{ gitea_user }}:{{ gitea_password }} {{ gitea_url }}/api/v1/repos/{{ gitea_user }}/mcp | jq -r '.name'"
        expected_output: "mcp"
        student_error_message: "Gitea repository '{{ gitea_user }}/mcp' not found. Log in to Gitea and verify repository exists: {{ gitea_url }}/{{ gitea_user }}/mcp"

- name: Finalize FTL Grading Session - Module 1
  hosts: localhost
  gather_facts: false
  vars:
    module_number: "01"
    grader_student_report_file: "grading_report_{{ lookup('env', 'LAB_USER') | default(lookup('env', 'USER')) | default('student') }}_module_01.txt"
  roles:
    - ftl_run_grade_report_generation
    - ftl_run_finish
