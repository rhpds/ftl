---
# Solve Module 2: Sovereign SRE Agent Demo
# Triggers a failing pipeline and verifies agent response

- name: Solve Module 2 - Sovereign SRE Agent Demo
  hosts: localhost
  gather_facts: false
  become: false

  vars:
    base_namespace_prefix: "{{ lookup('env', 'LAB_USER') | default('user1') }}"
    agent_namespace: "agent-{{ base_namespace_prefix }}"
    openshift_cluster_ingress_domain: "{{ lookup('env', 'OPENSHIFT_CLUSTER_INGRESS_DOMAIN') | default('', true) }}"
    mcp_gitea_namespace: "mcp-gitea-{{ base_namespace_prefix }}"
    gitea_url: "https://gitea.{{ openshift_cluster_ingress_domain }}"
    gitea_user: "{{ base_namespace_prefix }}"
    gitea_password: "{{ lookup('env', 'PASSWORD') | default('', true) }}"

  tasks:
    - name: Validate required environment variables
      ansible.builtin.fail:
        msg: |
          ERROR: Required environment variable not set: {{ item.name }}

          Please set the following environment variables before running the solver:

          export OPENSHIFT_CLUSTER_INGRESS_DOMAIN="apps.cluster-kg5jj.dynamic.redhatworkshops.io"
          export PASSWORD="<your_password_from_agv_user_data>"
          export LAB_USER="user4"

          See labs/mcp-with-openshift/README.md for details.
      when: item.value == ''
      loop:
        - { name: 'OPENSHIFT_CLUSTER_INGRESS_DOMAIN', value: "{{ openshift_cluster_ingress_domain }}" }
        - { name: 'PASSWORD', value: "{{ gitea_password }}" }
      loop_control:
        label: "{{ item.name }}"
    - name: Display Module 2 solver info
      ansible.builtin.debug:
        msg: |
          ================================================================================
          Module 2: Sovereign SRE Agent Demo - Solver
          ================================================================================

          This solver will:
          1. Trigger a pipeline run with the 'broken' branch
          2. Wait for the pipeline to fail
          3. Verify the agent created a Gitea issue

          ================================================================================

    # =========================================================================
    # Step 1: Trigger pipeline run with broken branch
    # =========================================================================
    - name: Check if pipeline exists
      kubernetes.core.k8s_info:
        api_version: tekton.dev/v1
        kind: Pipeline
        name: build-agent
        namespace: "{{ agent_namespace }}"
      register: r_pipeline_exists
      failed_when: false

    - name: Fail if pipeline doesn't exist
      ansible.builtin.fail:
        msg: |
          Pipeline 'build-agent' not found in namespace {{ agent_namespace }}.
          The lab environment may not be properly deployed.
      when: r_pipeline_exists.resources | length == 0

    - name: Trigger pipeline run with broken branch
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: tekton.dev/v1
          kind: PipelineRun
          metadata:
            generateName: build-agent-
            namespace: "{{ agent_namespace }}"
          spec:
            pipelineRef:
              name: build-agent
            params:
              - name: GIT_REVISION
                value: broken
              - name: GIT_REPO
                value: "{{ gitea_url }}/{{ gitea_user }}/mcp.git"
            workspaces:
              - name: workspace
                volumeClaimTemplate:
                  spec:
                    accessModes:
                      - ReadWriteOnce
                    resources:
                      requests:
                        storage: 1Gi
      register: r_pipeline_start

    - name: Extract PipelineRun name
      ansible.builtin.set_fact:
        pipelinerun_name: "{{ r_pipeline_start.result.metadata.name }}"

    - name: Display pipeline trigger result
      ansible.builtin.debug:
        msg: "Pipeline run triggered: {{ pipelinerun_name }}"

    # =========================================================================
    # Step 2: Wait for pipeline to fail
    # =========================================================================
    - name: Wait for pipeline run to complete (will fail with broken branch)
      kubernetes.core.k8s_info:
        api_version: tekton.dev/v1
        kind: PipelineRun
        name: "{{ pipelinerun_name }}"
        namespace: "{{ agent_namespace }}"
      register: r_pipeline_wait
      until:
        - r_pipeline_wait.resources | length > 0
        - r_pipeline_wait.resources[0].status.conditions | default([]) |
          selectattr('type', 'equalto', 'Succeeded') | list | length > 0
        - r_pipeline_wait.resources[0].status.conditions |
          selectattr('type', 'equalto', 'Succeeded') | list |
          first | default({}) | json_query('status') in ['True', 'False']
      retries: 60
      delay: 10
      ignore_errors: true

    - name: Display pipeline completion
      ansible.builtin.debug:
        msg: |
          Pipeline run completed (expected failure).
          The agent should now create a Gitea issue automatically.

    # =========================================================================
    # Step 3: Wait for agent to create issue
    # =========================================================================
    - name: Wait for agent to process failure (30 seconds)
      ansible.builtin.pause:
        seconds: 30

    - name: Verify issue was created
      ansible.builtin.uri:
        url: "{{ gitea_url }}/api/v1/repos/{{ gitea_user }}/mcp/issues"
        method: GET
        user: "{{ gitea_user }}"
        password: "{{ gitea_password }}"
        force_basic_auth: yes
        validate_certs: false
        return_content: yes
        status_code: 200
      register: r_issues
      until:
        - r_issues is succeeded
        - r_issues.json is defined
        - r_issues.json | length > 0
      retries: 6
      delay: 10
      ignore_errors: true

    - name: Display solver completion
      ansible.builtin.debug:
        msg: |
          ================================================================================
          Module 2 Solver Complete
          ================================================================================

          ✅ Pipeline run triggered with broken branch
          ✅ Pipeline failed as expected
          {% if r_issues is defined and r_issues.json is defined and r_issues.json | length > 0 %}
          ✅ Agent created Gitea issue: {{ gitea_url }}/{{ gitea_user }}/mcp/issues/{{ r_issues.json[0].number }}

          Issue Title: {{ r_issues.json[0].title }}
          {% else %}
          ⏳ Waiting for agent to create Gitea issue (may take a few minutes)
             Check manually: {{ gitea_url }}/{{ gitea_user }}/mcp/issues
          {% endif %}

          Run the grader to verify all checkpoints pass.
          ================================================================================
