---
# =============================================================================
# FTL Grader: Automating RIPU with Ansible - Module 1 (Pre-upgrade Analysis)
# =============================================================================
#
# This playbook validates the pre-upgrade analysis phase of the RIPU workshop
#
# Required environment variables:
#   - AAP_HOSTNAME: AAP controller URL (e.g., https://controller-guid.example.com)
#   - AAP_USERNAME: AAP username (default: lab-user)
#   - AAP_PASSWORD: AAP password
#   - SUBDOMAIN_BASE: Cluster subdomain (e.g., guid.example.com)
#
# Usage:
#   ansible-playbook grade_module_01.yml
#
# =============================================================================

# Play 1: Initialize grading session
- name: Initialize FTL Grading Session - Module 1
  hosts: localhost
  gather_facts: false
  vars:
    lab_id: "automating-ripu-with-ansible"
    module_number: "01"
    grader_student_report_file: "grading_report_{{ ansible_user | default(ansible_env.USER) }}_module_01.txt"
  roles:
    - ftl_run_init

# Play 2: Grade Module 1 - Pre-upgrade Analysis
- name: Grade Module 1 - Pre-upgrade Analysis
  hosts: localhost
  gather_facts: false
  vars:
    # Report file variable MUST be defined in each play
    grader_student_report_file: "grading_report_{{ ansible_user | default(ansible_env.USER) }}_module_01.txt"

    # AAP connection details
    aap_hostname: "{{ lookup('env', 'AAP_HOSTNAME') }}"
    aap_username: "{{ lookup('env', 'AAP_USERNAME') | default('lab-user', true) }}"
    aap_password: "{{ lookup('env', 'AAP_PASSWORD') }}"
    aap_validate_certs: false

    # RIPU nodes to check
    ripu_nodes:
      - node1  # RHEL 7
      - node2  # RHEL 8
      - node3  # RHEL 9

  tasks:
    # =========================================================================
    # Environment Variable Validation
    # =========================================================================
    - name: Validate required environment variables are set
      ansible.builtin.assert:
        that:
          - lookup('env', 'AAP_HOSTNAME') | length > 0
          - lookup('env', 'AAP_PASSWORD') | length > 0
        fail_msg: |
          Required environment variables not set:
          - AAP_HOSTNAME: AAP controller URL (e.g., https://controller-guid.example.com)
          - AAP_PASSWORD: AAP password

          Set them with:
            export AAP_HOSTNAME="https://controller-guid.example.com"
            export AAP_PASSWORD="your_password"
        quiet: false

    # =========================================================================
    # Checkpoint 1.1: AAP Controller Accessible and Licensed
    # =========================================================================
    - name: Check AAP controller is accessible
      ansible.builtin.include_role:
        name: grader_check_aap_licensed
      vars:
        task_description_message: "AAP controller accessible and has valid license"
        student_error_message: "AAP controller not accessible or missing license. Check AAP_HOSTNAME environment variable and verify controller is running."

    # =========================================================================
    # Checkpoint 1.2: CaC Job Template Completed
    # =========================================================================
    - name: Check CaC job template completed
      ansible.builtin.include_role:
        name: grader_check_aap_job_completed
      vars:
        job_template_name: "Z / CaC / Controller"
        task_description_message: "Configuration as Code (CaC) job completed successfully"
        require_job_execution: true
        student_error_message: "CaC job not run or failed. Launch the 'Z / CaC / Controller' job template in AAP."

    # =========================================================================
    # Checkpoint 1.3: Lab Initialization Job Completed
    # =========================================================================
    - name: Check lab initialization job completed
      ansible.builtin.include_role:
        name: grader_check_aap_job_completed
      vars:
        job_template_name: "Ansible Leapp Lab Initialization"
        task_description_message: "Lab initialization job completed successfully"
        require_job_execution: true
        student_error_message: "Lab initialization job not run or failed. Launch the 'Ansible Leapp Lab Initialization' job template in AAP."

    # =========================================================================
    # Checkpoint 1.4: Analysis Job Template Exists
    # =========================================================================
    - name: Check analysis job template exists
      ansible.builtin.include_role:
        name: grader_check_aap_job_completed
      vars:
        job_template_name: "AUTO / 01 Analysis"
        task_description_message: "Pre-upgrade analysis job template configured"
        require_job_execution: false
        student_error_message: "Analysis job template not found. Verify CaC job completed successfully."

    # =========================================================================
    # Checkpoint 1.5: Analysis Job Executed Successfully
    # =========================================================================
    - name: Check analysis job executed successfully
      ansible.builtin.include_role:
        name: grader_check_aap_job_completed
      vars:
        job_template_name: "AUTO / 01 Analysis"
        task_description_message: "Pre-upgrade analysis job executed successfully"
        require_job_execution: true
        check_last_n_jobs: 10
        student_error_message: "Analysis job not run or failed. Launch the 'AUTO / 01 Analysis' job template for ALL_rhel hosts."

# Play 3: Generate final report
- name: Finalize FTL Grading Session - Module 1
  hosts: localhost
  gather_facts: false
  vars:
    module_number: "01"
    grader_student_report_file: "grading_report_{{ ansible_user | default(ansible_env.USER) }}_module_01.txt"
  roles:
    - ftl_run_grade_report_generation
    - ftl_run_finish
