---
# =============================================================================
# FTL Solver: Automating RIPU with Ansible - Module 1 (Pre-upgrade Analysis)
# =============================================================================
#
# This playbook automatically completes Module 1 workshop tasks by:
# 1. Launching the CaC job to configure AAP
# 2. Launching the lab initialization job
# 3. Running the pre-upgrade analysis job
#
# Required environment variables:
#   - AAP_HOSTNAME: AAP controller URL
#   - AAP_USERNAME: AAP username (default: lab-user)
#   - AAP_PASSWORD: AAP password
#
# Usage:
#   ansible-playbook solve_module_01.yml
#
# =============================================================================

- name: Solve Module 1 - Pre-upgrade Analysis
  hosts: localhost
  gather_facts: false
  vars:
    aap_hostname: "{{ lookup('env', 'AAP_HOSTNAME') }}"
    aap_username: "{{ lookup('env', 'AAP_USERNAME') | default('lab-user', true) }}"
    aap_password: "{{ lookup('env', 'AAP_PASSWORD') }}"
    aap_validate_certs: false

  tasks:
    # =========================================================================
    # Environment Variable Validation
    # =========================================================================
    - name: Validate required environment variables
      ansible.builtin.assert:
        that:
          - aap_hostname | length > 0
          - aap_password | length > 0
        fail_msg: |
          Required environment variables not set:
          - AAP_HOSTNAME: AAP controller URL
          - AAP_PASSWORD: AAP password

          Set them with:
            export AAP_HOSTNAME="https://controller-guid.example.com"
            export AAP_PASSWORD="your_password"

    # =========================================================================
    # Step 1: Launch CaC Job
    # =========================================================================
    - name: Get CaC job template ID
      ansible.builtin.uri:
        url: "{{ aap_hostname }}/api/controller/v2/job_templates/?name={{ 'Z / CaC / Controller' | urlencode }}"
        method: GET
        user: "{{ aap_username }}"
        password: "{{ aap_password }}"
        force_basic_auth: true
        validate_certs: "{{ aap_validate_certs }}"
        status_code: 200
      register: r_cac_template

    - name: Launch CaC job template
      ansible.builtin.uri:
        url: "{{ aap_hostname }}/api/controller/v2/job_templates/{{ r_cac_template.json.results[0].id }}/launch/"
        method: POST
        user: "{{ aap_username }}"
        password: "{{ aap_password }}"
        force_basic_auth: true
        validate_certs: "{{ aap_validate_certs }}"
        body_format: json
        body: {}
        status_code: [201, 202]
      register: r_cac_launch
      when: r_cac_template.json.count > 0

    - name: Wait for CaC job to complete
      ansible.builtin.uri:
        url: "{{ aap_hostname }}/api/controller/v2/jobs/{{ r_cac_launch.json.id }}/"
        method: GET
        user: "{{ aap_username }}"
        password: "{{ aap_password }}"
        force_basic_auth: true
        validate_certs: "{{ aap_validate_certs }}"
        status_code: 200
      register: r_cac_job
      until: r_cac_job.json.status in ['successful', 'failed', 'error', 'canceled']
      retries: 60
      delay: 10
      when: r_cac_launch is defined

    - name: Display CaC job completion
      ansible.builtin.debug:
        msg: "✓ CaC job completed successfully (Job #{{ r_cac_launch.json.id }})"
      when:
        - r_cac_job is defined
        - r_cac_job.json.status == 'successful'

    - name: Fail if CaC job did not succeed
      ansible.builtin.fail:
        msg: |
          CaC job failed with status: {{ r_cac_job.json.status }}

          Job details:
          - Job ID: {{ r_cac_launch.json.id }}
          - Job URL: {{ aap_hostname }}/#/jobs/playbook/{{ r_cac_launch.json.id }}/output

          Check the AAP Web UI for detailed error logs.
          The CaC job should configure AAP with templates and is required for subsequent steps.
      when:
        - r_cac_job is defined
        - r_cac_job.json.status != 'successful'

    # =========================================================================
    # Step 2: Launch Lab Initialization Job
    # =========================================================================
    - name: Get lab initialization job template ID
      ansible.builtin.uri:
        url: "{{ aap_hostname }}/api/controller/v2/job_templates/?name={{ 'Ansible Leapp Lab initailization' | urlencode }}"
        method: GET
        user: "{{ aap_username }}"
        password: "{{ aap_password }}"
        force_basic_auth: true
        validate_certs: "{{ aap_validate_certs }}"
        status_code: 200
      register: r_init_template

    - name: Launch lab initialization job template
      ansible.builtin.uri:
        url: "{{ aap_hostname }}/api/controller/v2/job_templates/{{ r_init_template.json.results[0].id }}/launch/"
        method: POST
        user: "{{ aap_username }}"
        password: "{{ aap_password }}"
        force_basic_auth: true
        validate_certs: "{{ aap_validate_certs }}"
        body_format: json
        body: {}
        status_code: [201, 202]
      register: r_init_launch
      when: r_init_template.json.count > 0

    - name: Wait for lab initialization to complete
      ansible.builtin.uri:
        url: "{{ aap_hostname }}/api/controller/v2/jobs/{{ r_init_launch.json.id }}/"
        method: GET
        user: "{{ aap_username }}"
        password: "{{ aap_password }}"
        force_basic_auth: true
        validate_certs: "{{ aap_validate_certs }}"
        status_code: 200
      register: r_init_job
      until: r_init_job.json.status in ['successful', 'failed', 'error', 'canceled']
      retries: 60
      delay: 10
      when: r_init_launch is not skipped

    - name: Display lab initialization completion
      ansible.builtin.debug:
        msg: "✓ Lab initialization completed successfully (Job #{{ r_init_launch.json.id }})"
      when:
        - r_init_job is not skipped
        - r_init_job.json.status == 'successful'

    - name: Display warning if lab initialization failed
      ansible.builtin.debug:
        msg: |
          ⚠ Lab initialization job failed with status: {{ r_init_job.json.status }}

          Job details:
          - Job ID: {{ r_init_launch.json.id }}
          - Job URL: {{ aap_hostname }}/#/jobs/playbook/{{ r_init_launch.json.id }}/output

          Common reason: Nodes are already upgraded from a previous run.
          The initialization job expects fresh RHEL 7/8/9 nodes but found upgraded versions.

          Continuing with pet app deployment anyway...
      when:
        - r_init_job is not skipped
        - r_init_job.json.status != 'successful'

    # =========================================================================
    # Step 3: Launch Analysis Job
    # =========================================================================
    - name: Get analysis job template ID
      ansible.builtin.uri:
        url: "{{ aap_hostname }}/api/controller/v2/job_templates/?name={{ 'AUTO / 01 Analysis' | urlencode }}"
        method: GET
        user: "{{ aap_username }}"
        password: "{{ aap_password }}"
        force_basic_auth: true
        validate_certs: "{{ aap_validate_certs }}"
        status_code: 200
      register: r_analysis_template

    - name: Launch analysis job template for ALL_rhel
      ansible.builtin.uri:
        url: "{{ aap_hostname }}/api/controller/v2/job_templates/{{ r_analysis_template.json.results[0].id }}/launch/"
        method: POST
        user: "{{ aap_username }}"
        password: "{{ aap_password }}"
        force_basic_auth: true
        validate_certs: "{{ aap_validate_certs }}"
        body_format: json
        body:
          extra_vars:
            rhel_inventory_group: "ALL_rhel"
        status_code: [201, 202]
      register: r_analysis_launch
      when: r_analysis_template.json.count > 0

    - name: Wait for analysis job to complete
      ansible.builtin.uri:
        url: "{{ aap_hostname }}/api/controller/v2/jobs/{{ r_analysis_launch.json.id }}/"
        method: GET
        user: "{{ aap_username }}"
        password: "{{ aap_password }}"
        force_basic_auth: true
        validate_certs: "{{ aap_validate_certs }}"
        status_code: 200
      register: r_analysis_job
      until: r_analysis_job.json.status in ['successful', 'failed', 'error', 'canceled']
      retries: 60
      delay: 10
      when: r_analysis_launch is not skipped

    - name: Display analysis job completion
      ansible.builtin.debug:
        msg: "✓ Pre-upgrade analysis completed successfully (Job #{{ r_analysis_launch.json.id }})"
      when:
        - r_analysis_job is not skipped
        - r_analysis_job.json.status == 'successful'

    - name: Display warning if analysis job failed
      ansible.builtin.debug:
        msg: |
          ⚠ Pre-upgrade analysis job failed with status: {{ r_analysis_job.json.status }}

          Job details:
          - Job ID: {{ r_analysis_launch.json.id }}
          - Job URL: {{ aap_hostname }}/#/jobs/playbook/{{ r_analysis_launch.json.id }}/output

          Common reason: Nodes are already upgraded from a previous run.
          The analysis job expects to analyze RHEL 7→8, 8→9, 9→10 upgrades.

          Continuing with pet app deployment anyway...
      when:
        - r_analysis_job is not skipped
        - r_analysis_job.json.status != 'successful'

    # =========================================================================
    # Step 4: Deploy Pet App Directly on Nodes (Exercise 1.6)
    # =========================================================================
    - name: Display pet app deployment message
      ansible.builtin.debug:
        msg: |
          ================================================================================
          Deploying Pet Application on all nodes
          ================================================================================

          This will install and configure the Spring PetClinic application on:
            - node1 (RHEL 7)
            - node2 (RHEL 8)
            - node3 (RHEL 9)

          ================================================================================

# Play 2: Deploy Pet App on All Nodes
- name: Solve Module 1 - Deploy Pet Application
  hosts: nodes
  gather_facts: true
  become: false

  tasks:
    # =========================================================================
    # Install dependencies
    # =========================================================================
    - name: Configure Adoptium yum repository for Temurin JDK
      ansible.builtin.yum_repository:
        name: adoptium
        description: Adoptium repo for Temurin OpenJDK
        gpgkey: https://packages.adoptium.net/artifactory/api/gpg/key/public
        baseurl: "https://packages.adoptium.net/artifactory/rpm/rhel/{{ ansible_distribution_major_version }}/x86_64"
        enabled: yes
      become: true

    - name: Install required packages
      ansible.builtin.yum:
        name:
          - mariadb-server
          - mariadb
          - git
          - temurin-17-jdk
        state: present
      become: true

    # =========================================================================
    # Configure and start MariaDB
    # =========================================================================
    - name: Start and enable MariaDB service
      ansible.builtin.service:
        name: mariadb
        state: started
        enabled: true
      become: true

    - name: Create petclinic database and user
      ansible.builtin.shell: |
        mysql -u root <<EOF
        CREATE DATABASE IF NOT EXISTS petclinic;
        ALTER DATABASE petclinic DEFAULT CHARACTER SET utf8 DEFAULT COLLATE utf8_general_ci;
        GRANT ALL PRIVILEGES ON petclinic.* TO 'petclinic'@'localhost' IDENTIFIED BY 'petclinic';
        FLUSH PRIVILEGES;
        EOF
      become: true
      changed_when: true

    # =========================================================================
    # Clone and configure Spring PetClinic
    # =========================================================================
    - name: Check if spring-petclinic already exists
      ansible.builtin.stat:
        path: "{{ ansible_env.HOME }}/spring-petclinic"
      register: r_petclinic_dir

    - name: Clone Spring PetClinic repository
      ansible.builtin.git:
        repo: https://github.com/spring-projects/spring-petclinic.git
        dest: "{{ ansible_env.HOME }}/spring-petclinic"
        version: main
      when: not r_petclinic_dir.stat.exists

    # =========================================================================
    # Start pet application
    # =========================================================================
    - name: Check if pet app is already running
      ansible.builtin.shell: pgrep -f spring-petclinic
      register: r_app_running
      failed_when: false
      changed_when: false

    - name: Start pet app using at
      ansible.builtin.shell: |
        echo 'cd $HOME/spring-petclinic && ./mvnw spring-boot:run -Dspring-boot.run.profiles=mysql >> $HOME/app.log 2>&1' | at now
      when: r_app_running.rc != 0
      changed_when: true

    - name: Wait for application to start
      ansible.builtin.wait_for:
        port: 8080
        timeout: 300
      ignore_errors: true

    # =========================================================================
    # Configure auto-start on reboot
    # =========================================================================
    - name: Add cron entry for pet app auto-start on reboot
      ansible.builtin.cron:
        name: Pet Clinic app start on boot
        special_time: reboot
        job: 'cd $HOME/spring-petclinic && ./mvnw spring-boot:run -Dspring-boot.run.profiles=mysql >> $HOME/app.log 2>&1'

    - name: Display pet app deployment status
      ansible.builtin.debug:
        msg: "✓ Pet application deployed and running on {{ inventory_hostname }}:8080"

# Play 3: Display Summary
- name: Solve Module 1 - Display Summary
  hosts: localhost
  gather_facts: false
  tasks:
    # =========================================================================
    # Summary
    # =========================================================================
    - name: Display completion summary
      ansible.builtin.debug:
        msg: |
          ================================================================================
          Module 1 Solver Completed Successfully
          ================================================================================

          All tasks completed:
            ✓ CaC job configured AAP
            ✓ Lab initialization prepared nodes
            ✓ Pre-upgrade analysis generated Leapp reports
            ✓ Pet application installed (optional exercise 1.6)

          Next steps:
            - Review pre-upgrade reports in RHEL Web Console (Exercise 1.3)
            - Perform manual remediation if needed (Exercise 1.4)
            - Review custom modules (Exercise 1.5)
            - Test pet app accessibility (Exercise 1.6)
            - Run Module 2 solver to execute upgrades
            - Or grade Module 1: grade_lab automating-ripu-with-ansible 1

          ================================================================================
