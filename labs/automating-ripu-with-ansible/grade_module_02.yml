---
# =============================================================================
# FTL Grader: Automating RIPU with Ansible - Module 2 (Upgrade Execution)
# =============================================================================
#
# This playbook validates the RHEL in-place upgrade execution phase
#
# Required environment variables:
#   - AAP_HOSTNAME: AAP controller URL
#   - AAP_USERNAME: AAP username (default: lab-user)
#   - AAP_PASSWORD: AAP password
#
# Usage:
#   ansible-playbook grade_module_02.yml
#
# =============================================================================

# Play 1: Initialize grading session
- name: Initialize FTL Grading Session - Module 2
  hosts: localhost
  gather_facts: false
  vars:
    lab_id: "automating-ripu-with-ansible"
    module_number: "02"
    grader_student_report_file: "grading_report_{{ lookup('env', 'LAB_USER') | default(lookup('env', 'USER')) | default('student') }}_module_02.txt"
  roles:
    - ftl_run_init

# Play 2: Grade Module 2 - Upgrade Workflow (Exercises 2.1)
- name: Grade Module 2 - Upgrade Workflow
  hosts: localhost
  gather_facts: false
  vars:
    grader_student_report_file: "grading_report_{{ lookup('env', 'LAB_USER') | default(lookup('env', 'USER')) | default('student') }}_module_02.txt"
    aap_hostname: "{{ lookup('env', 'AAP_HOSTNAME') }}"
    aap_username: "{{ lookup('env', 'AAP_USERNAME') | default('lab-user', true) }}"
    aap_password: "{{ lookup('env', 'AAP_PASSWORD') }}"
    aap_validate_certs: false

  tasks:
    # =========================================================================
    # Environment Variable Validation
    # =========================================================================
    - name: Validate required environment variables
      ansible.builtin.assert:
        that:
          - lookup('env', 'AAP_HOSTNAME') | length > 0
          - lookup('env', 'AAP_PASSWORD') | length > 0
        fail_msg: |
          Required environment variables not set:
          - AAP_HOSTNAME: AAP controller URL
          - AAP_PASSWORD: AAP password

          Set them with:
            export AAP_HOSTNAME="https://controller-guid.example.com"
            export AAP_PASSWORD="your_password"

    # =========================================================================
    # Exercise 2.1: Run OS Upgrade Jobs
    # =========================================================================
    - name: "Exercise 2.1: Upgrade workflow template exists"
      ansible.builtin.include_role:
        name: grader_check_aap_workflow_completed
      vars:
        workflow_template_name: "AUTO / 02 Upgrade"
        task_description_message: "Exercise 2.1: Upgrade workflow template configured"
        require_job_execution: false
        student_error_message: "Upgrade workflow template not found. Verify CaC job completed."

    - name: "Exercise 2.1: Upgrade workflow job executed"
      ansible.builtin.include_role:
        name: grader_check_aap_workflow_completed
      vars:
        workflow_template_name: "AUTO / 02 Upgrade"
        task_description_message: "Exercise 2.1: Upgrade workflow executed (status may show failed due to infrastructure)"
        require_job_execution: true
        check_last_n_jobs: 10
        allow_failed_status: true
        student_error_message: "Upgrade workflow not run. Launch 'AUTO / 02 Upgrade' workflow."

# Play 3: Grade Module 2 - Node Validation (Exercises 2.2-2.4)
- name: Grade Module 2 - RHEL Upgrade Validation
  hosts: nodes
  gather_facts: true
  become: false
  vars:
    grader_student_report_file: "grading_report_{{ lookup('env', 'LAB_USER') | default(lookup('env', 'USER')) | default('student') }}_module_02.txt"

  tasks:
    # =========================================================================
    # Exercise 2.2: Let's Talk About Snapshots
    # =========================================================================
    # NOTE: Exercise 2.2 is DISCUSSION ONLY per workshop instructions
    # Workshop says: "This exercise is for discussion only in the current lab environment.
    # No steps are to be performed." Snapshots are disabled in lab.
    # We skip automated validation for this discussion-only exercise.

    # =========================================================================
    # Exercise 2.3: Check if the Upgrade Worked
    # =========================================================================
    - name: "Exercise 2.3: node1 upgraded from RHEL 7 to RHEL 8"
      when: inventory_hostname == 'node1'
      ansible.builtin.include_role:
        name: grader_check_command_output
      vars:
        command: "cat /etc/redhat-release"
        expected_output_regex: "Red Hat Enterprise Linux.*release 8"
        task_description_message: "Exercise 2.3: node1 upgraded to RHEL 8"
        student_error_message: |
          node1 not upgraded to RHEL 8. Check upgrade workflow job output.
          NOTE: In lab environments, infrastructure limitations may cause upgrades to fail.
          This is expected and demonstrates real-world upgrade challenges discussed in workshop.

    - name: "Exercise 2.3: node2 upgraded from RHEL 8 to RHEL 9"
      when: inventory_hostname == 'node2'
      ansible.builtin.include_role:
        name: grader_check_command_output
      vars:
        command: "cat /etc/redhat-release"
        expected_output_regex: "Red Hat Enterprise Linux.*release 9"
        task_description_message: "Exercise 2.3: node2 upgraded to RHEL 9"
        student_error_message: "node2 not upgraded to RHEL 9. Check upgrade workflow job output."

    - name: "Exercise 2.3: node3 upgraded from RHEL 9 to RHEL 10"
      when: inventory_hostname == 'node3'
      ansible.builtin.include_role:
        name: grader_check_command_output
      vars:
        command: "cat /etc/redhat-release"
        expected_output_regex: "Red Hat Enterprise Linux.*(release 10|release 9)"
        task_description_message: "Exercise 2.3: node3 upgrade completed"
        student_error_message: "node3 upgrade failed. Check upgrade workflow job output. (Note: RHEL 10 may show as 9 if not yet available)"

    - name: "Exercise 2.3: System booted into upgraded kernel on {{ inventory_hostname }}"
      ansible.builtin.include_role:
        name: grader_check_command_output
      vars:
        command: "uname -r"
        expected_rc: 0
        task_description_message: "Exercise 2.3: {{ inventory_hostname }} booted successfully post-upgrade"
        student_error_message: "System not responding. Verify node rebooted after upgrade."

    # =========================================================================
    # Exercise 2.4: How is the Pet App Doing (Optional)
    # =========================================================================
    # NOTE: Exercise 1.6 (Pet App Deployment) is OPTIONAL per workshop.
    # These checks only pass if student completed optional Exercise 1.6.

    - name: "Exercise 2.4: Check if pet app was deployed (optional exercise)"
      ansible.builtin.stat:
        path: "{{ ansible_env.HOME }}/spring-petclinic"
      register: r_petapp_check

    - name: "Exercise 2.4: Pet app database running post-upgrade on {{ inventory_hostname }}"
      when: r_petapp_check.stat.exists
      ansible.builtin.include_role:
        name: grader_check_service_running
      vars:
        service_name: "mariadb"
        task_description_message: "Exercise 2.4: Pet app database running post-upgrade on {{ inventory_hostname }}"
        student_error_message: |
          MariaDB not running after upgrade. Exercise 1.6 is optional.
          Run solver to deploy and fix pet app.

    - name: "Exercise 2.4: Pet app running post-upgrade on {{ inventory_hostname }}"
      when: r_petapp_check.stat.exists
      ansible.builtin.include_role:
        name: grader_check_command_output
      vars:
        command: "pgrep -f spring-petclinic"
        expected_rc: 0
        task_description_message: "Exercise 2.4: Pet application running post-upgrade on {{ inventory_hostname }}"
        student_error_message: |
          Pet app not running after upgrade. 3rd-party JDK may be removed (expected).
          Run solver to reinstall JDK and restart pet app.

    - name: "Exercise 2.4: Pet app data preserved on {{ inventory_hostname }}"
      when: r_petapp_check.stat.exists
      ansible.builtin.include_role:
        name: grader_check_command_output
      vars:
        command: "mysql -u root -e 'SELECT COUNT(*) FROM petclinic.owners;' 2>/dev/null"
        expected_rc: 0
        task_description_message: "Exercise 2.4: Pet app database accessible post-upgrade on {{ inventory_hostname }}"
        student_error_message: |
          Pet app database not accessible. Check MariaDB upgrade status.
          Run solver to fix pet app database.

# Play 4: Generate final report
- name: Finalize FTL Grading Session - Module 2
  hosts: localhost
  gather_facts: false
  vars:
    module_number: "02"
    grader_student_report_file: "grading_report_{{ lookup('env', 'LAB_USER') | default(lookup('env', 'USER')) | default('student') }}_module_02.txt"
  roles:
    - ftl_run_grade_report_generation
    - ftl_run_finish
