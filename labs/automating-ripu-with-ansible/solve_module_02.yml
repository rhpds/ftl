---
# =============================================================================
# FTL Solver: Automating RIPU with Ansible - Module 2 (Upgrade Execution)
# =============================================================================
#
# This playbook automatically completes Module 2 workshop tasks by:
# 1. Launching the upgrade workflow job for all RHEL nodes
# 2. Waiting for upgrades to complete
# 3. Fixing the pet app after upgrade (reinstall JDK, restart services)
#
# Required environment variables:
#   - AAP_HOSTNAME: AAP controller URL
#   - AAP_USERNAME: AAP username (default: lab-user)
#   - AAP_PASSWORD: AAP password
#
# Usage:
#   ansible-playbook solve_module_02.yml
#
# WARNING: This will upgrade ALL nodes (RHEL 7→8, 8→9, 9→10)
#          The upgrade process takes approximately 30-60 minutes
#
# =============================================================================

# Play 1: Run Upgrade Workflow
- name: Solve Module 2 - Upgrade Execution
  hosts: localhost
  gather_facts: false
  vars:
    aap_hostname: "{{ lookup('env', 'AAP_HOSTNAME') }}"
    aap_username: "{{ lookup('env', 'AAP_USERNAME') | default('lab-user', true) }}"
    aap_password: "{{ lookup('env', 'AAP_PASSWORD') }}"
    aap_validate_certs: false

  tasks:
    # =========================================================================
    # Environment Variable Validation
    # =========================================================================
    - name: Validate required environment variables
      ansible.builtin.assert:
        that:
          - aap_hostname | length > 0
          - aap_password | length > 0
        fail_msg: |
          Required environment variables not set:
          - AAP_HOSTNAME: AAP controller URL
          - AAP_PASSWORD: AAP password

    # =========================================================================
    # Display upgrade information
    # =========================================================================
    - name: Display upgrade information
      ansible.builtin.debug:
        msg: |
          ================================================================================
          Starting RHEL In-Place Upgrade
          ================================================================================

          This will:
            - Upgrade node1 from RHEL 7 to RHEL 8
            - Upgrade node2 from RHEL 8 to RHEL 9
            - Upgrade node3 from RHEL 9 to RHEL 10

          Nodes will be unavailable during the upgrade (approximately 30-60 minutes).

          ================================================================================

    # =========================================================================
    # Launch Upgrade Workflow Job
    # =========================================================================
    - name: Get upgrade workflow template ID
      ansible.builtin.uri:
        url: "{{ aap_hostname }}/api/controller/v2/workflow_job_templates/?name={{ 'AUTO / 02 Upgrade' | urlencode }}"
        method: GET
        user: "{{ aap_username }}"
        password: "{{ aap_password }}"
        force_basic_auth: true
        validate_certs: "{{ aap_validate_certs }}"
        status_code: 200
      register: r_upgrade_template

    - name: Launch upgrade workflow for ALL_rhel
      ansible.builtin.uri:
        url: "{{ aap_hostname }}/api/controller/v2/workflow_job_templates/{{ r_upgrade_template.json.results[0].id }}/launch/"
        method: POST
        user: "{{ aap_username }}"
        password: "{{ aap_password }}"
        force_basic_auth: true
        validate_certs: "{{ aap_validate_certs }}"
        body_format: json
        body:
          extra_vars:
            rhel_inventory_group: "ALL_rhel"
        status_code: [201, 202]
      register: r_upgrade_launch
      when: r_upgrade_template.json.count > 0

    - name: Display upgrade job started
      ansible.builtin.debug:
        msg: |
          ================================================================================
          Upgrade workflow started (Workflow Job #{{ r_upgrade_launch.json.id }})

          This will take approximately 30-60 minutes to complete.
          You can monitor progress in the AAP Web UI.

          Waiting for upgrade to complete...
          ================================================================================
      when: r_upgrade_launch is not skipped

    - name: Wait for upgrade workflow to complete
      ansible.builtin.uri:
        url: "{{ aap_hostname }}/api/controller/v2/workflow_jobs/{{ r_upgrade_launch.json.id }}/"
        method: GET
        user: "{{ aap_username }}"
        password: "{{ aap_password }}"
        force_basic_auth: true
        validate_certs: "{{ aap_validate_certs }}"
        status_code: 200
      register: r_upgrade_job
      until: r_upgrade_job.json.status in ['successful', 'failed', 'error', 'canceled']
      retries: 180  # 30 minutes (10 sec intervals)
      delay: 10
      when: r_upgrade_launch is not skipped
      failed_when: false

    - name: Display upgrade completion
      ansible.builtin.debug:
        msg: |
          {{ '✓ Upgrade workflow completed successfully' if r_upgrade_job.json.status == 'successful' else '⚠ Upgrade workflow status: ' + r_upgrade_job.json.status }}

          {% if r_upgrade_job.json.status != 'successful' %}
          Note: If nodes are already upgraded from a previous run, the upgrade workflow
          will fail because it expects RHEL 7/8/9 but found RHEL 8/9/10.

          Continuing with pet app restoration...
          {% endif %}
      when: r_upgrade_job is not skipped

# Play 2: Fix Pet App After Upgrade
- name: Solve Module 2 - Fix Pet App Post-Upgrade
  hosts: nodes
  gather_facts: true
  become: false

  tasks:
    # =========================================================================
    # Check if upgrade actually happened
    # =========================================================================
    - name: Get current RHEL version
      ansible.builtin.command: cat /etc/redhat-release
      register: r_rhel_version
      changed_when: false

    - name: Display current version
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: {{ r_rhel_version.stdout }}"

    # =========================================================================
    # Fix Pet App (if it exists)
    # =========================================================================
    - name: Check if pet app directory exists
      ansible.builtin.stat:
        path: "{{ ansible_env.HOME }}/spring-petclinic"
      register: r_petapp_dir

    - name: Pet app restoration block
      when: r_petapp_dir.stat.exists
      block:
        # ---------------------------------------------------------------------
        # Ensure Adoptium repo is configured
        # ---------------------------------------------------------------------
        - name: Check current RHEL major version
          ansible.builtin.set_fact:
            current_rhel_major: "{{ ansible_distribution_major_version }}"

        - name: Configure Adoptium yum repository
          ansible.builtin.yum_repository:
            name: adoptium
            description: Adoptium repo for Temurin OpenJDK
            gpgkey: https://packages.adoptium.net/artifactory/api/gpg/key/public
            baseurl: "https://packages.adoptium.net/artifactory/rpm/rhel/{{ current_rhel_major }}/x86_64"
            enabled: yes
          become: true

        # ---------------------------------------------------------------------
        # Reinstall JDK if missing (3rd party package often removed during upgrade)
        # ---------------------------------------------------------------------
        - name: Check if temurin-17-jdk is installed
          ansible.builtin.command: rpm -q temurin-17-jdk
          register: r_jdk_check
          failed_when: false
          changed_when: false

        - name: Reinstall temurin-17-jdk if missing
          ansible.builtin.yum:
            name: temurin-17-jdk
            state: present
          become: true
          when: r_jdk_check.rc != 0

        # ---------------------------------------------------------------------
        # Ensure MariaDB is running and database exists
        # ---------------------------------------------------------------------
        - name: Start MariaDB service
          ansible.builtin.service:
            name: mariadb
            state: started
            enabled: true
          become: true

        - name: Check if petclinic database exists
          ansible.builtin.shell: mysql -u root -e "SHOW DATABASES LIKE 'petclinic';" 2>/dev/null | grep -q petclinic
          register: r_db_exists
          failed_when: false
          changed_when: false

        - name: Create petclinic database if missing
          ansible.builtin.shell: |
            mysql -u root <<EOF
            CREATE DATABASE IF NOT EXISTS petclinic;
            ALTER DATABASE petclinic DEFAULT CHARACTER SET utf8 DEFAULT COLLATE utf8_general_ci;
            GRANT ALL PRIVILEGES ON petclinic.* TO 'petclinic'@'localhost' IDENTIFIED BY 'petclinic';
            FLUSH PRIVILEGES;
            EOF
          when: r_db_exists.rc != 0
          changed_when: true

        # ---------------------------------------------------------------------
        # Ensure pet app is running
        # ---------------------------------------------------------------------
        - name: Check if pet app is running
          ansible.builtin.shell: pgrep -f spring-petclinic
          register: r_app_running
          failed_when: false
          changed_when: false

        - name: Start pet app if not running
          when: r_app_running.rc != 0
          block:
            - name: Kill any stale app processes
              ansible.builtin.shell: pkill -f spring-petclinic || true
              become: true
              changed_when: false

            - name: Start pet app using at
              ansible.builtin.shell: |
                echo 'cd $HOME/spring-petclinic && ./mvnw spring-boot:run -Dspring-boot.run.profiles=mysql >> $HOME/app.log 2>&1' | at now
              changed_when: true

            - name: Wait for app service to start
              ansible.builtin.wait_for:
                port: 8080
                timeout: 300
              ignore_errors: true

        # ---------------------------------------------------------------------
        # Ensure cron entry exists for reboot
        # ---------------------------------------------------------------------
        - name: Ensure pet app cron entry exists
          ansible.builtin.cron:
            name: Pet Clinic app start on boot
            special_time: reboot
            job: 'cd $HOME/spring-petclinic && ./mvnw spring-boot:run -Dspring-boot.run.profiles=mysql >> $HOME/app.log 2>&1'

        - name: Display pet app status
          ansible.builtin.debug:
            msg: "✓ Pet app restored on {{ inventory_hostname }}"

# Play 3: Display Summary
- name: Solve Module 2 - Display Summary
  hosts: localhost
  gather_facts: false
  tasks:
    # =========================================================================
    # Summary
    # =========================================================================
    - name: Display completion summary
      ansible.builtin.debug:
        msg: |
          ================================================================================
          Module 2 Solver Completed Successfully
          ================================================================================

          All nodes upgraded:
            ✓ node1: RHEL 7 → RHEL 8
            ✓ node2: RHEL 8 → RHEL 9
            ✓ node3: RHEL 9 → RHEL 10

          Pet app restored:
            ✓ Reinstalled temurin-17-jdk (if missing)
            ✓ Restarted MariaDB service
            ✓ Restarted pet application
            ✓ Restored cron entry for auto-start

          Next steps:
            - Verify upgrades: ssh to nodes and run 'cat /etc/redhat-release'
            - Test pet app: http://<node-ip>:8080
            - Grade Module 2: grade_lab automating-ripu-with-ansible 2
            - Optional: Run Module 3 solver for rollback (if snapshots available)

          ================================================================================
