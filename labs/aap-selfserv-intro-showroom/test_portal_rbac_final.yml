---
# Final Portal RBAC validation - Parse HTML after Playwright login

- name: Test Portal RBAC via HTML Parsing
  hosts: localhost
  gather_facts: false
  become: false

  vars:
    portal_url: "{{ lookup('env', 'SELF_SERVICE_PORTAL_URL') }}"
    aap_admin_username: "admin"
    aap_admin_password: "{{ lookup('env', 'AAP_ADMIN_PASSWORD') }}"

  tasks:
    - name: "Login and check RBAC page for policies"
      shell: |
        python3 << 'PYTHON_SCRIPT'
        from playwright.sync_api import sync_playwright
        import os

        portal_url = os.environ['SELF_SERVICE_PORTAL_URL']
        username = "admin"
        password = os.environ['AAP_ADMIN_PASSWORD']

        print("=== Portal RBAC Validation (HTML Parsing) ===\n")

        with sync_playwright() as p:
            browser = p.chromium.launch(headless=True)
            context = browser.new_context(ignore_https_errors=True)
            page = context.new_page()

            # Step 1: Navigate and login
            print("Step 1: Logging in...")
            page.goto(portal_url, timeout=60000)
            page.wait_for_load_state('networkidle')

            try:
                page.click("button:has-text('Sign In')", timeout=10000)
                page.wait_for_load_state('networkidle', timeout=30000)
            except:
                print("  (Already on login page or sign-in failed)")

            try:
                page.wait_for_timeout(3000)
                username_input = page.locator("input[type='text'], input[name='username']").first
                if username_input.is_visible(timeout=5000):
                    username_input.fill(username)
                password_input = page.locator("input[type='password']").first
                if password_input.is_visible(timeout=5000):
                    password_input.fill(password)
                page.click("button:has-text('Log in')", timeout=5000)
                page.wait_for_load_state('networkidle', timeout=60000)
                print("  ✅ Logged in successfully")
            except Exception as e:
                print(f"  ❌ Login failed: {e}")

            # Step 2: Navigate to RBAC page
            print("\nStep 2: Navigating to RBAC page...")
            page.goto(f"{portal_url}/settings/rbac", timeout=60000)
            page.wait_for_load_state('networkidle')
            page.wait_for_timeout(5000)  # Extra wait for dynamic content
            print(f"  URL: {page.url}")

            # Step 3: Get page content and search for policies
            print("\nStep 3: Searching for RBAC policies...")
            page_content = page.content()
            page_text = page.inner_text('body')

            # Check for policies
            ssa_users_found = 'ssa-portal-users' in page_text
            ssa_rhel_found = 'saa-portal-rhel-team' in page_text or 'saa-portal-rhel' in page_text

            print(f"  ✅ ssa-portal-users found: {ssa_users_found}")
            print(f"  ✅ saa-portal-rhel-team found: {ssa_rhel_found}")

            # Check for group counts (2 groups and 1 group)
            two_groups_found = '2 groups' in page_text or '2 group' in page_text
            one_group_found = '1 group' in page_text

            print(f"  ✅ '2 groups' found: {two_groups_found}")
            print(f"  ✅ '1 group' found: {one_group_found}")

            # Take screenshot
            screenshot_path = '/tmp/portal_rbac_final.png'
            page.screenshot(path=screenshot_path)
            print(f"\n  📸 Screenshot saved: {screenshot_path}")

            browser.close()

            # Summary
            print("\n" + "="*60)
            print("VALIDATION RESULTS:")
            print("="*60)

            all_passed = ssa_users_found and ssa_rhel_found

            if all_passed:
                print("✅ SUCCESS: Both Portal RBAC policies found!")
                print("  - ssa-portal-users: ✓")
                print("  - saa-portal-rhel-team: ✓")
            else:
                print("❌ FAILED: Some policies missing")
                if not ssa_users_found:
                    print("  - ssa-portal-users: ✗ NOT FOUND")
                if not ssa_rhel_found:
                    print("  - saa-portal-rhel-team: ✗ NOT FOUND")

            print("="*60)

            # Exit with appropriate code
            exit(0 if all_passed else 1)

        PYTHON_SCRIPT
      environment:
        SELF_SERVICE_PORTAL_URL: "{{ portal_url }}"
        AAP_ADMIN_PASSWORD: "{{ aap_admin_password }}"
      register: r_rbac_validation
      ignore_errors: true

    - name: "Display validation result"
      ansible.builtin.debug:
        var: r_rbac_validation.stdout_lines

    - name: "Check if validation passed"
      ansible.builtin.assert:
        that:
          - r_rbac_validation.rc == 0
        fail_msg: "Portal RBAC validation failed - policies not found"
        success_msg: "Portal RBAC validation passed - all policies found"
