---
# Test RHDH Permission API with backend-secret from OpenShift
# Based on screenshot showing self-service-auth secret in Portal namespace

- name: Test RHDH Permission API with Backend Secret
  hosts: localhost
  gather_facts: false
  become: false

  vars:
    portal_url: "{{ lookup('env', 'SELF_SERVICE_PORTAL_URL') }}"
    # Extract namespace from portal URL
    # Example: https://self-service-rhaap-portal-user2-aap-ssap.apps.cluster-j7kml.dynamic.redhatworkshops.io
    # Namespace: user2-aap-ssap
    portal_namespace: "{{ lookup('env', 'SELF_SERVICE_PORTAL_URL') | regex_replace('^https://[^-]+-[^-]+-[^-]+-([^.]+)\\..*', '\\1') }}"

  tasks:
    # =============================================
    # Check OpenShift authentication
    # =============================================
    - name: "Check if authenticated to OpenShift"
      ansible.builtin.shell: oc whoami
      register: r_oc_whoami
      ignore_errors: true
      changed_when: false

    - name: "Display OCP authentication status"
      ansible.builtin.debug:
        msg:
          - "OpenShift user: {{ r_oc_whoami.stdout if r_oc_whoami.rc == 0 else 'NOT AUTHENTICATED' }}"
          - "{{ 'ERROR: Not logged into OpenShift! Run: oc login' if r_oc_whoami.rc != 0 else 'OCP authentication: OK ✓' }}"

    - name: "Fail if not authenticated to OpenShift"
      ansible.builtin.fail:
        msg: |
          Not authenticated to OpenShift!

          Please login first:
          oc login --server={{ lookup('env', 'OPENSHIFT_API_URL') }} \
            --username={{ lookup('env', 'OPENSHIFT_USERNAME') }} \
            --password={{ lookup('env', 'OPENSHIFT_PASSWORD') }} \
            --insecure-skip-tls-verify
      when: r_oc_whoami.rc != 0

    - name: "Display Portal info"
      ansible.builtin.debug:
        msg:
          - "Portal URL: {{ portal_url }}"
          - "Portal Namespace (extracted): {{ portal_namespace }}"

    # =============================================
    # Get RHDH backend secret from OpenShift
    # =============================================
    - name: "Get self-service-auth secret from Portal namespace"
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: "self-service-auth"
        namespace: "{{ portal_namespace }}"
      register: r_rhdh_secret
      ignore_errors: true

    - name: "Display secret info"
      ansible.builtin.debug:
        msg:
          - "Secret found: {{ r_rhdh_secret.resources | length > 0 }}"
          - "Secret keys: {{ r_rhdh_secret.resources[0].data.keys() | list if r_rhdh_secret.resources | length > 0 else 'N/A' }}"
      when: r_rhdh_secret.resources is defined

    - name: "Extract backend-secret value"
      when: r_rhdh_secret.resources | length > 0
      ansible.builtin.set_fact:
        backend_secret: "{{ r_rhdh_secret.resources[0].data['backend-secret'] | b64decode }}"

    - name: "Display backend secret (first 20 chars)"
      when: backend_secret is defined
      ansible.builtin.debug:
        msg:
          - "Backend secret found: {{ backend_secret[:20] }}..."
          - "Secret length: {{ backend_secret | length }} characters"

    # =============================================
    # Test RHDH Permission API with backend secret
    # =============================================
    - name: "Test 1: Try Permission API with backend secret as Bearer token"
      when: backend_secret is defined
      ansible.builtin.uri:
        url: "{{ portal_url }}/api/permission/policies"
        method: GET
        validate_certs: false
        headers:
          Content-Type: "application/json"
          Authorization: "Bearer {{ backend_secret }}"
        status_code: [200, 401, 403]
      register: r_policies_bearer
      ignore_errors: true

    - name: "Display result with Bearer token"
      when: backend_secret is defined
      ansible.builtin.debug:
        msg:
          - "Status: {{ r_policies_bearer.status }}"
          - "{{ 'SUCCESS! API returned 200 ✓' if r_policies_bearer.status == 200 else 'Failed with status ' + (r_policies_bearer.status | string) }}"
          - "Response type: {{ r_policies_bearer.json | type_debug if r_policies_bearer.status == 200 else 'N/A' }}"

    - name: "Test 2: Try Permission API with backend secret in X-Auth-Token header"
      when: backend_secret is defined
      ansible.builtin.uri:
        url: "{{ portal_url }}/api/permission/policies"
        method: GET
        validate_certs: false
        headers:
          Content-Type: "application/json"
          X-Auth-Token: "{{ backend_secret }}"
        status_code: [200, 401, 403]
      register: r_policies_xauth
      ignore_errors: true

    - name: "Display result with X-Auth-Token"
      when: backend_secret is defined
      ansible.builtin.debug:
        msg:
          - "Status: {{ r_policies_xauth.status }}"
          - "{{ 'SUCCESS! API returned 200 ✓' if r_policies_xauth.status == 200 else 'Failed' }}"

    - name: "Test 3: Try Permission API with backend secret in Backstage-Token header"
      when: backend_secret is defined
      ansible.builtin.uri:
        url: "{{ portal_url }}/api/permission/policies"
        method: GET
        validate_certs: false
        headers:
          Content-Type: "application/json"
          Backstage-Token: "{{ backend_secret }}"
        status_code: [200, 401, 403]
      register: r_policies_backstage
      ignore_errors: true

    - name: "Display result with Backstage-Token"
      when: backend_secret is defined
      ansible.builtin.debug:
        msg:
          - "Status: {{ r_policies_backstage.status }}"
          - "{{ 'SUCCESS! API returned 200 ✓' if r_policies_backstage.status == 200 else 'Failed' }}"

    # =============================================
    # If API worked, search for our policies
    # =============================================
    - name: "Search for Portal RBAC policies in API response"
      when:
        - backend_secret is defined
        - r_policies_bearer is defined
        - r_policies_bearer.status == 200
      block:
        - name: "Display full policies response"
          ansible.builtin.debug:
            msg:
              - "Total policies: {{ r_policies_bearer.json | length }}"
              - "Policies preview: {{ r_policies_bearer.json[:2] }}"

        - name: "Convert response to string for searching"
          ansible.builtin.set_fact:
            policies_string: "{{ r_policies_bearer.json | to_json }}"

        - name: "Search for ssa-portal-users policy"
          ansible.builtin.set_fact:
            ssa_users_found: "{{ 'ssa-portal-users' in policies_string }}"

        - name: "Search for saa-portal-rhel-team policy"
          ansible.builtin.set_fact:
            ssa_rhel_found: "{{ 'saa-portal-rhel-team' in policies_string }}"

        - name: "Display policy search results"
          ansible.builtin.debug:
            msg:
              - "================================================"
              - "Portal RBAC Policy Validation Results"
              - "================================================"
              - "ssa-portal-users: {{ 'FOUND ✓' if ssa_users_found else 'NOT FOUND ✗' }}"
              - "saa-portal-rhel-team: {{ 'FOUND ✓' if ssa_rhel_found else 'NOT FOUND ✗' }}"
              - "================================================"
              - "{{ '🎉 SUCCESS: Can validate Portal RBAC via API!' if (ssa_users_found and ssa_rhel_found) else '⚠️  API works but policies not created yet' }}"

    # =============================================
    # Summary
    # =============================================
    - name: "Summary"
      ansible.builtin.debug:
        msg:
          - "========================================================================"
          - "RHDH Backend Secret Authentication Test Results"
          - "========================================================================"
          - "Secret found in OpenShift: {{ 'YES ✓' if backend_secret is defined else 'NO ✗' }}"
          - "Bearer token (Authorization): {{ 'Status ' + (r_policies_bearer.status | string) if r_policies_bearer is defined else 'Not tested' }}"
          - "X-Auth-Token header: {{ 'Status ' + (r_policies_xauth.status | string) if r_policies_xauth is defined else 'Not tested' }}"
          - "Backstage-Token header: {{ 'Status ' + (r_policies_backstage.status | string) if r_policies_backstage is defined else 'Not tested' }}"
          - "========================================================================"
          - "{{ '✅ SUCCESS: Backend secret works for RHDH API authentication!' if (r_policies_bearer is defined and r_policies_bearer.status == 200) or (r_policies_xauth is defined and r_policies_xauth.status == 200) or (r_policies_backstage is defined and r_policies_backstage.status == 200) else '❌ Backend secret authentication failed' }}"
          - "{{ '✅ Can replace HTML parsing with API calls in Module 1 grader!' if (ssa_users_found is defined and ssa_users_found and ssa_rhel_found is defined and ssa_rhel_found) else '' }}"
