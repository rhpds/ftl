---
# Grade Module 2: User Persona Testing
# Validates that each user persona successfully executed job templates

- name: Grade Module 2 - User Persona Testing
  hosts: localhost
  gather_facts: false
  become: false

  vars:
    aap_gateway_url: "{{ lookup('env', 'AAP_CONTROLLER_URL') }}"
    aap_admin_username: "admin"
    aap_admin_password: "{{ lookup('env', 'AAP_ADMIN_PASSWORD') }}"

  tasks:
    # ========================================================================
    # Initialize grading session
    # ========================================================================

    - name: Initialize FTL grading session
      include_role:
        name: ftl_run_init

    # ========================================================================
    # Section 2.1: Verify clouduser1 executed job templates
    # ========================================================================

    - name: "Module 2.1: Check clouduser1 executed Cloud/AWS jobs"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}/api/controller/v2/jobs/?created_by__username=clouduser1&job_template__name__icontains=Cloud"
        method: GET
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
        status_code: [200, 404]
      register: r_cloud_jobs

    - name: "Module 2.1: Evaluate and log result"
      ansible.builtin.set_fact:
        grader_output_message: "{{ 'PASS: clouduser1 executed Cloud/AWS job templates' if (r_cloud_jobs.json.count | default(0) | int > 0) else 'FAIL: clouduser1 executed Cloud/AWS job templates: No jobs found. Login as clouduser1 and run a Cloud/AWS template' }}"

    - name: "Module 2.1: Log result"
      include_role:
        name: ftl_run_log_grade_to_log

    - name: "Module 2.2: Check clouduser1 jobs completed successfully"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}/api/controller/v2/jobs/?created_by__username=clouduser1&status=successful"
        method: GET
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
        status_code: [200, 404]
      register: r_cloud_success

    - name: "Module 2.2: Evaluate and log result"
      ansible.builtin.set_fact:
        grader_output_message: "{{ 'PASS: clouduser1 jobs completed successfully' if (r_cloud_success.json.count | default(0) | int > 0) else 'FAIL: clouduser1 jobs completed successfully: No successful jobs. Check job output for errors' }}"

    - name: "Module 2.2: Log result"
      include_role:
        name: ftl_run_log_grade_to_log

    # ========================================================================
    # Section 2.2: Verify networkuser1 executed job templates
    # ========================================================================

    - name: "Module 2.3: Check networkuser1 executed Network jobs"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}/api/controller/v2/jobs/?created_by__username=networkuser1&job_template__name__icontains=Network"
        method: GET
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
        status_code: [200, 404]
      register: r_network_jobs

    - name: "Module 2.3: Evaluate and log result"
      ansible.builtin.set_fact:
        grader_output_message: "{{ 'PASS: networkuser1 executed Network job templates' if (r_network_jobs.json.count | default(0) | int > 0) else 'FAIL: networkuser1 executed Network job templates: No jobs found. Login as networkuser1 and run a Network template' }}"

    - name: "Module 2.3: Log result"
      include_role:
        name: ftl_run_log_grade_to_log

    - name: "Module 2.4: Check networkuser1 jobs completed successfully"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}/api/controller/v2/jobs/?created_by__username=networkuser1&status=successful"
        method: GET
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
        status_code: [200, 404]
      register: r_network_success

    - name: "Module 2.4: Evaluate and log result"
      ansible.builtin.set_fact:
        grader_output_message: "{{ 'PASS: networkuser1 jobs completed successfully' if (r_network_success.json.count | default(0) | int > 0) else 'FAIL: networkuser1 jobs completed successfully: No successful jobs. Check job output for errors' }}"

    - name: "Module 2.4: Log result"
      include_role:
        name: ftl_run_log_grade_to_log

    # ========================================================================
    # Section 2.3: Verify rheluser1 executed job templates
    # ========================================================================

    - name: "Module 2.5: Check rheluser1 executed RHEL jobs"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}/api/controller/v2/jobs/?created_by__username=rheluser1&job_template__name__icontains=RHEL"
        method: GET
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
        status_code: [200, 404]
      register: r_rhel_jobs

    - name: "Module 2.5: Evaluate and log result"
      ansible.builtin.set_fact:
        grader_output_message: "{{ 'PASS: rheluser1 executed Linux/RHEL job templates' if (r_rhel_jobs.json.count | default(0) | int > 0) else 'FAIL: rheluser1 executed Linux/RHEL job templates: No jobs found. Login as rheluser1 and run a RHEL template' }}"

    - name: "Module 2.5: Log result"
      include_role:
        name: ftl_run_log_grade_to_log

    - name: "Module 2.6: Check rheluser1 jobs completed successfully"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}/api/controller/v2/jobs/?created_by__username=rheluser1&status=successful"
        method: GET
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
        status_code: [200, 404]
      register: r_rhel_success

    - name: "Module 2.6: Evaluate and log result"
      ansible.builtin.set_fact:
        grader_output_message: "{{ 'PASS: rheluser1 jobs completed successfully' if (r_rhel_success.json.count | default(0) | int > 0) else 'FAIL: rheluser1 jobs completed successfully: No successful jobs. Check job output for errors' }}"

    - name: "Module 2.6: Log result"
      include_role:
        name: ftl_run_log_grade_to_log

    # ========================================================================
    # Finalize grading session
    # ========================================================================

    - name: Generate grading report
      include_role:
        name: ftl_run_grade_report_generation

    - name: Display grading report
      include_role:
        name: ftl_run_finish

    - name: "Module 2 grading complete"
      ansible.builtin.debug:
        msg: "✅ Module 2 grading complete - All user personas executed job templates successfully"
