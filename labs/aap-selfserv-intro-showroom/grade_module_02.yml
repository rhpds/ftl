---
# Grade Module 2: User Persona Testing
# Validates that each user persona successfully executed job templates

- name: Grade Module 2 - User Persona Testing
  hosts: localhost
  gather_facts: false
  become: false

  vars:
    aap_controller_url: "{{ lookup('env', 'AAP_CONTROLLER_URL') }}"
    aap_admin_username: "admin"
    aap_admin_password: "{{ lookup('env', 'AAP_ADMIN_PASSWORD') }}"

  tasks:
    # ========================================================================
    # Section 2.1: Verify clouduser1 executed job templates
    # ========================================================================

    - name: "Module 2.1: Verify clouduser1 executed a Cloud/AWS job"
      include_role:
        name: grader_check_command_output
      vars:
        task_description_message: "clouduser1 successfully executed a Cloud/AWS job template"
        command: >-
          awx --conf.host {{ aap_controller_url }}
          --conf.username {{ aap_admin_username }}
          --conf.password {{ aap_admin_password }}
          --conf.insecure
          jobs list --created_by__username clouduser1 --job_template__name__startswith "Cloud/AWS" -f json
          | jq '. | length'
        expected_output_regex: "^[1-9][0-9]*$"
        student_error_message: "clouduser1 has not executed any Cloud/AWS job templates. Login as clouduser1 to Portal and run a Cloud/AWS template"

    - name: "Module 2.2: Verify clouduser1 job completed successfully"
      include_role:
        name: grader_check_command_output
      vars:
        task_description_message: "clouduser1's job completed with status 'successful'"
        command: >-
          awx --conf.host {{ aap_controller_url }}
          --conf.username {{ aap_admin_username }}
          --conf.password {{ aap_admin_password }}
          --conf.insecure
          jobs list --created_by__username clouduser1 --status successful -f json
          | jq '. | length'
        expected_output_regex: "^[1-9][0-9]*$"
        student_error_message: "clouduser1's jobs did not complete successfully. Check job output for errors"

    # ========================================================================
    # Section 2.2: Verify networkuser1 executed job templates
    # ========================================================================

    - name: "Module 2.3: Verify networkuser1 executed a Network job"
      include_role:
        name: grader_check_command_output
      vars:
        task_description_message: "networkuser1 successfully executed a Network job template"
        command: >-
          awx --conf.host {{ aap_controller_url }}
          --conf.username {{ aap_admin_username }}
          --conf.password {{ aap_admin_password }}
          --conf.insecure
          jobs list --created_by__username networkuser1 --job_template__name__startswith "Network/" -f json
          | jq '. | length'
        expected_output_regex: "^[1-9][0-9]*$"
        student_error_message: "networkuser1 has not executed any Network job templates. Login as networkuser1 to Portal and run a Network template"

    - name: "Module 2.4: Verify networkuser1 job completed successfully"
      include_role:
        name: grader_check_command_output
      vars:
        task_description_message: "networkuser1's job completed with status 'successful'"
        command: >-
          awx --conf.host {{ aap_controller_url }}
          --conf.username {{ aap_admin_username }}
          --conf.password {{ aap_admin_password }}
          --conf.insecure
          jobs list --created_by__username networkuser1 --status successful -f json
          | jq '. | length'
        expected_output_regex: "^[1-9][0-9]*$"
        student_error_message: "networkuser1's jobs did not complete successfully. Check job output for errors"

    # ========================================================================
    # Section 2.3: Verify rheluser1 executed job templates
    # ========================================================================

    - name: "Module 2.5: Verify rheluser1 executed a RHEL job"
      include_role:
        name: grader_check_command_output
      vars:
        task_description_message: "rheluser1 successfully executed a Linux/RHEL job template"
        command: >-
          awx --conf.host {{ aap_controller_url }}
          --conf.username {{ aap_admin_username }}
          --conf.password {{ aap_admin_password }}
          --conf.insecure
          jobs list --created_by__username rheluser1 --job_template__name__startswith "Linux/RHEL" -f json
          | jq '. | length'
        expected_output_regex: "^[1-9][0-9]*$"
        student_error_message: "rheluser1 has not executed any Linux/RHEL job templates. Login as rheluser1 to Portal and run a RHEL template"

    - name: "Module 2.6: Verify rheluser1 job completed successfully"
      include_role:
        name: grader_check_command_output
      vars:
        task_description_message: "rheluser1's job completed with status 'successful'"
        command: >-
          awx --conf.host {{ aap_controller_url }}
          --conf.username {{ aap_admin_username }}
          --conf.password {{ aap_admin_password }}
          --conf.insecure
          jobs list --created_by__username rheluser1 --status successful -f json
          | jq '. | length'
        expected_output_regex: "^[1-9][0-9]*$"
        student_error_message: "rheluser1's jobs did not complete successfully. Check job output for errors"

    # ========================================================================
    # Optional: Verify users can only see authorized templates
    # ========================================================================

    - name: "Module 2.7: Verify RBAC correctly limits clouduser1 access"
      include_role:
        name: grader_check_command_output
      vars:
        task_description_message: "clouduser1 cannot execute Network or RHEL templates (RBAC working)"
        command: >-
          awx --conf.host {{ aap_controller_url }}
          --conf.username clouduser1
          --conf.password {{ aap_admin_password }}
          --conf.insecure
          job_templates list --name__startswith "Network/" -f json
          | jq '. | length'
        expected_output: "0"
        student_error_message: "RBAC not working - clouduser1 can see Network templates. Review Module 1 RBAC configuration"

    - name: "Module 2 grading complete"
      ansible.builtin.debug:
        msg: "✅ Module 2 grading complete - All user personas executed job templates successfully"
