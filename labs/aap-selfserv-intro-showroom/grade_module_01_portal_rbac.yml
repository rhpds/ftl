---
# Grade Module 1 - Portal RBAC Configuration
# Validates RBAC policies in Self-Service Portal using browser automation

- name: Grade Module 1 - Portal RBAC
  hosts: localhost
  gather_facts: false
  become: false

  vars:
    portal_url: "{{ lookup('env', 'SELF_SERVICE_PORTAL_URL') }}"
    aap_admin_username: "admin"
    aap_admin_password: "{{ lookup('env', 'AAP_ADMIN_PASSWORD') }}"
    grader_working_dir: /tmp/grading_dir
    screenshot_dir: "{{ grader_working_dir }}/screenshots"

  tasks:
    # ========================================================================
    # Section 1.1: Verify ssa-portal-users RBAC policy exists
    # ========================================================================

    - name: "Module 1 Portal: Check ssa-portal-users policy exists"
      include_role:
        name: solver_browser_action
      vars:
        browser_action: "check_text"
        browser_url: "{{ portal_url }}"
        browser_login_required: true
        browser_login_url: "{{ portal_url }}"
        browser_login_username: "{{ aap_admin_username }}"
        browser_login_password: "{{ aap_admin_password }}"
        browser_login_username_selector: "#username"
        browser_login_password_selector: "#password"
        browser_login_submit_selector: "button[type='submit']"
        browser_expected_text: "ssa-portal-users"
        browser_navigate_steps:
          - action: "click"
            selector: "text=Administration"
            description: "Click Administration menu"
          - action: "click"
            selector: "text=RBAC"
            description: "Click RBAC"
        browser_timeout: 30000
        browser_screenshot_on_failure: true
        browser_screenshot_path: "{{ screenshot_dir }}/portal_rbac_policies.png"
        task_description_message: "Portal RBAC policy 'ssa-portal-users' exists"
        student_error_message: "RBAC policy 'ssa-portal-users' not found. Create it via Administration → RBAC → Create"

    # ========================================================================
    # Section 1.2: Verify ssa-portal-users has 2 groups assigned
    # ========================================================================

    - name: "Module 1 Portal: Check ssa-portal-users has 2 groups (cloud-team, network-team)"
      include_role:
        name: solver_browser_action
      vars:
        browser_action: "check_text"
        browser_url: "{{ portal_url }}"
        browser_login_required: true
        browser_login_url: "{{ portal_url }}"
        browser_login_username: "{{ aap_admin_username }}"
        browser_login_password: "{{ aap_admin_password }}"
        browser_login_username_selector: "#username"
        browser_login_password_selector: "#password"
        browser_login_submit_selector: "button[type='submit']"
        browser_expected_text: "2 groups"
        browser_navigate_steps:
          - action: "click"
            selector: "text=Administration"
            description: "Click Administration"
          - action: "click"
            selector: "text=RBAC"
            description: "Navigate to RBAC"
        browser_timeout: 30000
        browser_screenshot_on_failure: true
        browser_screenshot_path: "{{ screenshot_dir }}/ssa_portal_users_groups.png"
        task_description_message: "ssa-portal-users policy has 2 groups assigned"
        student_error_message: "ssa-portal-users should have 2 groups (cloud-team, network-team). Edit policy and assign both teams"

    # ========================================================================
    # Section 1.3: Verify saa-portal-rhel-team RBAC policy exists
    # ========================================================================

    - name: "Module 1 Portal: Check saa-portal-rhel-team policy exists"
      include_role:
        name: solver_browser_action
      vars:
        browser_action: "check_text"
        browser_url: "{{ portal_url }}"
        browser_login_required: true
        browser_login_url: "{{ portal_url }}"
        browser_login_username: "{{ aap_admin_username }}"
        browser_login_password: "{{ aap_admin_password }}"
        browser_login_username_selector: "#username"
        browser_login_password_selector: "#password"
        browser_login_submit_selector: "button[type='submit']"
        browser_expected_text: "saa-portal-rhel-team"
        browser_navigate_steps:
          - action: "click"
            selector: "text=Administration"
            description: "Click Administration"
          - action: "click"
            selector: "text=RBAC"
            description: "Navigate to RBAC"
        browser_timeout: 30000
        browser_screenshot_on_failure: true
        browser_screenshot_path: "{{ screenshot_dir }}/portal_rbac_rhel_policy.png"
        task_description_message: "Portal RBAC policy 'saa-portal-rhel-team' exists"
        student_error_message: "RBAC policy 'saa-portal-rhel-team' not found. Create it via Administration → RBAC → Create"

    # ========================================================================
    # Section 1.4: Verify saa-portal-rhel-team has 1 group assigned
    # ========================================================================

    - name: "Module 1 Portal: Check saa-portal-rhel-team has 1 group (rhel-team)"
      include_role:
        name: solver_browser_action
      vars:
        browser_action: "check_text"
        browser_url: "{{ portal_url }}"
        browser_login_required: true
        browser_login_url: "{{ portal_url }}"
        browser_login_username: "{{ aap_admin_username }}"
        browser_login_password: "{{ aap_admin_password }}"
        browser_login_username_selector: "#username"
        browser_login_password_selector: "#password"
        browser_login_submit_selector: "button[type='submit']"
        browser_expected_text: "1 group"
        browser_navigate_steps:
          - action: "click"
            selector: "text=Administration"
            description: "Click Administration"
          - action: "click"
            selector: "text=RBAC"
            description: "Navigate to RBAC"
        browser_timeout: 30000
        browser_screenshot_on_failure: true
        browser_screenshot_path: "{{ screenshot_dir }}/saa_portal_rhel_team_groups.png"
        task_description_message: "saa-portal-rhel-team policy has 1 group assigned"
        student_error_message: "saa-portal-rhel-team should have 1 group (rhel-team). Edit policy and assign rhel-team"

    - name: "Module 1 Portal RBAC grading complete"
      ansible.builtin.debug:
        msg: "✅ Module 1 Portal RBAC grading complete - 4 checkpoints validated"
