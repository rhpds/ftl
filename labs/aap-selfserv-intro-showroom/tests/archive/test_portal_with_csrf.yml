---
# Test Portal API with cookies AND CSRF token in headers

- name: Test Portal API with CSRF Token
  hosts: localhost
  gather_facts: false
  become: false

  vars:
    portal_url: "{{ lookup('env', 'SELF_SERVICE_PORTAL_URL') }}"
    aap_admin_username: "admin"
    aap_admin_password: "{{ lookup('env', 'AAP_ADMIN_PASSWORD') }}"

  tasks:
    - name: "Get authenticated session with CSRF token"
      shell: |
        python3 << 'PYTHON_SCRIPT'
        from playwright.sync_api import sync_playwright
        import requests
        import os
        import json

        portal_url = os.environ['SELF_SERVICE_PORTAL_URL']
        username = "admin"
        password = os.environ['AAP_ADMIN_PASSWORD']

        print("=== Step 1: Playwright OAuth login ===")

        with sync_playwright() as p:
            browser = p.chromium.launch(headless=True)
            context = browser.new_context(ignore_https_errors=True)
            page = context.new_page()

            page.goto(portal_url, timeout=60000)
            page.wait_for_load_state('networkidle')

            try:
                page.click("button:has-text('Sign In')", timeout=10000)
                page.wait_for_load_state('networkidle', timeout=30000)
            except:
                pass

            try:
                page.wait_for_timeout(3000)
                username_input = page.locator("input[type='text'], input[name='username']").first
                if username_input.is_visible(timeout=5000):
                    username_input.fill(username)
                password_input = page.locator("input[type='password']").first
                if password_input.is_visible(timeout=5000):
                    password_input.fill(password)
                page.click("button:has-text('Log in')", timeout=5000)
                page.wait_for_load_state('networkidle', timeout=60000)
                print("  ✅ Logged in")
            except Exception as e:
                print(f"  Login error: {e}")

            page.wait_for_timeout(3000)

            # Extract cookies
            cookies = context.cookies()
            session_cookies = {}
            csrf_token = None

            for cookie in cookies:
                session_cookies[cookie['name']] = cookie['value']
                if cookie['name'] == 'csrftoken':
                    csrf_token = cookie['value']
                    print(f"  ✅ Found CSRF token: {csrf_token[:20]}...")

            browser.close()

        print("\n=== Step 2: API call with cookies AND CSRF header ===")

        session = requests.Session()
        session.verify = False

        # Set cookies
        for name, value in session_cookies.items():
            session.cookies.set(name, value)

        # Set headers including CSRF token
        headers = {
            'X-CSRFToken': csrf_token,
            'X-CSRF-Token': csrf_token,  # Try both common variants
            'Referer': portal_url,
            'Origin': portal_url,
        }

        print(f"  Headers: {list(headers.keys())}")

        api_url = f"{portal_url}/api/permission/policies"
        r_api = session.get(api_url, headers=headers)

        print(f"\n=== Result ===")
        print(f"Status: {r_api.status_code}")

        if r_api.status_code == 200:
            print("✅ SUCCESS! Portal API works with cookies + CSRF header!")
            try:
                data = r_api.json()
                print(f"\nResponse type: {type(data)}")
                print(f"Response preview: {json.dumps(data, indent=2)[:800]}")

                # Search for our policies
                response_str = json.dumps(data)
                ssa_users = 'ssa-portal-users' in response_str
                ssa_rhel = 'saa-portal-rhel-team' in response_str

                print(f"\n✅ ssa-portal-users found: {ssa_users}")
                print(f"✅ saa-portal-rhel-team found: {ssa_rhel}")

                if ssa_users and ssa_rhel:
                    print("\n🎉 Both Portal RBAC policies found via API!")

            except Exception as e:
                print(f"Parse error: {e}")
                print(f"Raw response: {r_api.text[:500]}")
        else:
            print(f"❌ Failed: {r_api.status_code}")
            print(f"Response: {r_api.text[:400]}")

        # Also test roles API
        print("\n=== Step 3: Try roles API ===")
        roles_url = f"{portal_url}/api/permission/roles"
        r_roles = session.get(roles_url, headers=headers)
        print(f"Roles Status: {r_roles.status_code}")
        if r_roles.status_code == 200:
            print(f"Roles preview: {r_roles.text[:300]}")

        PYTHON_SCRIPT
      environment:
        SELF_SERVICE_PORTAL_URL: "{{ portal_url }}"
        AAP_ADMIN_PASSWORD: "{{ aap_admin_password }}"
      register: r_csrf_test

    - name: "Display CSRF test output"
      ansible.builtin.debug:
        var: r_csrf_test.stdout_lines
