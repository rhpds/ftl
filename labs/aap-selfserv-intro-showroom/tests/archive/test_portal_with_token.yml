---
# Test Portal API using AAP-generated Portal token

- name: Test Portal API with Self Service Portal Token
  hosts: localhost
  gather_facts: false
  become: false

  vars:
    aap_gateway_url: "{{ lookup('env', 'AAP_CONTROLLER_URL') }}"
    portal_url: "{{ lookup('env', 'SELF_SERVICE_PORTAL_URL') }}"
    aap_admin_username: "admin"
    aap_admin_password: "{{ lookup('env', 'AAP_ADMIN_PASSWORD') }}"

  tasks:
    # ========================================================================
    # Step 1: Get OAuth application ID for Self Service Portal
    # ========================================================================

    - name: "Get OAuth applications"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}/api/gateway/v1/applications/"
        method: GET
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
      register: r_applications

    - name: "Find Self Service Portal OAuth application"
      ansible.builtin.set_fact:
        portal_app: "{{ r_applications.json.results | selectattr('name', 'equalto', 'Self Service Portal') | first }}"
      when: r_applications.json.count | default(0) | int > 0

    - name: "Display Portal OAuth app"
      ansible.builtin.debug:
        msg:
          - "Portal OAuth App ID: {{ portal_app.id | default('NOT FOUND') }}"
          - "Client ID: {{ portal_app.client_id | default('N/A') }}"

    # ========================================================================
    # Step 2: Create API token for Portal OAuth application
    # ========================================================================

    - name: "Create API token for Self Service Portal"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}/api/gateway/v1/tokens/"
        method: POST
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
        body_format: json
        body:
          description: "FTL Portal RBAC Validation Token"
          scope: "read write"
          application: "{{ portal_app.id }}"
        status_code: [200, 201, 400]
      register: r_portal_token
      when: portal_app is defined

    - name: "Display token creation result"
      ansible.builtin.debug:
        msg:
          - "Status: {{ r_portal_token.status | default('N/A') }}"
          - "Token: {{ r_portal_token.json.token | default('N/A') }}"
      when: r_portal_token is defined

    - name: "Set portal token"
      ansible.builtin.set_fact:
        portal_token: "{{ r_portal_token.json.token }}"
      when:
        - r_portal_token is defined
        - r_portal_token.status in [200, 201]
        - r_portal_token.json.token is defined

    # ========================================================================
    # Step 3: Test Portal API with this token
    # ========================================================================

    - name: "Test 1: GET /api/permission/policies with Portal token (Bearer)"
      ansible.builtin.uri:
        url: "{{ portal_url }}/api/permission/policies"
        method: GET
        headers:
          Authorization: "Bearer {{ portal_token }}"
        validate_certs: false
        status_code: [-1, 200, 201, 400, 401, 403, 404]
      register: r_policies_bearer
      ignore_errors: true
      when: portal_token is defined

    - name: "Display policies result (Bearer)"
      ansible.builtin.debug:
        msg:
          - "Status: {{ r_policies_bearer.status | default('N/A') }}"
          - "Response: {{ r_policies_bearer.json | default(r_policies_bearer.msg | default('N/A')) }}"
      when: r_policies_bearer is defined

    - name: "Test 2: GET /api/permission/roles with Portal token"
      ansible.builtin.uri:
        url: "{{ portal_url }}/api/permission/roles"
        method: GET
        headers:
          Authorization: "Bearer {{ portal_token }}"
        validate_certs: false
        status_code: [-1, 200, 201, 400, 401, 403, 404]
      register: r_roles_bearer
      ignore_errors: true
      when: portal_token is defined

    - name: "Display roles result"
      ansible.builtin.debug:
        msg:
          - "Status: {{ r_roles_bearer.status | default('N/A') }}"
          - "Response: {{ r_roles_bearer.json | default(r_roles_bearer.msg | default('N/A')) }}"
      when: r_roles_bearer is defined

    # ========================================================================
    # Step 4: Try alternative token format (Token instead of Bearer)
    # ========================================================================

    - name: "Test 3: GET /api/permission/policies with Token prefix"
      ansible.builtin.uri:
        url: "{{ portal_url }}/api/permission/policies"
        method: GET
        headers:
          Authorization: "Token {{ portal_token }}"
        validate_certs: false
        status_code: [-1, 200, 201, 400, 401, 403, 404]
      register: r_policies_token
      ignore_errors: true
      when: portal_token is defined

    - name: "Display policies result (Token prefix)"
      ansible.builtin.debug:
        msg:
          - "Status: {{ r_policies_token.status | default('N/A') }}"
          - "Response: {{ r_policies_token.json | default(r_policies_token.msg | default('N/A')) }}"
      when: r_policies_token is defined

    # ========================================================================
    # Summary
    # ========================================================================

    - name: "Summary"
      ansible.builtin.debug:
        msg:
          - "=== Portal API Token Test Results ==="
          - "Portal OAuth App found: {{ 'Yes' if (portal_app is defined) else 'No' }}"
          - "Token created: {{ 'Yes' if (portal_token is defined) else 'No' }}"
          - "Policies API (Bearer): {{ r_policies_bearer.status | default('N/A') }}"
          - "Roles API (Bearer): {{ r_roles_bearer.status | default('N/A') }}"
          - "Policies API (Token): {{ r_policies_token.status | default('N/A') }}"
          - ""
          - "✅ If any returned 200, we can use this token for Portal API!"
