---
# Hybrid approach: Playwright for OAuth login, cookies for API access
# 1. Use Playwright to complete OAuth flow and get cookies
# 2. Use cookies with requests library for Portal API calls

- name: Test Portal Hybrid Authentication (Browser + API)
  hosts: localhost
  gather_facts: false
  become: false

  vars:
    portal_url: "{{ lookup('env', 'SELF_SERVICE_PORTAL_URL') }}"
    aap_admin_username: "admin"
    aap_admin_password: "{{ lookup('env', 'AAP_ADMIN_PASSWORD') }}"

  tasks:
    - name: "Get authenticated cookies via Playwright, then use for API calls"
      shell: |
        python3 << 'PYTHON_SCRIPT'
        from playwright.sync_api import sync_playwright
        import requests
        import os
        import json

        portal_url = os.environ['SELF_SERVICE_PORTAL_URL']
        username = "admin"
        password = os.environ['AAP_ADMIN_PASSWORD']

        print("=== Step 1: Use Playwright to complete OAuth login ===")

        with sync_playwright() as p:
            browser = p.chromium.launch(headless=True)
            context = browser.new_context(ignore_https_errors=True)
            page = context.new_page()

            # Navigate to Portal
            page.goto(portal_url, timeout=60000)
            page.wait_for_load_state('networkidle')

            # Click Sign In
            try:
                page.click("button:has-text('Sign In')", timeout=10000)
                page.wait_for_load_state('networkidle', timeout=30000)
                print("  Clicked Sign In")
            except Exception as e:
                print(f"  Sign In failed: {e}")

            # Wait for and fill AAP login form
            try:
                # Wait for login form (generic input selectors)
                page.wait_for_timeout(3000)  # Give time for OAuth redirect

                # Try to find and fill username
                username_input = page.locator("input[type='text'], input[name='username']").first
                if username_input.is_visible(timeout=5000):
                    username_input.fill(username)
                    print("  Filled username")

                # Fill password
                password_input = page.locator("input[type='password']").first
                if password_input.is_visible(timeout=5000):
                    password_input.fill(password)
                    print("  Filled password")

                # Click login button
                page.click("button:has-text('Log in')", timeout=5000)
                page.wait_for_load_state('networkidle', timeout=60000)
                print("  Clicked Log in")

            except Exception as e:
                print(f"  Login form error: {e}")

            # Handle Authorize page if it appears
            try:
                if page.locator("button:has-text('Authorize')").is_visible(timeout=5000):
                    page.click("button:has-text('Authorize')")
                    page.wait_for_load_state('networkidle', timeout=30000)
                    print("  Clicked Authorize")

                    # Second login might appear
                    try:
                        if page.locator("input[type='password']").is_visible(timeout=5000):
                            print("  Second login form appeared")
                            page.locator("input[type='text']").first.fill(username)
                            page.locator("input[type='password']").first.fill(password)
                            page.click("button:has-text('Log in')")
                            page.wait_for_load_state('networkidle', timeout=30000)
                            print("  Completed second login")
                    except:
                        pass
            except:
                print("  No Authorize page")

            # Wait for Portal to fully load
            page.wait_for_timeout(3000)

            print(f"\n=== Step 2: Extract cookies from Playwright ===")
            print(f"  Current URL: {page.url}")

            # Get all cookies from the browser context
            cookies = context.cookies()
            print(f"  Total cookies: {len(cookies)}")

            # Convert Playwright cookies to requests format
            session_cookies = {}
            for cookie in cookies:
                session_cookies[cookie['name']] = cookie['value']
                print(f"    {cookie['name']} = {cookie['value'][:30]}...")

            browser.close()

        print("\n=== Step 3: Use cookies with requests for Portal API ===")

        # Create requests session with the cookies
        session = requests.Session()
        session.verify = False

        # Set cookies
        for name, value in session_cookies.items():
            session.cookies.set(name, value, domain=portal_url.split('//')[-1].split(':')[0])

        # Try Portal RBAC API
        api_url = f"{portal_url}/api/permission/policies"
        r_api = session.get(api_url)

        print(f"API Status: {r_api.status_code}")

        if r_api.status_code == 200:
            print("\n✅ SUCCESS! Cookies from Playwright work for Portal API!")
            try:
                data = r_api.json()
                print(f"Response: {json.dumps(data, indent=2)[:500]}")

                # Look for our policies
                if isinstance(data, list):
                    policy_names = [p.get('name', p.get('entityRef', 'unknown')) for p in data]
                    print(f"\nPolicies found: {policy_names}")

                    ssa_users = 'ssa-portal-users' in str(policy_names)
                    ssa_rhel = 'saa-portal-rhel-team' in str(policy_names)

                    print(f"\nssa-portal-users found: {ssa_users}")
                    print(f"saa-portal-rhel-team found: {ssa_rhel}")

            except Exception as e:
                print(f"JSON parse error: {e}")
                print(f"Response text: {r_api.text[:500]}")
        else:
            print(f"\n❌ Failed: {r_api.status_code}")
            print(f"Response: {r_api.text[:300]}")

        # Also try roles API
        print("\n=== Step 4: Try roles API ===")
        roles_url = f"{portal_url}/api/permission/roles"
        r_roles = session.get(roles_url)
        print(f"Roles API Status: {r_roles.status_code}")
        if r_roles.status_code == 200:
            print(f"Roles Response: {r_roles.text[:300]}")

        PYTHON_SCRIPT
      environment:
        SELF_SERVICE_PORTAL_URL: "{{ portal_url }}"
        AAP_ADMIN_PASSWORD: "{{ aap_admin_password }}"
      register: r_hybrid_test

    - name: "Display hybrid auth test output"
      ansible.builtin.debug:
        var: r_hybrid_test.stdout_lines
