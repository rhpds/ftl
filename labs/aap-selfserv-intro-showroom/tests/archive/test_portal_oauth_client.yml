---
# Test RHDH Permission API using OAuth client credentials from OpenShift secret
# Based on screenshot showing oauth-client-id and oauth-client-secret

- name: Test RHDH Permission API with OAuth Client Credentials
  hosts: localhost
  gather_facts: false
  become: false

  vars:
    portal_url: "{{ lookup('env', 'SELF_SERVICE_PORTAL_URL') }}"
    aap_admin_username: "admin"
    aap_admin_password: "{{ lookup('env', 'AAP_ADMIN_PASSWORD') }}"
    # Portal namespace from environment (set by set_user_env.sh)
    portal_namespace: "{{ lookup('env', 'PORTAL_NAMESPACE') }}"

  tasks:
    # =============================================
    # Check OpenShift authentication
    # =============================================
    - name: "Check if authenticated to OpenShift"
      ansible.builtin.shell: oc whoami
      register: r_oc_whoami
      ignore_errors: true
      changed_when: false

    - name: "Fail if not authenticated"
      ansible.builtin.fail:
        msg: "Not authenticated to OpenShift! Run: oc login -u system:admin"
      when: r_oc_whoami.rc != 0

    - name: "Display info"
      ansible.builtin.debug:
        msg:
          - "OpenShift user: {{ r_oc_whoami.stdout }}"
          - "Portal URL: {{ portal_url }}"
          - "Portal Namespace: {{ portal_namespace }}"

    # =============================================
    # Get OAuth client credentials from OpenShift
    # =============================================
    - name: "Search for secrets with OAuth client credentials"
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        namespace: "{{ portal_namespace }}"
      register: r_all_secrets

    - name: "Display all secret names"
      ansible.builtin.debug:
        msg: "Secrets in namespace: {{ r_all_secrets.resources | map(attribute='metadata.name') | list }}"

    - name: "Find secret with oauth-client-secret"
      ansible.builtin.set_fact:
        oauth_secret: "{{ r_all_secrets.resources | selectattr('data', 'defined') | selectattr('data.oauth-client-secret', 'defined') | first }}"
      when: r_all_secrets.resources | selectattr('data', 'defined') | selectattr('data.oauth-client-secret', 'defined') | list | length > 0

    - name: "Display OAuth secret found"
      ansible.builtin.debug:
        msg:
          - "OAuth secret name: {{ oauth_secret.metadata.name }}"
          - "Secret keys: {{ oauth_secret.data.keys() | list }}"
      when: oauth_secret is defined

    - name: "Extract OAuth credentials"
      when: oauth_secret is defined
      ansible.builtin.set_fact:
        oauth_client_id: "{{ oauth_secret.data['oauth-client-id'] | b64decode }}"
        oauth_client_secret: "{{ oauth_secret.data['oauth-client-secret'] | b64decode }}"
        aap_host_url: "{{ oauth_secret.data['aap-host-url'] | b64decode }}"
        aap_token: "{{ oauth_secret.data['aap-token'] | b64decode if oauth_secret.data['aap-token'] is defined else '' }}"

    - name: "Display extracted credentials (partial)"
      when: oauth_secret is defined
      ansible.builtin.debug:
        msg:
          - "OAuth Client ID: {{ oauth_client_id[:20] }}..."
          - "OAuth Client Secret: {{ oauth_client_secret[:30] }}..."
          - "AAP Host URL: {{ aap_host_url }}"
          - "AAP Token: {{ aap_token[:20] if aap_token | length > 0 else 'N/A' }}..."
          - ""
          - "Note: Trying OAuth token endpoints at both:"
          - "  1. AAP Host URL: {{ aap_host_url }}/api/o/token/"
          - "  2. AAP Host URL: {{ aap_host_url }}/api/gateway/v1/tokens/"
          - "  3. Portal URL: {{ portal_url }}/api/o/token/"

    # =============================================
    # Method 1: Get OAuth token using client credentials grant
    # =============================================
    - name: "Method 1a: Try OAuth token at AAP Host URL /api/o/token/"
      when: oauth_secret is defined
      ansible.builtin.uri:
        url: "{{ aap_host_url }}/api/o/token/"
        method: POST
        validate_certs: false
        body_format: form-urlencoded
        body:
          grant_type: "client_credentials"
          client_id: "{{ oauth_client_id }}"
          client_secret: "{{ oauth_client_secret }}"
        status_code: [200, 400, 401, 404]
      register: r_oauth_client_creds
      ignore_errors: true

    - name: "Method 1b: Try OAuth token at Portal URL /api/o/token/"
      when:
        - oauth_secret is defined
        - r_oauth_client_creds.status is defined
        - r_oauth_client_creds.status == 404
      ansible.builtin.uri:
        url: "{{ portal_url }}/api/o/token/"
        method: POST
        validate_certs: false
        body_format: form-urlencoded
        body:
          grant_type: "client_credentials"
          client_id: "{{ oauth_client_id }}"
          client_secret: "{{ oauth_client_secret }}"
        status_code: [200, 400, 401, 404]
      register: r_oauth_portal_token
      ignore_errors: true

    - name: "Use Portal token if AAP token failed"
      when:
        - r_oauth_portal_token is defined
        - r_oauth_portal_token.status is defined
        - r_oauth_portal_token.status == 200
      ansible.builtin.set_fact:
        r_oauth_client_creds: "{{ r_oauth_portal_token }}"

    - name: "Display client credentials token response"
      when: r_oauth_client_creds is defined and r_oauth_client_creds.status is defined
      ansible.builtin.debug:
        msg:
          - "Status: {{ r_oauth_client_creds.status }}"
          - "{{ 'Token obtained: ' + r_oauth_client_creds.json.access_token[:30] + '...' if r_oauth_client_creds.status == 200 else 'Failed: ' + (r_oauth_client_creds.json.error | default('Unknown error')) }}"

    - name: "Display error if OAuth request failed"
      when: r_oauth_client_creds is defined and r_oauth_client_creds.status is not defined
      ansible.builtin.debug:
        msg:
          - "OAuth client credentials request failed"
          - "Error: {{ r_oauth_client_creds.msg | default('Unknown error') }}"

    - name: "Save OAuth access token"
      when: r_oauth_client_creds is defined and r_oauth_client_creds.status is defined and r_oauth_client_creds.status == 200
      ansible.builtin.set_fact:
        oauth_access_token: "{{ r_oauth_client_creds.json.access_token }}"

    # =============================================
    # Method 2: Get OAuth token using password grant with client credentials
    # =============================================
    - name: "Method 2: Get OAuth token via password grant + client credentials"
      when: oauth_secret is defined
      ansible.builtin.uri:
        url: "{{ aap_host_url }}/api/o/token/"
        method: POST
        validate_certs: false
        body_format: form-urlencoded
        body:
          grant_type: "password"
          client_id: "{{ oauth_client_id }}"
          client_secret: "{{ oauth_client_secret }}"
          username: "{{ aap_admin_username }}"
          password: "{{ aap_admin_password }}"
        status_code: [200, 400, 401]
      register: r_oauth_password
      ignore_errors: true

    - name: "Display password grant token response"
      when: r_oauth_password is defined and r_oauth_password.status is defined
      ansible.builtin.debug:
        msg:
          - "Status: {{ r_oauth_password.status }}"
          - "{{ 'Token obtained: ' + r_oauth_password.json.access_token[:30] + '...' if r_oauth_password.status == 200 else 'Failed: ' + (r_oauth_password.json.error | default('Unknown error')) }}"

    - name: "Display error if password grant failed"
      when: r_oauth_password is defined and r_oauth_password.status is not defined
      ansible.builtin.debug:
        msg:
          - "OAuth password grant request failed"
          - "Error: {{ r_oauth_password.msg | default('Unknown error') }}"

    - name: "Save OAuth access token from password grant"
      when: r_oauth_password is defined and r_oauth_password.status is defined and r_oauth_password.status == 200
      ansible.builtin.set_fact:
        oauth_access_token: "{{ r_oauth_password.json.access_token }}"

    # =============================================
    # Method 3: Try AAP token directly
    # =============================================
    - name: "Method 3: Test RHDH Permission API with AAP token"
      when: oauth_secret is defined and aap_token | length > 0
      ansible.builtin.uri:
        url: "{{ portal_url }}/api/permission/policies"
        method: GET
        validate_certs: false
        headers:
          Content-Type: "application/json"
          Authorization: "Bearer {{ aap_token }}"
        status_code: [200, 401, 403]
      register: r_api_aap_token
      ignore_errors: true

    - name: "Display AAP token result"
      when: r_api_aap_token is defined and r_api_aap_token.status is defined
      ansible.builtin.debug:
        msg:
          - "Status with AAP token: {{ r_api_aap_token.status }}"
          - "{{ 'SUCCESS! ✓' if r_api_aap_token.status == 200 else 'Failed' }}"

    # =============================================
    # Method 4: Test RHDH Permission API with OAuth access token
    # =============================================
    - name: "Method 4: Test RHDH Permission API with OAuth access token"
      when: oauth_access_token is defined
      ansible.builtin.uri:
        url: "{{ portal_url }}/api/permission/policies"
        method: GET
        validate_certs: false
        headers:
          Content-Type: "application/json"
          Authorization: "Bearer {{ oauth_access_token }}"
        status_code: [200, 401, 403]
      register: r_api_oauth_token
      ignore_errors: true

    - name: "Display OAuth token result"
      when: r_api_oauth_token is defined and r_api_oauth_token.status is defined
      ansible.builtin.debug:
        msg:
          - "Status with OAuth token: {{ r_api_oauth_token.status }}"
          - "{{ 'SUCCESS! ✓' if r_api_oauth_token.status == 200 else 'Failed' }}"

    # =============================================
    # If API worked, search for Portal RBAC policies
    # =============================================
    - name: "Search for Portal RBAC policies"
      when:
        - (r_api_oauth_token is defined and r_api_oauth_token.status is defined and r_api_oauth_token.status == 200) or
          (r_api_aap_token is defined and r_api_aap_token.status is defined and r_api_aap_token.status == 200)
      block:
        - name: "Set API response"
          ansible.builtin.set_fact:
            api_response: "{{ r_api_oauth_token.json if r_api_oauth_token is defined and r_api_oauth_token.status is defined and r_api_oauth_token.status == 200 else r_api_aap_token.json }}"

        - name: "Display policies response"
          ansible.builtin.debug:
            msg:
              - "Total policies: {{ api_response | length if api_response is sequence else 'N/A' }}"
              - "Response preview: {{ api_response[:2] if api_response is sequence else api_response }}"

        - name: "Search for our policies"
          ansible.builtin.set_fact:
            policies_string: "{{ api_response | to_json }}"
            ssa_users_found: "{{ 'ssa-portal-users' in (api_response | to_json) }}"
            ssa_rhel_found: "{{ 'saa-portal-rhel-team' in (api_response | to_json) }}"

        - name: "Display policy search results"
          ansible.builtin.debug:
            msg:
              - "================================================"
              - "Portal RBAC Policy Validation Results"
              - "================================================"
              - "ssa-portal-users: {{ 'FOUND ✓' if ssa_users_found else 'NOT FOUND ✗' }}"
              - "saa-portal-rhel-team: {{ 'FOUND ✓' if ssa_rhel_found else 'NOT FOUND ✗' }}"
              - "================================================"
              - "{{ '🎉 SUCCESS: Can validate Portal RBAC via API!' if (ssa_users_found and ssa_rhel_found) else '⚠️  API works but policies not created yet' }}"

    # =============================================
    # Summary
    # =============================================
    - name: "Summary"
      ansible.builtin.debug:
        msg:
          - "========================================================================"
          - "RHDH Permission API - OAuth Client Credentials Test"
          - "========================================================================"
          - "OAuth secret found: {{ 'YES ✓' if oauth_secret is defined else 'NO ✗' }}"
          - "Client credentials grant: {{ 'Status ' + (r_oauth_client_creds.status | string) if r_oauth_client_creds is defined and r_oauth_client_creds.status is defined else 'Failed or not tested' }}"
          - "Password grant: {{ 'Status ' + (r_oauth_password.status | string) if r_oauth_password is defined and r_oauth_password.status is defined else 'Failed or not tested' }}"
          - "AAP token direct: {{ 'Status ' + (r_api_aap_token.status | string) if r_api_aap_token is defined and r_api_aap_token.status is defined else 'Failed or not tested' }}"
          - "OAuth access token: {{ 'Status ' + (r_api_oauth_token.status | string) if r_api_oauth_token is defined and r_api_oauth_token.status is defined else 'Failed or not tested' }}"
          - "========================================================================"
          - "{{ '✅ SUCCESS: Can authenticate to RHDH Permission API!' if (r_api_oauth_token is defined and r_api_oauth_token.status is defined and r_api_oauth_token.status == 200) or (r_api_aap_token is defined and r_api_aap_token.status is defined and r_api_aap_token.status == 200) else '❌ All authentication methods failed' }}"
          - "{{ '✅ Can replace HTML parsing with API calls in Module 1 grader!' if (ssa_users_found is defined and ssa_users_found and ssa_rhel_found is defined and ssa_rhel_found) else '' }}"
