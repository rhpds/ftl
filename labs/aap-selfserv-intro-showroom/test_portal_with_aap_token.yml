---
# Test Portal API using AAP OAuth token
# Portal authenticates via AAP, so we get token from AAP first

- name: Test Portal API with AAP OAuth Token
  hosts: localhost
  gather_facts: false
  become: false

  vars:
    aap_gateway_url: "{{ lookup('env', 'AAP_CONTROLLER_URL') }}"
    portal_url: "{{ lookup('env', 'SELF_SERVICE_PORTAL_URL') }}"
    aap_admin_username: "admin"
    aap_admin_password: "{{ lookup('env', 'AAP_ADMIN_PASSWORD') }}"

  tasks:
    - name: "Display URLs"
      ansible.builtin.debug:
        msg:
          - "AAP URL: {{ aap_gateway_url }}"
          - "Portal URL: {{ portal_url }}"

    # ========================================================================
    # Step 1: Get OAuth token from AAP
    # ========================================================================

    - name: "Get AAP OAuth2 token"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}/api/gateway/v1/tokens/"
        method: POST
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
        body_format: json
        body:
          description: "FTL Portal API Access"
          scope: "write"
        status_code: [200, 201, 400]
      register: r_token
      ignore_errors: true

    - name: "Display token creation result"
      ansible.builtin.debug:
        msg:
          - "Status: {{ r_token.status }}"
          - "Token created: {{ r_token.json.token | default('N/A') }}"
          - "Response: {{ r_token.json | default(r_token.msg) }}"
      when: r_token is defined

    - name: "Set OAuth token"
      ansible.builtin.set_fact:
        oauth_token: "{{ r_token.json.token }}"
      when:
        - r_token is defined
        - r_token.status in [200, 201]
        - r_token.json.token is defined

    # ========================================================================
    # Step 2: Try Portal API with Bearer token
    # ========================================================================

    - name: "Test Portal /api/permission/policies with Bearer token"
      ansible.builtin.uri:
        url: "{{ portal_url }}/api/permission/policies"
        method: GET
        validate_certs: false
        headers:
          Authorization: "Bearer {{ oauth_token }}"
        status_code: [-1, 200, 201, 400, 401, 403, 404]
      register: r_portal_policies
      ignore_errors: true
      when: oauth_token is defined

    - name: "Display Portal policies response"
      ansible.builtin.debug:
        msg:
          - "Status: {{ r_portal_policies.status }}"
          - "Response: {{ r_portal_policies.json | default(r_portal_policies.msg) }}"
      when: r_portal_policies is defined

    - name: "Test Portal /api/permission/roles with Bearer token"
      ansible.builtin.uri:
        url: "{{ portal_url }}/api/permission/roles"
        method: GET
        validate_certs: false
        headers:
          Authorization: "Bearer {{ oauth_token }}"
        status_code: [-1, 200, 201, 400, 401, 403, 404]
      register: r_portal_roles
      ignore_errors: true
      when: oauth_token is defined

    - name: "Display Portal roles response"
      ansible.builtin.debug:
        msg:
          - "Status: {{ r_portal_roles.status }}"
          - "Response: {{ r_portal_roles.json | default(r_portal_roles.msg) }}"
      when: r_portal_roles is defined

    - name: "Test Portal /api/catalog/entities?kind=Group with Bearer token"
      ansible.builtin.uri:
        url: "{{ portal_url }}/api/catalog/entities?kind=Group"
        method: GET
        validate_certs: false
        headers:
          Authorization: "Bearer {{ oauth_token }}"
        status_code: [-1, 200, 201, 400, 401, 403, 404]
      register: r_portal_groups
      ignore_errors: true
      when: oauth_token is defined

    - name: "Display Portal groups response"
      ansible.builtin.debug:
        msg:
          - "Status: {{ r_portal_groups.status }}"
          - "Groups found: {{ r_portal_groups.json | default([]) | length }}"
          - "Sample group: {{ r_portal_groups.json[0] | default('N/A') }}"
      when: r_portal_groups is defined and r_portal_groups.status == 200

    # ========================================================================
    # Step 3: Try alternative authentication methods
    # ========================================================================

    - name: "Test Portal API with AAP basic auth directly"
      ansible.builtin.uri:
        url: "{{ portal_url }}/api/permission/policies"
        method: GET
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
        status_code: [-1, 200, 201, 400, 401, 403, 404]
      register: r_portal_basic
      ignore_errors: true

    - name: "Display basic auth result"
      ansible.builtin.debug:
        msg:
          - "Status with basic auth: {{ r_portal_basic.status }}"
          - "Response: {{ r_portal_basic.json | default(r_portal_basic.msg) }}"

    # ========================================================================
    # Step 4: Check if Portal has a different auth endpoint
    # ========================================================================

    - name: "Test Portal /api/auth/providers"
      ansible.builtin.uri:
        url: "{{ portal_url }}/api/auth/providers"
        method: GET
        validate_certs: false
        status_code: [-1, 200, 201, 400, 401, 403, 404]
      register: r_auth_providers
      ignore_errors: true

    - name: "Display auth providers"
      ansible.builtin.debug:
        msg:
          - "Status: {{ r_auth_providers.status }}"
          - "Response: {{ r_auth_providers.json | default(r_auth_providers.msg) }}"

    - name: "Summary"
      ansible.builtin.debug:
        msg:
          - "=== Authentication Results ==="
          - "AAP Token created: {{ 'Yes' if (oauth_token is defined) else 'No' }}"
          - "Portal with Bearer token: {{ r_portal_policies.status | default('N/A') }}"
          - "Portal with Basic auth: {{ r_portal_basic.status }}"
          - "Auth providers endpoint: {{ r_auth_providers.status }}"
