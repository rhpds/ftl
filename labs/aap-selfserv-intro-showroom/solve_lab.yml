---
# Solve Lab: AAP Self-Service Portal Introduction
# Main solver playbook that orchestrates all module solvers

- name: Solve AAP Self-Service Portal Introduction Lab
  hosts: localhost
  gather_facts: false
  become: false

  vars:
    lab_name: "Introduction to Ansible Automation Platform Self-Service Automation Portal"
    total_modules: 3

  tasks:
    - name: Display lab solving start
      ansible.builtin.debug:
        msg: |
          ================================================================================
          Starting Lab Auto-Solve: {{ lab_name }}
          ================================================================================
          Total Modules: {{ total_modules }}

          This solver will:
          1. Configure AAP RBAC (teams, users, roles)
          2. Configure Portal RBAC policies
          3. Execute job templates as different user personas
          4. Modify surveys on job templates
          5. Import and execute custom dynamic template

          IMPORTANT: This uses browser automation and may take several minutes.
          ================================================================================

    # ========================================================================
    # Module 1: Configure AAP RBAC and Portal RBAC (UI-based)
    # ========================================================================

    - name: Solve Module 1 - Configure AAP for Self-Service Portal
      ansible.builtin.import_playbook: solve_module_01_ui.yml
      tags: ['module1', 'rbac']

    - name: Pause after Module 1
      ansible.builtin.pause:
        seconds: 5
        prompt: "Module 1 complete. Pausing before Module 2..."

    # ========================================================================
    # Module 2: User Persona Testing
    # ========================================================================

    - name: Solve Module 2 - User Persona Testing
      ansible.builtin.import_playbook: solve_module_02.yml
      tags: ['module2', 'personas']

    - name: Pause after Module 2
      ansible.builtin.pause:
        seconds: 5
        prompt: "Module 2 complete. Pausing before Module 3..."

    # ========================================================================
    # Module 3: Surveys and Custom Templates
    # ========================================================================

    - name: Solve Module 3 - Surveys and Custom Templates
      ansible.builtin.import_playbook: solve_module_03.yml
      tags: ['module3', 'surveys', 'templates']

    # ========================================================================
    # Final Summary
    # ========================================================================

    - name: Display lab solving completion
      ansible.builtin.debug:
        msg: |
          ================================================================================
          Lab Auto-Solve Complete: {{ lab_name }}
          ================================================================================

          ✅ Module 1: AAP and Portal RBAC configured
          ✅ Module 2: All user personas tested job execution
          ✅ Module 3: Survey modified and custom template imported/executed

          All modules solved successfully!

          You can now run grade_lab to verify all checkpoints pass.
          ================================================================================
