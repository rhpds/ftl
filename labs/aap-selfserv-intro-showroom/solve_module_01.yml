---
# Solve Module 1: Configure AAP for Self-Service Portal
# Automatically creates teams and assigns users (RBAC configuration)

- name: Solve Module 1 - Configure AAP RBAC
  hosts: localhost
  gather_facts: false
  become: false

  vars:
    aap_gateway_url: "{{ lookup('env', 'AAP_CONTROLLER_URL') }}"
    aap_admin_username: "admin"
    aap_admin_password: "{{ lookup('env', 'AAP_ADMIN_PASSWORD') }}"
    # Default organization ID (usually 1 for 'Default' org)
    organization_id: 1

  tasks:
    # ========================================================================
    # Section 1.1: Create Teams
    # ========================================================================

    - name: "Create cloud-team"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}/api/gateway/v1/teams/"
        method: POST
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
        body_format: json
        body:
          name: "cloud-team"
          organization: "{{ organization_id }}"
        status_code: [200, 201, 400]
      register: r_cloud_team_create
      # 400 means team already exists

    - name: "Create network-team"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}/api/gateway/v1/teams/"
        method: POST
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
        body_format: json
        body:
          name: "network-team"
          organization: "{{ organization_id }}"
        status_code: [200, 201, 400]
      register: r_network_team_create

    - name: "Create rhel-team"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}/api/gateway/v1/teams/"
        method: POST
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
        body_format: json
        body:
          name: "rhel-team"
          organization: "{{ organization_id }}"
        status_code: [200, 201, 400]
      register: r_rhel_team_create

    # ========================================================================
    # Section 1.2: Get Team IDs for User Assignments
    # ========================================================================

    - name: "Get cloud-team ID"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}/api/gateway/v1/teams/?name=cloud-team"
        method: GET
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
      register: r_cloud_team

    - name: "Get network-team ID"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}/api/gateway/v1/teams/?name=network-team"
        method: GET
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
      register: r_network_team

    - name: "Get rhel-team ID"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}/api/gateway/v1/teams/?name=rhel-team"
        method: GET
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
      register: r_rhel_team

    - name: "Set team IDs"
      ansible.builtin.set_fact:
        cloud_team_id: "{{ r_cloud_team.json.results[0].id }}"
        network_team_id: "{{ r_network_team.json.results[0].id }}"
        rhel_team_id: "{{ r_rhel_team.json.results[0].id }}"

    # ========================================================================
    # Section 1.3: Assign Users to Teams
    # ========================================================================

    - name: "Get clouduser1 ID"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}/api/gateway/v1/users/?username=clouduser1"
        method: GET
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
      register: r_clouduser1

    - name: "Assign clouduser1 to cloud-team"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}/api/gateway/v1/teams/{{ cloud_team_id }}/users/"
        method: POST
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
        body_format: json
        body:
          id: "{{ r_clouduser1.json.results[0].id }}"
        status_code: [200, 201, 204, 400]
      when: r_clouduser1.json.count | default(0) | int > 0

    - name: "Get networkuser1 ID"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}/api/gateway/v1/users/?username=networkuser1"
        method: GET
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
      register: r_networkuser1

    - name: "Assign networkuser1 to network-team"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}/api/gateway/v1/teams/{{ network_team_id }}/users/"
        method: POST
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
        body_format: json
        body:
          id: "{{ r_networkuser1.json.results[0].id }}"
        status_code: [200, 201, 204, 400]
      when: r_networkuser1.json.count | default(0) | int > 0

    - name: "Get rheluser1 ID"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}/api/gateway/v1/users/?username=rheluser1"
        method: GET
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
      register: r_rheluser1

    - name: "Assign rheluser1 to rhel-team"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}/api/gateway/v1/teams/{{ rhel_team_id }}/users/"
        method: POST
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
        body_format: json
        body:
          id: "{{ r_rheluser1.json.results[0].id }}"
        status_code: [200, 201, 204, 400]
      when: r_rheluser1.json.count | default(0) | int > 0

    - name: "Module 1 solve complete"
      ansible.builtin.debug:
        msg: "✅ Module 1 solve complete - Teams created and users assigned"
