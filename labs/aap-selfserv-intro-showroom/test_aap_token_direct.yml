---
# Simple test: Just use the AAP token from the secret directly
# Skip OAuth flow entirely

- name: Test RHDH Permission API with AAP Token from Secret
  hosts: localhost
  gather_facts: false
  become: false

  vars:
    portal_url: "{{ lookup('env', 'SELF_SERVICE_PORTAL_URL') }}"
    portal_namespace: "{{ lookup('env', 'PORTAL_NAMESPACE') }}"

  tasks:
    # =============================================
    # Check OpenShift authentication
    # =============================================
    - name: "Check OpenShift auth"
      ansible.builtin.shell: oc whoami
      register: r_oc_whoami
      ignore_errors: true
      changed_when: false

    - name: "Fail if not authenticated"
      ansible.builtin.fail:
        msg: "Not authenticated to OpenShift! Run: oc login -u system:admin"
      when: r_oc_whoami.rc != 0

    - name: "Display info"
      ansible.builtin.debug:
        msg:
          - "Portal URL: {{ portal_url }}"
          - "Portal Namespace: {{ portal_namespace }}"

    # =============================================
    # Get secret with AAP token
    # =============================================
    - name: "Find secret with oauth-client-secret"
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        namespace: "{{ portal_namespace }}"
      register: r_all_secrets

    - name: "Extract secret with oauth credentials"
      ansible.builtin.set_fact:
        oauth_secret: "{{ r_all_secrets.resources | selectattr('data', 'defined') | selectattr('data.oauth-client-secret', 'defined') | first }}"
      when: r_all_secrets.resources | selectattr('data', 'defined') | selectattr('data.oauth-client-secret', 'defined') | list | length > 0

    - name: "Extract AAP token from secret"
      when: oauth_secret is defined
      ansible.builtin.set_fact:
        aap_token: "{{ oauth_secret.data['aap-token'] | b64decode }}"

    - name: "Display token info"
      when: oauth_secret is defined
      ansible.builtin.debug:
        msg:
          - "Secret name: {{ oauth_secret.metadata.name }}"
          - "AAP Token (first 30 chars): {{ aap_token[:30] }}..."
          - "AAP Token length: {{ aap_token | length }}"

    # =============================================
    # Test RHDH Permission API with AAP token
    # =============================================
    - name: "Test Permission API with AAP token as Bearer"
      when: oauth_secret is defined
      ansible.builtin.uri:
        url: "{{ portal_url }}/api/permission/policies"
        method: GET
        validate_certs: false
        headers:
          Content-Type: "application/json"
          Authorization: "Bearer {{ aap_token }}"
        status_code: [200, 401, 403]
      register: r_api_bearer
      ignore_errors: true

    - name: "Display Bearer token result"
      when: r_api_bearer is defined and r_api_bearer.status is defined
      ansible.builtin.debug:
        msg:
          - "Status: {{ r_api_bearer.status }}"
          - "{{ '✅ SUCCESS! Bearer token works!' if r_api_bearer.status == 200 else '❌ Bearer token failed' }}"

    - name: "Test Permission API with AAP token as static token"
      when: oauth_secret is defined and (r_api_bearer.status is not defined or r_api_bearer.status != 200)
      ansible.builtin.uri:
        url: "{{ portal_url }}/api/permission/policies"
        method: GET
        validate_certs: false
        headers:
          Content-Type: "application/json"
          X-Static-Token: "{{ aap_token }}"
        status_code: [200, 401, 403]
      register: r_api_static
      ignore_errors: true

    - name: "Display static token result"
      when: r_api_static is defined and r_api_static.status is defined
      ansible.builtin.debug:
        msg:
          - "Status: {{ r_api_static.status }}"
          - "{{ '✅ SUCCESS! Static token works!' if r_api_static.status == 200 else '❌ Static token failed' }}"

    # =============================================
    # If successful, search for policies
    # =============================================
    - name: "Search for Portal RBAC policies"
      when:
        - (r_api_bearer is defined and r_api_bearer.status is defined and r_api_bearer.status == 200) or
          (r_api_static is defined and r_api_static.status is defined and r_api_static.status == 200)
      block:
        - name: "Get API response"
          ansible.builtin.set_fact:
            api_response: "{{ r_api_bearer.json if r_api_bearer is defined and r_api_bearer.status is defined and r_api_bearer.status == 200 else r_api_static.json }}"

        - name: "Display policies"
          ansible.builtin.debug:
            msg:
              - "Total policies: {{ api_response | length if api_response is sequence else 'N/A' }}"
              - "Response type: {{ api_response | type_debug }}"

        - name: "Search for our policies"
          ansible.builtin.set_fact:
            ssa_users_found: "{{ 'ssa-portal-users' in (api_response | to_json) }}"
            ssa_rhel_found: "{{ 'saa-portal-rhel-team' in (api_response | to_json) }}"

        - name: "Display search results"
          ansible.builtin.debug:
            msg:
              - "================================================"
              - "Portal RBAC Policy Search Results"
              - "================================================"
              - "ssa-portal-users: {{ 'FOUND ✓' if ssa_users_found else 'NOT FOUND ✗' }}"
              - "saa-portal-rhel-team: {{ 'FOUND ✓' if ssa_rhel_found else 'NOT FOUND ✗' }}"
              - "================================================"
              - "{{ '🎉 SUCCESS: Can validate Portal RBAC via API!' if (ssa_users_found and ssa_rhel_found) else '⚠️  API works but policies not created yet' }}"

    # =============================================
    # Summary
    # =============================================
    - name: "Summary"
      ansible.builtin.debug:
        msg:
          - "========================================================================"
          - "AAP Token Direct Test Results"
          - "========================================================================"
          - "AAP token found: {{ 'YES ✓' if oauth_secret is defined else 'NO ✗' }}"
          - "Bearer token (Authorization): {{ 'Status ' + (r_api_bearer.status | string) if r_api_bearer is defined and r_api_bearer.status is defined else 'Not tested' }}"
          - "Static token (X-Static-Token): {{ 'Status ' + (r_api_static.status | string) if r_api_static is defined and r_api_static.status is defined else 'Not tested' }}"
          - "========================================================================"
          - "{{ '✅ SUCCESS: AAP token works for RHDH Permission API!' if (r_api_bearer is defined and r_api_bearer.status is defined and r_api_bearer.status == 200) or (r_api_static is defined and r_api_static.status is defined and r_api_static.status == 200) else '❌ AAP token authentication failed' }}"
          - "{{ '✅ Can replace HTML parsing with API calls!' if (ssa_users_found is defined and ssa_users_found and ssa_rhel_found is defined and ssa_rhel_found) else '' }}"
