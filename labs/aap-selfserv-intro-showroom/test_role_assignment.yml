---
# Test role assignment API for cloud-team
# Debug why role assignments aren't working

- name: Test Role Assignment API
  hosts: localhost
  gather_facts: false
  become: false

  vars:
    aap_gateway_url: "{{ lookup('env', 'AAP_CONTROLLER_URL') }}"
    aap_admin_username: "admin"
    aap_admin_password: "{{ lookup('env', 'AAP_ADMIN_PASSWORD') }}"

  tasks:
    # ========================================================================
    # Section 1: Get cloud-team and a job template
    # ========================================================================

    - name: "Get cloud-team ID"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}/api/gateway/v1/teams/?name=cloud-team"
        method: GET
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
      register: r_cloud_team

    - name: "Get one Cloud/AWS job template"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}/api/controller/v2/job_templates/?name__istartswith=Cloud/AWS"
        method: GET
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
      register: r_cloud_templates

    - name: "Display IDs"
      ansible.builtin.debug:
        msg:
          - "cloud-team ID: {{ r_cloud_team.json.results[0].id }}"
          - "First job template: {{ r_cloud_templates.json.results[0].name }}"
          - "Job template ID: {{ r_cloud_templates.json.results[0].id }}"
          - "Total Cloud/AWS templates: {{ r_cloud_templates.json.count }}"

    # ========================================================================
    # Section 2: Check current role assignments
    # ========================================================================

    - name: "Get cloud-team from Controller API (has roles)"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}/api/controller/v2/teams/{{ r_cloud_team.json.results[0].id }}/"
        method: GET
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
      register: r_cloud_team_controller

    - name: "Get cloud-team current roles"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}{{ r_cloud_team_controller.json.related.roles }}"
        method: GET
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
      register: r_current_roles

    - name: "Display current roles"
      ansible.builtin.debug:
        msg:
          - "Current role count: {{ r_current_roles.json.count }}"
          - "Current roles: {{ r_current_roles.json.results | map(attribute='name') | list }}"

    # ========================================================================
    # Section 3: Try assigning Execute role on ONE template
    # ========================================================================

    - name: "TEST: Assign Execute role on job template"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}/api/controller/v2/role_team_assignments/"
        method: POST
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
        body_format: json
        body:
          team: "{{ r_cloud_team.json.results[0].id }}"
          role_definition: "JobTemplate Execute"
          content_type: "awx.jobtemplate"
          object_id: "{{ r_cloud_templates.json.results[0].id }}"
        status_code: [-1, 200, 201, 204, 400, 404, 409]
      register: r_test_role
      ignore_errors: true

    - name: "Display role assignment result"
      ansible.builtin.debug:
        msg:
          - "Status: {{ r_test_role.status }}"
          - "Response: {{ r_test_role.json | default(r_test_role.msg) }}"
          - "Changed: {{ r_test_role.changed | default('N/A') }}"

    # ========================================================================
    # Section 4: Check roles after assignment
    # ========================================================================

    - name: "Get cloud-team roles after assignment"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}{{ r_cloud_team_controller.json.related.roles }}"
        method: GET
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
      register: r_roles_after

    - name: "Display roles after assignment"
      ansible.builtin.debug:
        msg:
          - "Role count after: {{ r_roles_after.json.count }}"
          - "Roles: {{ r_roles_after.json.results }}"
          - "Execute roles on JobTemplate: {{ r_roles_after.json.results | selectattr('name', 'equalto', 'Execute') | selectattr('summary_fields.resource_type', 'equalto', 'job_template') | list | length }}"

    # ========================================================================
    # Section 5: Try listing all role assignments
    # ========================================================================

    - name: "Get all role_team_assignments for cloud-team"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}/api/controller/v2/role_team_assignments/?team={{ r_cloud_team.json.results[0].id }}"
        method: GET
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
      register: r_all_assignments

    - name: "Display all role_team_assignments"
      ansible.builtin.debug:
        msg:
          - "Total assignments: {{ r_all_assignments.json.count }}"
          - "Assignments: {{ r_all_assignments.json.results }}"
