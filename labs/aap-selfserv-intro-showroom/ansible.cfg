[defaults]
# FTL Ansible Configuration
# This file tells Ansible where to find FTL collection roles

# Roles path - includes FTL collection roles
roles_path = /opt/rhdp/ftl/roles:./roles:~/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles

# Collections path (if using collections in the future)
collections_paths = ~/.ansible/collections:/usr/share/ansible/collections

# Inventory
inventory = localhost,
host_key_checking = False

# Output
stdout_callback = default
result_format = yaml
bin_ansible_callbacks = True

# Performance
gathering = explicit
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_facts
fact_caching_timeout = 3600

# Misc
retry_files_enabled = False
deprecation_warnings = False

[inventory]
# Use local connection for localhost (don't SSH)
localhost ansible_connection=local
