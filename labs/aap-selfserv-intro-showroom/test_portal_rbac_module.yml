---
# Test the portal_rbac_check module
# This handles the complete OAuth flow in a single browser session

- name: Test Portal RBAC Module
  hosts: localhost
  gather_facts: false
  become: false

  vars:
    portal_url: "{{ lookup('env', 'SELF_SERVICE_PORTAL_URL') }}"
    aap_admin_username: "admin"
    aap_admin_password: "{{ lookup('env', 'AAP_ADMIN_PASSWORD') }}"

  tasks:
    - name: "Test 1: Check if ssa-portal-users policy exists"
      portal_rbac_check:
        portal_url: "{{ portal_url }}"
        username: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        policy_name: "ssa-portal-users"
        headless: true
        screenshot_path: "/tmp/portal_ssa_users.png"
        timeout: 60000
      register: r_ssa_users

    - name: "Display ssa-portal-users result"
      ansible.builtin.debug:
        msg:
          - "Policy found: {{ r_ssa_users.policy_found }}"
          - "Message: {{ r_ssa_users.message }}"
          - "Screenshot: {{ r_ssa_users.screenshot | default('N/A') }}"

    - name: "Test 2: Check if ssa-portal-users has 2 groups"
      portal_rbac_check:
        portal_url: "{{ portal_url }}"
        username: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        policy_name: "ssa-portal-users"
        expected_groups: 2
        headless: true
        screenshot_path: "/tmp/portal_ssa_users_groups.png"
        timeout: 60000
      register: r_ssa_users_groups

    - name: "Display ssa-portal-users groups result"
      ansible.builtin.debug:
        msg:
          - "Policy found: {{ r_ssa_users_groups.policy_found }}"
          - "Groups match: {{ r_ssa_users_groups.groups_match }}"
          - "Message: {{ r_ssa_users_groups.message }}"

    - name: "Test 3: Check if saa-portal-rhel-team exists with 1 group"
      portal_rbac_check:
        portal_url: "{{ portal_url }}"
        username: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        policy_name: "saa-portal-rhel-team"
        expected_groups: 1
        headless: true
        screenshot_path: "/tmp/portal_rhel_team.png"
        timeout: 60000
      register: r_rhel_team

    - name: "Display saa-portal-rhel-team result"
      ansible.builtin.debug:
        msg:
          - "Policy found: {{ r_rhel_team.policy_found }}"
          - "Groups match: {{ r_rhel_team.groups_match }}"
          - "Message: {{ r_rhel_team.message }}"

    - name: "Summary"
      ansible.builtin.debug:
        msg:
          - "=== Portal RBAC Validation Results ==="
          - "ssa-portal-users exists: {{ r_ssa_users.policy_found }}"
          - "ssa-portal-users has 2 groups: {{ r_ssa_users_groups.groups_match }}"
          - "saa-portal-rhel-team exists with 1 group: {{ r_rhel_team.groups_match }}"
          - "All checks passed: {{ r_ssa_users.policy_found and r_ssa_users_groups.groups_match and r_rhel_team.groups_match }}"
