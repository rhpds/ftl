---
# Dump HTML to see what login form selectors are available

- name: Dump Portal Login Page HTML
  hosts: localhost
  gather_facts: false
  become: false

  vars:
    portal_url: "{{ lookup('env', 'SELF_SERVICE_PORTAL_URL') }}"

  tasks:
    - name: "Get HTML after clicking Sign In"
      shell: |
        python3 << 'PYTHON_SCRIPT'
        from playwright.sync_api import sync_playwright
        import os

        portal_url = os.environ['SELF_SERVICE_PORTAL_URL']

        with sync_playwright() as p:
            browser = p.chromium.launch(headless=True)
            context = browser.new_context(ignore_https_errors=True)
            page = context.new_page()

            # Go to Portal
            page.goto(portal_url, timeout=60000)
            page.wait_for_load_state('networkidle')

            # Click Sign In
            page.click("button:has-text('Sign In')", timeout=10000)
            page.wait_for_load_state('networkidle', timeout=30000)

            # Wait a bit for any redirects
            page.wait_for_timeout(5000)

            # Get page info
            print(f"Current URL: {page.url}")
            print(f"Page title: {page.title()}")
            print("\n=== Input fields on page ===")

            # Find all input elements
            inputs = page.locator("input").all()
            print(f"Total input fields found: {len(inputs)}")

            for i, inp in enumerate(inputs):
                try:
                    inp_type = inp.get_attribute("type") or "text"
                    inp_id = inp.get_attribute("id") or "no-id"
                    inp_name = inp.get_attribute("name") or "no-name"
                    inp_placeholder = inp.get_attribute("placeholder") or ""
                    print(f"  Input {i+1}: type={inp_type}, id={inp_id}, name={inp_name}, placeholder={inp_placeholder}")
                except:
                    pass

            print("\n=== Buttons on page ===")
            buttons = page.locator("button").all()
            print(f"Total buttons found: {len(buttons)}")

            for i, btn in enumerate(buttons[:5]):  # Show first 5 buttons
                try:
                    btn_text = btn.inner_text()
                    btn_type = btn.get_attribute("type") or "button"
                    print(f"  Button {i+1}: type={btn_type}, text='{btn_text}'")
                except:
                    pass

            # Save HTML to file
            html_content = page.content()
            with open('/tmp/portal_after_signin.html', 'w') as f:
                f.write(html_content)
            print("\n✅ Full HTML saved to /tmp/portal_after_signin.html")

            # Take screenshot
            page.screenshot(path='/tmp/portal_after_signin_debug.png')
            print("✅ Screenshot saved to /tmp/portal_after_signin_debug.png")

            browser.close()
        PYTHON_SCRIPT
      environment:
        SELF_SERVICE_PORTAL_URL: "{{ portal_url }}"
      register: r_html

    - name: "Display HTML dump output"
      ansible.builtin.debug:
        var: r_html.stdout_lines
