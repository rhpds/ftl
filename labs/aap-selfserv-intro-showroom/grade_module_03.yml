---
# Grade Module 3: Surveys and Custom Templates
# Validates survey modifications and custom template import

- name: Grade Module 3 - Surveys and Custom Templates
  hosts: localhost
  gather_facts: false
  become: false

  vars:
    aap_gateway_url: "{{ lookup('env', 'AAP_CONTROLLER_URL') }}"
    aap_admin_username: "admin"
    aap_admin_password: "{{ lookup('env', 'AAP_ADMIN_PASSWORD') }}"

  tasks:
    # ========================================================================
    # Section 3.1: Verify Survey Modified on Job Template
    # ========================================================================

    - name: "Module 3.1: Get 'Linux/RHEL START Service on RHEL' job template"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}/api/controller/v2/job_templates/?name=Linux/RHEL START Service on RHEL"
        method: GET
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
        status_code: [200, 404]
      register: r_rhel_start_jt

    - name: "Module 3.1: Get survey spec for RHEL START Service job template"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}{{ r_rhel_start_jt.json.results[0].related.survey_spec }}"
        method: GET
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
        status_code: [200, 404]
      register: r_survey_spec
      when:
        - r_rhel_start_jt.json.count | default(0) | int > 0
        - r_rhel_start_jt.json.results[0].survey_enabled | default(false) | bool

    - name: "Module 3.1: Evaluate and log result - Survey enabled"
      ansible.builtin.set_fact:
        grader_output_message: "{{ 'PASS: Survey enabled on Linux/RHEL START Service job template' if (r_rhel_start_jt.json.count | default(0) | int > 0 and r_rhel_start_jt.json.results[0].survey_enabled | default(false) | bool) else 'FAIL: Survey enabled on Linux/RHEL START Service job template: Survey not enabled. Enable survey on the job template' }}"
      when: r_rhel_start_jt.json.count | default(0) | int > 0

    - name: "Module 3.1: Log result - Survey enabled"
      include_role:
        name: ftl_run_log_grade_to_log
      when: r_rhel_start_jt.json.count | default(0) | int > 0

    - name: "Module 3.2: Check survey has 3 questions"
      ansible.builtin.set_fact:
        grader_output_message: "{{ 'PASS: Survey has 3 questions' if (r_survey_spec.json.spec | default([]) | length == 3) else 'FAIL: Survey has 3 questions: Expected 3 questions, found ' + (r_survey_spec.json.spec | default([]) | length | string) + '. Add survey question about enabling service' }}"
      when:
        - r_rhel_start_jt.json.count | default(0) | int > 0
        - r_rhel_start_jt.json.results[0].survey_enabled | default(false) | bool

    - name: "Module 3.2: Log result - Survey question count"
      include_role:
        name: ftl_run_log_grade_to_log
      when:
        - r_rhel_start_jt.json.count | default(0) | int > 0
        - r_rhel_start_jt.json.results[0].survey_enabled | default(false) | bool

    - name: "Module 3.3: Check enable_service survey question exists"
      ansible.builtin.set_fact:
        grader_output_message: "{{ 'PASS: Survey question with variable enable_service exists' if (r_survey_spec.json.spec | default([]) | selectattr('variable', 'equalto', 'enable_service') | list | length > 0) else 'FAIL: Survey question with variable enable_service exists: Variable not found. Create survey question with Answer variable name enable_service' }}"
      when:
        - r_rhel_start_jt.json.count | default(0) | int > 0
        - r_rhel_start_jt.json.results[0].survey_enabled | default(false) | bool

    - name: "Module 3.3: Log result - enable_service variable"
      include_role:
        name: ftl_run_log_grade_to_log
      when:
        - r_rhel_start_jt.json.count | default(0) | int > 0
        - r_rhel_start_jt.json.results[0].survey_enabled | default(false) | bool

    - name: "Module 3.4: Check enable_service question is multiplechoice type"
      ansible.builtin.set_fact:
        enable_service_question: "{{ r_survey_spec.json.spec | default([]) | selectattr('variable', 'equalto', 'enable_service') | first }}"
      when:
        - r_rhel_start_jt.json.count | default(0) | int > 0
        - r_rhel_start_jt.json.results[0].survey_enabled | default(false) | bool
        - r_survey_spec.json.spec | default([]) | selectattr('variable', 'equalto', 'enable_service') | list | length > 0

    - name: "Module 3.4: Evaluate and log result - Question type"
      ansible.builtin.set_fact:
        grader_output_message: "{{ 'PASS: enable_service question is Multiple Choice type' if (enable_service_question.type | default('') == 'multiplechoice') else 'FAIL: enable_service question is Multiple Choice type: Found type ' + (enable_service_question.type | default('text')) + '. Change Answer type to Multiple Choice (single select)' }}"
      when:
        - r_rhel_start_jt.json.count | default(0) | int > 0
        - r_rhel_start_jt.json.results[0].survey_enabled | default(false) | bool
        - enable_service_question is defined

    - name: "Module 3.4: Log result - Question type"
      include_role:
        name: ftl_run_log_grade_to_log
      when:
        - r_rhel_start_jt.json.count | default(0) | int > 0
        - r_rhel_start_jt.json.results[0].survey_enabled | default(false) | bool
        - enable_service_question is defined

    # ========================================================================
    # Section 3.2: Verify Custom Dynamic Template Backing Job Template
    # ========================================================================
    # NOTE: Custom templates live in the Self-Service Portal, not AAP
    # We check for the backing job template as a proxy for environment readiness

    - name: "Module 3.5: Check backing job template exists for custom template"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}/api/controller/v2/job_templates/?name=RHEL / Update RHEL Time Servers"
        method: GET
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
        status_code: [200, 404]
      register: r_time_servers_jt

    - name: "Module 3.5: Evaluate and log result - Custom template backing job"
      ansible.builtin.set_fact:
        grader_output_message: "{{ 'PASS: Custom template backing job template exists (RHEL / Update RHEL Time Servers)' if (r_time_servers_jt.json.count | default(0) | int > 0) else 'FAIL: Custom template backing job template exists: Job template RHEL / Update RHEL Time Servers not found. This template should exist for the custom dynamic template' }}"

    - name: "Module 3.5: Log result - Custom template backing job"
      include_role:
        name: ftl_run_log_grade_to_log

    - name: "Module 3 grading complete"
      ansible.builtin.debug:
        msg: "✅ Module 3 grading complete - Surveys and custom templates verified"
