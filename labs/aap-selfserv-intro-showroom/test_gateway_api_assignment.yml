---
# Test Gateway API for user assignment
# Controller API seems buggy - try Gateway API instead

- name: Test Gateway API User Assignment
  hosts: localhost
  gather_facts: false
  become: false

  vars:
    aap_gateway_url: "{{ lookup('env', 'AAP_CONTROLLER_URL') }}"
    aap_admin_username: "admin"
    aap_admin_password: "{{ lookup('env', 'AAP_ADMIN_PASSWORD') }}"

  tasks:
    # ========================================================================
    # Section 1: Get team and user info
    # ========================================================================

    - name: "Get network-team details"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}/api/gateway/v1/teams/?name=network-team"
        method: GET
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
      register: r_network_team

    - name: "Get rheluser1 details"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}/api/gateway/v1/users/?username=rheluser1"
        method: GET
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
      register: r_rheluser1

    - name: "Display IDs"
      ansible.builtin.debug:
        msg:
          - "network-team ID: {{ r_network_team.json.results[0].id }}"
          - "rheluser1 ID: {{ r_rheluser1.json.results[0].id }}"
          - "Team users URL (related): {{ r_network_team.json.results[0].related.users }}"

    # ========================================================================
    # Section 2: Check current members
    # ========================================================================

    - name: "Get network-team current members"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}{{ r_network_team.json.results[0].related.users }}"
        method: GET
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
      register: r_current_members

    - name: "Display current members"
      ansible.builtin.debug:
        msg:
          - "Current members: {{ r_current_members.json.results | map(attribute='username') | list }}"

    # ========================================================================
    # Section 3: Try Gateway API endpoint (not Controller)
    # ========================================================================

    - name: "TEST: Gateway API v1 team users endpoint"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}/api/gateway/v1/teams/{{ r_network_team.json.results[0].id }}/users/"
        method: POST
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
        body_format: json
        body:
          id: "{{ r_rheluser1.json.results[0].id }}"
        status_code: [-1, 200, 201, 204, 400, 404, 405, 409]
      register: r_test_gateway
      ignore_errors: true

    - name: "Display Gateway API result"
      ansible.builtin.debug:
        msg:
          - "Status: {{ r_test_gateway.status }}"
          - "Response: {{ r_test_gateway.json | default(r_test_gateway.msg) }}"

    # ========================================================================
    # Section 4: Check members after Gateway API attempt
    # ========================================================================

    - name: "Get network-team members after Gateway API"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}{{ r_network_team.json.results[0].related.users }}"
        method: GET
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
      register: r_members_after_gateway

    - name: "Display members after Gateway API"
      ansible.builtin.debug:
        msg:
          - "Members after Gateway API: {{ r_members_after_gateway.json.results | map(attribute='username') | list }}"
          - "Expected to add: rheluser1"
          - "Success: {{ 'rheluser1' in (r_members_after_gateway.json.results | map(attribute='username') | list) }}"

    # ========================================================================
    # Section 5: Try with associate endpoint
    # ========================================================================

    - name: "TEST: Try /associate/ endpoint"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}/api/gateway/v1/teams/{{ r_network_team.json.results[0].id }}/users/associate/"
        method: POST
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
        body_format: json
        body:
          instances: ["{{ r_rheluser1.json.results[0].id }}"]
        status_code: [-1, 200, 201, 204, 400, 404, 405, 409]
      register: r_test_associate
      ignore_errors: true

    - name: "Display associate result"
      ansible.builtin.debug:
        msg:
          - "Status: {{ r_test_associate.status }}"
          - "Response: {{ r_test_associate.json | default(r_test_associate.msg) }}"

    # ========================================================================
    # Section 6: Final member check
    # ========================================================================

    - name: "Get final network-team members"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}{{ r_network_team.json.results[0].related.users }}"
        method: GET
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
      register: r_final_members

    - name: "Display final members"
      ansible.builtin.debug:
        msg:
          - "Final members: {{ r_final_members.json.results | map(attribute='username') | list }}"
