---
# Test full Portal OAuth login flow
# Steps: Click Sign In → AAP login → Authorize → Navigate to RBAC

- name: Test Full Portal OAuth Login Flow
  hosts: localhost
  gather_facts: false
  become: false

  vars:
    portal_url: "{{ lookup('env', 'SELF_SERVICE_PORTAL_URL') }}"
    aap_admin_username: "admin"
    aap_admin_password: "{{ lookup('env', 'AAP_ADMIN_PASSWORD') }}"

  tasks:
    - name: "Step 1: Navigate to Portal and click Sign In"
      include_role:
        name: solver_browser_action
      vars:
        url: "{{ portal_url }}"
        action: "click"
        selector: "button:has-text('Sign In')"
        headless: true
        timeout: 30000

    - name: "Step 2: Wait for AAP login page and enter credentials"
      include_role:
        name: solver_browser_action
      vars:
        url: "{{ portal_url }}"
        action: "fill_form"
        selector: "#username"
        text: "{{ aap_admin_username }}"
        headless: true
        timeout: 30000

    - name: "Step 3: Enter password"
      include_role:
        name: solver_browser_action
      vars:
        url: "{{ portal_url }}"
        action: "fill_form"
        selector: "#password"
        text: "{{ aap_admin_password }}"
        headless: true
        timeout: 30000

    - name: "Step 4: Click login button"
      include_role:
        name: solver_browser_action
      vars:
        url: "{{ portal_url }}"
        action: "click"
        selector: "button[type='submit']"
        headless: true
        timeout: 30000

    - name: "Step 5: Wait for Portal to load (wait for 'Administration' text)"
      include_role:
        name: solver_browser_action
      vars:
        url: "{{ portal_url }}"
        action: "wait_for_text"
        text: "Administration"
        headless: true
        timeout: 60000

    - name: "Step 6: Take screenshot of Portal home"
      include_role:
        name: solver_browser_action
      vars:
        url: "{{ portal_url }}"
        action: "screenshot"
        screenshot_path: "/tmp/portal_logged_in.png"
        headless: true
        timeout: 30000

    - name: "Display result"
      ansible.builtin.debug:
        msg: "✅ Portal OAuth login test complete. Check screenshot at /tmp/portal_logged_in.png"
