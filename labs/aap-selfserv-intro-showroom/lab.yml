---
# Lab metadata for AAP Self-Service Portal Introduction
lab:
  id: aap-selfserv-intro-showroom
  name: "Introduction to Ansible Automation Platform Self-Service Automation Portal"
  description: "Verify pre-configured AAP content and test Self-Service Portal with user personas and custom templates"
  version: "1.0"
  source: "https://github.com/rhpds/aap-selfserv-intro-showroom.git"

# Lab environment details
environment:
  type: "ansible_automation_platform"

  # AAP Controller details
  aap_controller_url: "{{ lookup('env', 'AAP_CONTROLLER_URL') }}"
  aap_admin_username: "admin"
  aap_admin_password: "{{ lookup('env', 'AAP_ADMIN_PASSWORD') }}"

  # Self-Service Portal details
  self_service_portal_url: "{{ lookup('env', 'SELF_SERVICE_PORTAL_URL') }}"

  # Bastion host
  bastion: "bastion.{{ guid }}.example.com"
  bastion_user: "devops"

  # OpenShift (available but not directly used)
  ocp_api_url: "{{ lookup('env', 'OCP_API_URL') | default('') }}"

# Lab modules and validation checkpoints
# NOTE: Module 1 is OBSERVATION only - content is pre-configured by aap_selfservice_custom role
modules:
  - id: 01
    name: "Verify Pre-Configured AAP Environment"
    description: "Students observe pre-configured content - no creation needed"
    sections:
      - id: "01-users"
        name: "Verify Demo Users Exist"
        checkpoints:
          - "clouduser1 exists in AAP"
          - "networkuser1 exists in AAP"
          - "rheluser1 exists in AAP"

      - id: "01-inventories"
        name: "Verify Inventories Exist"
        checkpoints:
          - "AWS Inventory exists"
          - "Network Inventory exists"
          - "RHEL Inventory exists"

      - id: "01-templates"
        name: "Verify Job Templates Exist"
        checkpoints:
          - "At least 5 Cloud/AWS job templates exist"
          - "At least 4 Network job templates exist"
          - "At least 6 Linux/RHEL job templates exist"
          - "Project 'SelfService Demo playbooks' is synced"

      - id: "01-portal"
        name: "Verify Portal is Accessible"
        checkpoints:
          - "Self-Service Portal responds"
          - "OAuth configuration exists"
          - "Users can login to Portal"

  - id: 02
    name: "User Persona Testing"
    sections:
      - id: "02-clouduser1"
        name: "Test as clouduser1"
        checkpoints:
          - "clouduser1 successfully executed a Cloud/AWS job template"

      - id: "02-networkuser1"
        name: "Test as networkuser1"
        checkpoints:
          - "networkuser1 successfully executed a Network job template"

      - id: "02-rheluser1"
        name: "Test as rheluser1"
        checkpoints:
          - "rheluser1 successfully executed a RHEL job template"

  - id: 03
    name: "Surveys and Custom Templates"
    sections:
      - id: "03-surveys"
        name: "Modify surveys and see synchronization"
        checkpoints:
          - "Survey question added to 'Linux/RHEL START Service on RHEL' job template"

      - id: "03-import"
        name: "Import a custom dynamic template"
        checkpoints:
          - "Custom template 'Manage RHEL Time Servers' imported successfully"

      - id: "03-launch"
        name: "Launch the custom template"
        checkpoints:
          - "Custom template job executed successfully"

# Pre-configured demo users (created by aap_selfservice_custom role)
# All users share same password as AAP admin (common_password)
users:
  - username: "clouduser1"
    password: "{{ aap_admin_password }}"
    description: "Cloud automation persona - sees Cloud/AWS job templates"

  - username: "networkuser1"
    password: "{{ aap_admin_password }}"
    description: "Network automation persona - sees Network job templates"

  - username: "rheluser1"
    password: "{{ aap_admin_password }}"
    description: "RHEL automation persona - sees Linux/RHEL job templates"

# Pre-configured content created by aap_selfservice_custom role
pre_configured_content:
  inventories:
    - "AWS Inventory"
    - "Azure Inventory"
    - "GCP Inventory"
    - "RHEL Inventory"
    - "Network Inventory"

  credentials:
    - name: "AWS Credential"
      type: "Amazon Web Services"
      note: "Placeholder credentials for demo"
    - name: "Azure Credential"
      type: "Microsoft Azure"
      note: "Placeholder credentials for demo"
    - name: "Network Credential"
      type: "Network"
      note: "Placeholder credentials for demo"
    - name: "RHEL - SSH Credentials"
      type: "Machine"
      note: "Placeholder credentials for demo"

  project:
    name: "SelfService Demo playbooks"
    scm_url: "https://github.com/ansible-tmm/ssap-lab"
    scm_branch: "main"

  job_templates:
    cloud_aws:
      - "Cloud/AWS AWS Provisioning Workflow"
      - "Cloud/AWS Create RHEL10 instance"
      - "Cloud/AWS Create RHEL9 instance"
      - "Cloud/AWS Check Region Connectivity"
      - "Cloud/AWS Terminate Instance"
    network:
      - "Network/Configure Switch"
      - "Network/Update Firewall Rules"
      - "Network/Backup Configuration"
      - "Network/Check Device Status"
    linux_rhel:
      - "Linux/RHEL START Service on RHEL"
      - "Linux/RHEL Package Management"
      - "Linux/RHEL User Management"
      - "Linux/RHEL File Operations"
      - "RHEL / Update RHEL Time Servers"
      - "Linux/RHEL System Info"
