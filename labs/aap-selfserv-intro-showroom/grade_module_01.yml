---
# Grade Module 1: Configure AAP for Self-Service Portal
# Validates that students created teams and assigned proper RBAC

- name: Grade Module 1 - Configure AAP RBAC
  hosts: localhost
  gather_facts: false
  become: false

  vars:
    aap_gateway_url: "{{ lookup('env', 'AAP_CONTROLLER_URL') }}"
    aap_admin_username: "admin"
    aap_admin_password: "{{ lookup('env', 'AAP_ADMIN_PASSWORD') }}"

  tasks:
    # ========================================================================
    # Section 1.1: Verify Teams Created
    # ========================================================================

    - name: "Module 1.1: Check cloud-team exists"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}/api/gateway/v1/teams/?name=cloud-team"
        method: GET
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
        status_code: [200, 404]
      register: r_cloud_team

    - name: "Module 1.1: Evaluate and log result"
      ansible.builtin.set_fact:
        grader_output_message: "{{ 'PASS: Team cloud-team created' if (r_cloud_team.json.count | default(0) | int > 0) else 'FAIL: Team cloud-team created: Team not found. Create cloud-team in Access Management > Teams' }}"

    - name: "Module 1.1: Log result"
      include_role:
        name: ftl_run_log_grade_to_log

    - name: "Module 1.2: Check network-team exists"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}/api/gateway/v1/teams/?name=network-team"
        method: GET
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
        status_code: [200, 404]
      register: r_network_team

    - name: "Module 1.2: Evaluate and log result"
      ansible.builtin.set_fact:
        grader_output_message: "{{ 'PASS: Team network-team created' if (r_network_team.json.count | default(0) | int > 0) else 'FAIL: Team network-team created: Team not found. Create network-team in Access Management > Teams' }}"

    - name: "Module 1.2: Log result"
      include_role:
        name: ftl_run_log_grade_to_log

    - name: "Module 1.3: Check rhel-team exists"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}/api/gateway/v1/teams/?name=rhel-team"
        method: GET
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
        status_code: [200, 404]
      register: r_rhel_team

    - name: "Module 1.3: Evaluate and log result"
      ansible.builtin.set_fact:
        grader_output_message: "{{ 'PASS: Team rhel-team created' if (r_rhel_team.json.count | default(0) | int > 0) else 'FAIL: Team rhel-team created: Team not found. Create rhel-team in Access Management > Teams' }}"

    - name: "Module 1.3: Log result"
      include_role:
        name: ftl_run_log_grade_to_log

    # ========================================================================
    # Section 1.2: Verify Team Membership
    # ========================================================================

    - name: "Module 1.4: Get cloud-team users"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}{{ r_cloud_team.json.results[0].related.users }}"
        method: GET
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
        status_code: [200, 404]
      register: r_cloud_users
      when: r_cloud_team.json.count | default(0) | int > 0

    - name: "Module 1.4: Evaluate and log result"
      ansible.builtin.set_fact:
        grader_output_message: "{{ 'PASS: clouduser1 assigned to cloud-team' if (r_cloud_users.json.results | default([]) | selectattr('username', 'equalto', 'clouduser1') | list | length > 0) else 'FAIL: clouduser1 assigned to cloud-team: User not in team. Assign clouduser1 to cloud-team in Users tab' }}"
      when: r_cloud_team.json.count | default(0) | int > 0

    - name: "Module 1.4: Log result"
      include_role:
        name: ftl_run_log_grade_to_log
      when: r_cloud_team.json.count | default(0) | int > 0

    - name: "Module 1.5: Get network-team users"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}{{ r_network_team.json.results[0].related.users }}"
        method: GET
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
        status_code: [200, 404]
      register: r_network_users
      when: r_network_team.json.count | default(0) | int > 0

    - name: "Module 1.5: Evaluate and log result"
      ansible.builtin.set_fact:
        grader_output_message: "{{ 'PASS: networkuser1 assigned to network-team' if (r_network_users.json.results | default([]) | selectattr('username', 'equalto', 'networkuser1') | list | length > 0) else 'FAIL: networkuser1 assigned to network-team: User not in team. Assign networkuser1 to network-team in Users tab' }}"
      when: r_network_team.json.count | default(0) | int > 0

    - name: "Module 1.5: Log result"
      include_role:
        name: ftl_run_log_grade_to_log
      when: r_network_team.json.count | default(0) | int > 0

    - name: "Module 1.6: Get rhel-team users"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}{{ r_rhel_team.json.results[0].related.users }}"
        method: GET
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
        status_code: [200, 404]
      register: r_rhel_users
      when: r_rhel_team.json.count | default(0) | int > 0

    - name: "Module 1.6: Evaluate and log result"
      ansible.builtin.set_fact:
        grader_output_message: "{{ 'PASS: rheluser1 assigned to rhel-team' if (r_rhel_users.json.results | default([]) | selectattr('username', 'equalto', 'rheluser1') | list | length > 0) else 'FAIL: rheluser1 assigned to rhel-team: User not in team. Assign rheluser1 to rhel-team in Users tab' }}"
      when: r_rhel_team.json.count | default(0) | int > 0

    - name: "Module 1.6: Log result"
      include_role:
        name: ftl_run_log_grade_to_log
      when: r_rhel_team.json.count | default(0) | int > 0

    # ========================================================================
    # Section 1.3: Verify cloud-team Role Assignments
    # ========================================================================

    - name: "Module 1.7: Get cloud-team roles"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}{{ r_cloud_team.json.results[0].related.roles }}"
        method: GET
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
      register: r_cloud_team_roles
      when: r_cloud_team.json.count | default(0) | int > 0

    - name: "Module 1.7: Check cloud-team has job template execute roles"
      ansible.builtin.set_fact:
        cloud_team_has_jt_roles: "{{ r_cloud_team_roles.json.results | default([]) | selectattr('name', 'equalto', 'Execute') | selectattr('summary_fields.resource_type', 'equalto', 'job_template') | list | length > 0 }}"
      when: r_cloud_team.json.count | default(0) | int > 0

    - name: "Module 1.7: Evaluate and log result"
      ansible.builtin.set_fact:
        grader_output_message: "{{ 'PASS: cloud-team has Job Template Execute roles assigned' if (cloud_team_has_jt_roles | default(false)) else 'FAIL: cloud-team has Job Template Execute roles assigned: No Execute roles found. Assign Execute permission on Cloud/AWS job templates' }}"
      when: r_cloud_team.json.count | default(0) | int > 0

    - name: "Module 1.7: Log result"
      include_role:
        name: ftl_run_log_grade_to_log
      when: r_cloud_team.json.count | default(0) | int > 0

    - name: "Module 1.8: Check cloud-team has inventory use roles"
      ansible.builtin.set_fact:
        cloud_team_has_inv_roles: "{{ r_cloud_team_roles.json.results | default([]) | selectattr('name', 'equalto', 'Use') | selectattr('summary_fields.resource_type', 'equalto', 'inventory') | list | length > 0 }}"
      when: r_cloud_team.json.count | default(0) | int > 0

    - name: "Module 1.8: Evaluate and log result"
      ansible.builtin.set_fact:
        grader_output_message: "{{ 'PASS: cloud-team has Inventory Use roles assigned' if (cloud_team_has_inv_roles | default(false)) else 'FAIL: cloud-team has Inventory Use roles assigned: No Use roles found. Assign Use permission on AWS, Azure, GCP inventories' }}"
      when: r_cloud_team.json.count | default(0) | int > 0

    - name: "Module 1.8: Log result"
      include_role:
        name: ftl_run_log_grade_to_log
      when: r_cloud_team.json.count | default(0) | int > 0

    - name: "Module 1.9: Check cloud-team has credential use roles"
      ansible.builtin.set_fact:
        cloud_team_has_cred_roles: "{{ r_cloud_team_roles.json.results | default([]) | selectattr('name', 'equalto', 'Use') | selectattr('summary_fields.resource_type', 'equalto', 'credential') | list | length > 0 }}"
      when: r_cloud_team.json.count | default(0) | int > 0

    - name: "Module 1.9: Evaluate and log result"
      ansible.builtin.set_fact:
        grader_output_message: "{{ 'PASS: cloud-team has Credential Use roles assigned' if (cloud_team_has_cred_roles | default(false)) else 'FAIL: cloud-team has Credential Use roles assigned: No Use roles found. Assign Use permission on AWS, Azure, RHEL credentials' }}"
      when: r_cloud_team.json.count | default(0) | int > 0

    - name: "Module 1.9: Log result"
      include_role:
        name: ftl_run_log_grade_to_log
      when: r_cloud_team.json.count | default(0) | int > 0

    # ========================================================================
    # Section 1.4: Verify network-team Role Assignments
    # ========================================================================

    - name: "Module 1.10: Get network-team roles"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}{{ r_network_team.json.results[0].related.roles }}"
        method: GET
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
      register: r_network_team_roles
      when: r_network_team.json.count | default(0) | int > 0

    - name: "Module 1.10: Check network-team has job template execute roles"
      ansible.builtin.set_fact:
        network_team_has_jt_roles: "{{ r_network_team_roles.json.results | default([]) | selectattr('name', 'equalto', 'Execute') | selectattr('summary_fields.resource_type', 'equalto', 'job_template') | list | length > 0 }}"
      when: r_network_team.json.count | default(0) | int > 0

    - name: "Module 1.10: Evaluate and log result"
      ansible.builtin.set_fact:
        grader_output_message: "{{ 'PASS: network-team has Job Template Execute roles assigned' if (network_team_has_jt_roles | default(false)) else 'FAIL: network-team has Job Template Execute roles assigned: No Execute roles found. Assign Execute permission on Network/ job templates' }}"
      when: r_network_team.json.count | default(0) | int > 0

    - name: "Module 1.10: Log result"
      include_role:
        name: ftl_run_log_grade_to_log
      when: r_network_team.json.count | default(0) | int > 0

    - name: "Module 1.11: Check network-team has inventory use roles"
      ansible.builtin.set_fact:
        network_team_has_inv_roles: "{{ r_network_team_roles.json.results | default([]) | selectattr('name', 'equalto', 'Use') | selectattr('summary_fields.resource_type', 'equalto', 'inventory') | list | length > 0 }}"
      when: r_network_team.json.count | default(0) | int > 0

    - name: "Module 1.11: Evaluate and log result"
      ansible.builtin.set_fact:
        grader_output_message: "{{ 'PASS: network-team has Inventory Use roles assigned' if (network_team_has_inv_roles | default(false)) else 'FAIL: network-team has Inventory Use roles assigned: No Use roles found. Assign Use permission on Network Inventory' }}"
      when: r_network_team.json.count | default(0) | int > 0

    - name: "Module 1.11: Log result"
      include_role:
        name: ftl_run_log_grade_to_log
      when: r_network_team.json.count | default(0) | int > 0

    - name: "Module 1.12: Check network-team has credential use roles"
      ansible.builtin.set_fact:
        network_team_has_cred_roles: "{{ r_network_team_roles.json.results | default([]) | selectattr('name', 'equalto', 'Use') | selectattr('summary_fields.resource_type', 'equalto', 'credential') | list | length > 0 }}"
      when: r_network_team.json.count | default(0) | int > 0

    - name: "Module 1.12: Evaluate and log result"
      ansible.builtin.set_fact:
        grader_output_message: "{{ 'PASS: network-team has Credential Use roles assigned' if (network_team_has_cred_roles | default(false)) else 'FAIL: network-team has Credential Use roles assigned: No Use roles found. Assign Use permission on Network Credential' }}"
      when: r_network_team.json.count | default(0) | int > 0

    - name: "Module 1.12: Log result"
      include_role:
        name: ftl_run_log_grade_to_log
      when: r_network_team.json.count | default(0) | int > 0

    # ========================================================================
    # Section 1.5: Verify rhel-team Role Assignments
    # ========================================================================

    - name: "Module 1.13: Get rhel-team roles"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}{{ r_rhel_team.json.results[0].related.roles }}"
        method: GET
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
      register: r_rhel_team_roles
      when: r_rhel_team.json.count | default(0) | int > 0

    - name: "Module 1.13: Check rhel-team has job template execute roles"
      ansible.builtin.set_fact:
        rhel_team_has_jt_roles: "{{ r_rhel_team_roles.json.results | default([]) | selectattr('name', 'equalto', 'Execute') | selectattr('summary_fields.resource_type', 'equalto', 'job_template') | list | length > 0 }}"
      when: r_rhel_team.json.count | default(0) | int > 0

    - name: "Module 1.13: Evaluate and log result"
      ansible.builtin.set_fact:
        grader_output_message: "{{ 'PASS: rhel-team has Job Template Execute roles assigned' if (rhel_team_has_jt_roles | default(false)) else 'FAIL: rhel-team has Job Template Execute roles assigned: No Execute roles found. Assign Execute permission on Linux/RHEL job templates' }}"
      when: r_rhel_team.json.count | default(0) | int > 0

    - name: "Module 1.13: Log result"
      include_role:
        name: ftl_run_log_grade_to_log
      when: r_rhel_team.json.count | default(0) | int > 0

    - name: "Module 1.14: Check rhel-team has inventory use roles"
      ansible.builtin.set_fact:
        rhel_team_has_inv_roles: "{{ r_rhel_team_roles.json.results | default([]) | selectattr('name', 'equalto', 'Use') | selectattr('summary_fields.resource_type', 'equalto', 'inventory') | list | length > 0 }}"
      when: r_rhel_team.json.count | default(0) | int > 0

    - name: "Module 1.14: Evaluate and log result"
      ansible.builtin.set_fact:
        grader_output_message: "{{ 'PASS: rhel-team has Inventory Use roles assigned' if (rhel_team_has_inv_roles | default(false)) else 'FAIL: rhel-team has Inventory Use roles assigned: No Use roles found. Assign Use permission on RHEL and AWS inventories' }}"
      when: r_rhel_team.json.count | default(0) | int > 0

    - name: "Module 1.14: Log result"
      include_role:
        name: ftl_run_log_grade_to_log
      when: r_rhel_team.json.count | default(0) | int > 0

    - name: "Module 1.15: Check rhel-team has credential use roles"
      ansible.builtin.set_fact:
        rhel_team_has_cred_roles: "{{ r_rhel_team_roles.json.results | default([]) | selectattr('name', 'equalto', 'Use') | selectattr('summary_fields.resource_type', 'equalto', 'credential') | list | length > 0 }}"
      when: r_rhel_team.json.count | default(0) | int > 0

    - name: "Module 1.15: Evaluate and log result"
      ansible.builtin.set_fact:
        grader_output_message: "{{ 'PASS: rhel-team has Credential Use roles assigned' if (rhel_team_has_cred_roles | default(false)) else 'FAIL: rhel-team has Credential Use roles assigned: No Use roles found. Assign Use permission on AWS and RHEL credentials' }}"
      when: r_rhel_team.json.count | default(0) | int > 0

    - name: "Module 1.15: Log result"
      include_role:
        name: ftl_run_log_grade_to_log
      when: r_rhel_team.json.count | default(0) | int > 0

    - name: "Module 1 grading complete"
      ansible.builtin.debug:
        msg: "✅ Module 1 grading complete - AAP RBAC configuration verified"
