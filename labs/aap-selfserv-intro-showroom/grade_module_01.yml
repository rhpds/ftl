---
# Grade Module 1: Configure AAP for Self-Service Portal
# Validates that students created teams and assigned proper RBAC

- name: Grade Module 1 - Configure AAP RBAC
  hosts: localhost
  gather_facts: false
  become: false

  vars:
    aap_gateway_url: "{{ lookup('env', 'AAP_CONTROLLER_URL') }}"
    aap_admin_username: "admin"
    aap_admin_password: "{{ lookup('env', 'AAP_ADMIN_PASSWORD') }}"

  tasks:
    # ========================================================================
    # Section 1.1: Verify Teams Created
    # ========================================================================

    - name: "Module 1.1: Check cloud-team exists"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}/api/gateway/v1/teams/?name=cloud-team"
        method: GET
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
        status_code: [200, 404]
      register: r_cloud_team

    - name: "Module 1.1: Evaluate and log result"
      ansible.builtin.set_fact:
        grader_output_message: "{{ 'PASS: Team cloud-team created' if (r_cloud_team.json.count | default(0) | int > 0) else 'FAIL: Team cloud-team created: Team not found. Create cloud-team in Access Management > Teams' }}"

    - name: "Module 1.1: Log result"
      include_role:
        name: ftl_run_log_grade_to_log

    - name: "Module 1.2: Check network-team exists"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}/api/gateway/v1/teams/?name=network-team"
        method: GET
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
        status_code: [200, 404]
      register: r_network_team

    - name: "Module 1.2: Evaluate and log result"
      ansible.builtin.set_fact:
        grader_output_message: "{{ 'PASS: Team network-team created' if (r_network_team.json.count | default(0) | int > 0) else 'FAIL: Team network-team created: Team not found. Create network-team in Access Management > Teams' }}"

    - name: "Module 1.2: Log result"
      include_role:
        name: ftl_run_log_grade_to_log

    - name: "Module 1.3: Check rhel-team exists"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}/api/gateway/v1/teams/?name=rhel-team"
        method: GET
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
        status_code: [200, 404]
      register: r_rhel_team

    - name: "Module 1.3: Evaluate and log result"
      ansible.builtin.set_fact:
        grader_output_message: "{{ 'PASS: Team rhel-team created' if (r_rhel_team.json.count | default(0) | int > 0) else 'FAIL: Team rhel-team created: Team not found. Create rhel-team in Access Management > Teams' }}"

    - name: "Module 1.3: Log result"
      include_role:
        name: ftl_run_log_grade_to_log

    # ========================================================================
    # Section 1.2: Verify Team Membership
    # ========================================================================

    - name: "Module 1.4: Check clouduser1 assigned to cloud-team"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}/api/gateway/v1/teams/?name=cloud-team"
        method: GET
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
        status_code: [200, 404]
      register: r_cloud_team_members
      when: r_cloud_team.json.count | default(0) | int > 0

    - name: "Module 1.4: Get cloud-team users"
      ansible.builtin.uri:
        url: "{{ aap_gateway_url }}{{ r_cloud_team.json.results[0].related.users }}"
        method: GET
        user: "{{ aap_admin_username }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
        status_code: [200, 404]
      register: r_cloud_users
      when: r_cloud_team.json.count | default(0) | int > 0

    - name: "Module 1.4: Evaluate and log result"
      ansible.builtin.set_fact:
        grader_output_message: "{{ 'PASS: clouduser1 assigned to cloud-team' if (r_cloud_users.json.results | default([]) | selectattr('username', 'equalto', 'clouduser1') | list | length > 0) else 'FAIL: clouduser1 assigned to cloud-team: User not in team. Assign clouduser1 to cloud-team' }}"
      when: r_cloud_team.json.count | default(0) | int > 0

    - name: "Module 1.4: Log result"
      include_role:
        name: ftl_run_log_grade_to_log
      when: r_cloud_team.json.count | default(0) | int > 0

    - name: "Module 1 grading complete"
      ansible.builtin.debug:
        msg: "✅ Module 1 grading complete - RBAC configuration verified"
