---
# grader_check_command_output - Execute command and validate output
# This role executes a command and validates the output against expected criteria

# Initialize success flag to false
# Ensures failure unless validation explicitly passes
- name: Initialize success flag
  ansible.builtin.set_fact:
    success: false
  delegate_to: localhost

# Validate required parameters
# Ensure critical variables are provided before proceeding
- name: Validate required variables
  ansible.builtin.assert:
    that:
      - command is defined
      - command | length > 0
      - task_description_message is defined
      - task_description_message | length > 0
    fail_msg: "Required variables missing: command and task_description_message are required"
    quiet: true
  delegate_to: localhost

# Execute the command
# Run the specified command and capture output and return code
# Use check_mode: false to ensure the command actually executes
- name: Execute command
  ansible.builtin.shell: "{{ command }}"
  args:
    chdir: "{{ chdir | default(omit) }}"
  environment: "{{ command_environment | default({}) }}"
  register: r_command
  changed_when: false
  failed_when: false
  delegate_to: localhost

# Evaluate success based on exact output match
# If expected_output is provided, stdout must exactly match
- name: Evaluate success (exact output match)
  when:
    - expected_output is defined
    - expected_output | length > 0
  ansible.builtin.set_fact:
    success: "{{ r_command.stdout.strip() == expected_output }}"
  delegate_to: localhost

# Evaluate success based on regex pattern
# If expected_output_regex is provided, stdout must match the pattern
- name: Evaluate success (regex pattern match)
  when:
    - expected_output_regex is defined
    - expected_output_regex | length > 0
    - expected_output is not defined or expected_output | length == 0
  ansible.builtin.set_fact:
    success: "{{ r_command.stdout is regex(expected_output_regex) }}"
  delegate_to: localhost

# Evaluate success based on return code
# If no output validation is specified, check return code only
- name: Evaluate success (return code only)
  when:
    - (expected_output is not defined or expected_output | length == 0)
    - (expected_output_regex is not defined or expected_output_regex | length == 0)
  ansible.builtin.set_fact:
    success: "{{ r_command.rc == expected_rc }}"
  delegate_to: localhost

# Create PASS message
# Report successful validation to student
- name: Create Pass message
  when: success | bool
  ansible.builtin.set_fact:
    grader_output_message: "PASS: {{ task_description_message }}"
  delegate_to: localhost

# Create FAIL message
# Report failure with helpful error message
- name: Create Fail message
  when: not success | bool
  ansible.builtin.set_fact:
    grader_output_message: >-
      FAIL: {{ task_description_message }}: {{ student_error_message }}
      (expected rc={{ expected_rc }}, got rc={{ r_command.rc }})
  delegate_to: localhost

# Log the grading result
# Call the logging role to append result to report file
- name: Log grading result
  ansible.builtin.import_role:
    name: ftl_run_log_grade_to_log
  delegate_to: localhost
