---
# grader_check_service_running - Verify systemd service is running
# This role checks if a systemd service is active and optionally enabled

# Initialize success flag to false
# Ensures failure unless validation explicitly passes
- name: Initialize success flag
  ansible.builtin.set_fact:
    success: false

# Validate required parameters
# Ensure critical variables are provided before proceeding
- name: Validate required variables
  ansible.builtin.assert:
    that:
      - service_name is defined
      - service_name | length > 0
      - task_description_message is defined
      - task_description_message | length > 0
    fail_msg: "Required variables missing: service_name and task_description_message are required"
    quiet: true

# Get service status
# Gather information about the service state
- name: Get service status
  ansible.builtin.systemd:
    name: "{{ service_name }}"
  check_mode: true
  register: r_service
  failed_when: false

# Check if service is active (running)
# Service must be in active state
- name: Check if service is active
  ansible.builtin.set_fact:
    service_active: "{{ r_service.status.ActiveState == 'active' }}"
  when: r_service.status is defined

# Check if service is enabled (if requested)
# Service must be enabled to start on boot
- name: Check if service is enabled
  when: check_enabled | bool
  ansible.builtin.set_fact:
    service_enabled: "{{ r_service.status.UnitFileState == 'enabled' }}"
  when: r_service.status is defined

# Evaluate overall success
# Service must be active and (if checked) enabled
- name: Evaluate overall success
  ansible.builtin.set_fact:
    success: >-
      {{
        (service_active | default(false)) and
        (not (check_enabled | bool) or (service_enabled | default(false)))
      }}

# Create PASS message
# Report successful validation to student
- name: Create Pass message
  when: success | bool
  ansible.builtin.set_fact:
    grader_output_message: "PASS: {{ task_description_message }}"

# Create FAIL message
# Report failure with helpful error message
- name: Create Fail message
  when: not success | bool
  ansible.builtin.set_fact:
    grader_output_message: >-
      FAIL: {{ task_description_message }}: {{ student_error_message }}
      {% if not (service_active | default(false)) %}
      (service not active)
      {% elif check_enabled | bool and not (service_enabled | default(false)) %}
      (service not enabled)
      {% endif %}

# Log the grading result
# Call the logging role to append result to report file
- name: Log grading result
  ansible.builtin.import_role:
    name: ftl_run_log_grade_to_log
