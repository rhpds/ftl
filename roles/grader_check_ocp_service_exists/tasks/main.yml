---
# grader_check_ocp_service_exists - Validate Service Exists

- name: "Validate required parameters"
  ansible.builtin.assert:
    that:
      - task_description_message is defined
      - service_name is defined
      - service_namespace is defined
    fail_msg: "Missing required parameters for grader_check_ocp_service_exists"
    quiet: true

- name: "Set default error message if not provided"
  when: student_error_message is not defined
  ansible.builtin.set_fact:
    _service_error_message: "Service {{ service_name }} not found in namespace {{ service_namespace }}"

- name: "Use provided error message"
  when: student_error_message is defined
  ansible.builtin.set_fact:
    _service_error_message: "{{ student_error_message }}"

- name: "Check if service exists"
  ansible.builtin.include_role:
    name: grader_check_ocp_resource
  vars:
    resource_kind: "Service"
    resource_name: "{{ service_name }}"
    resource_namespace: "{{ service_namespace }}"
    student_error_message: "{{ _service_error_message }}"
