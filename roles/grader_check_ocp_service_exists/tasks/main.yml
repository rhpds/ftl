---
# grader_check_ocp_service_exists - Validate Service Exists
#
# Purpose: Check if a Kubernetes service exists
#
# Required Variables:
#   task_description_message: Human-readable description
#   service_name: Name of the service
#   service_namespace: Namespace where service should exist
#
# Optional Variables:
#   student_error_message: Custom error message
#
# Example:
#   - include_role:
#       name: grader_check_ocp_service_exists
#     vars:
#       task_description_message: "MCP Server service exists"
#       service_name: "mcp-openshift-proxy"
#       service_namespace: "mcp-demo"

- name: "Validate required parameters"
  ansible.builtin.assert:
    that:
      - task_description_message is defined
      - service_name is defined
      - service_namespace is defined
    fail_msg: "Missing required parameters for grader_check_ocp_service_exists"
    quiet: true

- name: "Check if service exists"
  ansible.builtin.include_role:
    name: grader_check_ocp_resource
  vars:
    resource_kind: "Service"
    resource_name: "{{ service_name }}"
    resource_namespace: "{{ service_namespace }}"
    student_error_message: "{{ student_error_message | default('Service ' + service_name + ' not found in namespace ' + service_namespace) }}"
