---
# grader_check_ocp_deployment - Validate Deployment Exists and is Ready

- name: "Validate required parameters"
  ansible.builtin.assert:
    that:
      - task_description_message is defined
      - deployment_name is defined
      - deployment_namespace is defined
    fail_msg: "Missing required parameters for grader_check_ocp_deployment"
    quiet: true

- name: "Set default error message (with replicas)"
  when:
    - student_error_message is not defined
    - expected_replicas is defined
  ansible.builtin.set_fact:
    _deployment_error_message: "Deployment {{ deployment_name }} not ready (expected {{ expected_replicas | string }} replicas)"

- name: "Set default error message (no replicas)"
  when:
    - student_error_message is not defined
    - expected_replicas is not defined
  ansible.builtin.set_fact:
    _deployment_error_message: "Deployment {{ deployment_name }} not found in namespace {{ deployment_namespace }}"

- name: "Use provided error message"
  when: student_error_message is defined
  ansible.builtin.set_fact:
    _deployment_error_message: "{{ student_error_message }}"

- name: "Check deployment (with replica validation)"
  when: expected_replicas is defined
  ansible.builtin.include_role:
    name: grader_check_ocp_resource
  vars:
    resource_kind: "Deployment"
    resource_name: "{{ deployment_name }}"
    resource_namespace: "{{ deployment_namespace }}"
    resource_state: "{{ expected_replicas | int }}"
    resource_state_path: "status.readyReplicas"
    student_error_message: "{{ _deployment_error_message }}"

- name: "Check deployment exists (no replica validation)"
  when: expected_replicas is not defined
  ansible.builtin.include_role:
    name: grader_check_ocp_resource
  vars:
    resource_kind: "Deployment"
    resource_name: "{{ deployment_name }}"
    resource_namespace: "{{ deployment_namespace }}"
    student_error_message: "{{ _deployment_error_message }}"
