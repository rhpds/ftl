---
# ftl_run_grade_report_generation - Generate and sign grading report
# This role analyzes grading results, calculates pass/fail status, signs the report,
# and optionally integrates with AgnosticD userinfo for catalog deployments

# Read the current report file content
# We need to analyze it to determine if the lab passed or failed
- name: Read grading report file
  ansible.builtin.slurp:
    src: "{{ grader_working_dir }}/{{ grader_student_report_file }}"
  register: r_report

# Check for any FAIL entries in the report
# If "FAIL" appears anywhere, the lab is considered failed
- name: Check for failures in report
  ansible.builtin.set_fact:
    lab_passed: "{{ 'FAIL' not in (r_report.content | b64decode) }}"

# Count the number of failed checks
# This gives students feedback on how many issues need to be fixed
- name: Count failed checks
  ansible.builtin.shell: |
    grep -c '^FAIL' "{{ grader_working_dir }}/{{ grader_student_report_file }}" || true
  register: r_error_count
  changed_when: false

# Calculate SHA256 hash of the report
# This provides integrity verification and prevents report tampering
- name: Calculate SHA256 checksum of report
  ansible.builtin.stat:
    path: "{{ grader_working_dir }}/{{ grader_student_report_file }}"
    checksum_algorithm: sha256
  register: r_stat

# Append summary section separator
# Makes the report easier to read with clear visual sections
- name: Append summary section separator
  ansible.builtin.lineinfile:
    path: "{{ grader_working_dir }}/{{ grader_student_report_file }}"
    line: |+

      ================================================================================
      Summary
      ================================================================================
    insertafter: EOF

# Append final status
# Shows SUCCESS with 0 errors or FAILED with error count
- name: Append final status to report
  ansible.builtin.lineinfile:
    path: "{{ grader_working_dir }}/{{ grader_student_report_file }}"
    line: "{{ 'SUCCESS 0 Errors' if lab_passed else 'FAILED ' + r_error_count.stdout + ' Errors' }}"
    insertafter: EOF

# Append SHA256 signature
# Provides cryptographic proof of report authenticity
- name: Append SHA256 signature to report
  ansible.builtin.lineinfile:
    path: "{{ grader_working_dir }}/{{ grader_student_report_file }}"
    line: |+

      SHA256: {{ r_stat.stat.checksum }}
    insertafter: EOF

# AgnosticD userinfo integration
# When running in AgnosticV catalogs, report results to AgnosticD for visibility
# This allows the provisioning system to show lab grading status
- name: Report grading results to AgnosticD userinfo
  when: agnosticd_user_info_enabled | bool
  block:
    - name: Send grading status to AgnosticD userinfo
      agnosticd_user_info:
        msg: |
          {{ '✓ Lab Passed' if lab_passed else '✗ Lab Failed (' + r_error_count.stdout + ' errors)' }}
          Full report: {{ grader_working_dir }}/{{ grader_student_report_file }}
        data:
          grade_lab_result: "{{ 'PASS' if lab_passed else 'FAIL' }}"
          grade_lab_errors: "{{ r_error_count.stdout }}"
          grade_lab_report_checksum: "{{ r_stat.stat.checksum }}"
          grade_lab_id: "{{ lab_id }}"
          grade_lab_guid: "{{ guid }}"
          grade_lab_student: "{{ student_name }}"

# Set grading result facts for downstream use
# Other playbooks or roles can check these facts to determine grading outcome
- name: Set grading result facts
  ansible.builtin.set_fact:
    ftl_lab_passed: "{{ lab_passed }}"
    ftl_error_count: "{{ r_error_count.stdout }}"
    ftl_report_checksum: "{{ r_stat.stat.checksum }}"
