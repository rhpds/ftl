---
# grader_check_ocp_route_exists - Validate OpenShift Route Exists

- name: "Validate required parameters"
  ansible.builtin.assert:
    that:
      - task_description_message is defined
      - route_name is defined
      - route_namespace is defined
    fail_msg: "Missing required parameters for grader_check_ocp_route_exists"
    quiet: true

- name: "Set default error message (with host)"
  when:
    - student_error_message is not defined
    - expected_host is defined
  ansible.builtin.set_fact:
    _route_error_message: "Route {{ route_name }} host does not match {{ expected_host }}"

- name: "Set default error message (no host)"
  when:
    - student_error_message is not defined
    - expected_host is not defined
  ansible.builtin.set_fact:
    _route_error_message: "Route {{ route_name }} not found in namespace {{ route_namespace }}"

- name: "Use provided error message"
  when: student_error_message is defined
  ansible.builtin.set_fact:
    _route_error_message: "{{ student_error_message }}"

- name: "Check if route exists (with host validation)"
  when: expected_host is defined
  ansible.builtin.include_role:
    name: grader_check_ocp_resource
  vars:
    resource_kind: "Route"
    resource_name: "{{ route_name }}"
    resource_namespace: "{{ route_namespace }}"
    resource_state: "{{ expected_host }}"
    resource_state_path: "spec.host"
    student_error_message: "{{ _route_error_message }}"

- name: "Check if route exists (no host validation)"
  when: expected_host is not defined
  ansible.builtin.include_role:
    name: grader_check_ocp_resource
  vars:
    resource_kind: "Route"
    resource_name: "{{ route_name }}"
    resource_namespace: "{{ route_namespace }}"
    student_error_message: "{{ _route_error_message }}"
