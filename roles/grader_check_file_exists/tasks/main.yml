---
# grader_check_file_exists - Verify file or directory exists
# This role checks if a file/directory exists and optionally validates permissions/ownership

# Initialize success flag to false
# Ensures failure unless validation explicitly passes
- name: Initialize success flag
  ansible.builtin.set_fact:
    success: false

# Validate required parameters
# Ensure critical variables are provided before proceeding
- name: Validate required variables
  ansible.builtin.assert:
    that:
      - file_path is defined
      - file_path | length > 0
      - task_description_message is defined
      - task_description_message | length > 0
    fail_msg: "Required variables missing: file_path and task_description_message are required"
    quiet: true

# Check if file/directory exists and get stats
# Gather file information for validation
- name: Check file or directory exists
  ansible.builtin.stat:
    path: "{{ file_path }}"
  register: r_file_stat

# Validate file type if file exists
# Check if the path is a file, directory, or link as expected
- name: Validate file type
  when: r_file_stat.stat.exists
  ansible.builtin.set_fact:
    type_valid: >-
      {{
        (file_type == 'any') or
        (file_type == 'file' and r_file_stat.stat.isreg) or
        (file_type == 'directory' and r_file_stat.stat.isdir) or
        (file_type == 'link' and r_file_stat.stat.islnk)
      }}

# Validate permissions if specified
# Check if file has expected permissions (e.g., '0644')
- name: Validate permissions
  when:
    - r_file_stat.stat.exists
    - check_mode_permissions is defined
    - check_mode_permissions | length > 0
  ansible.builtin.set_fact:
    permissions_valid: "{{ r_file_stat.stat.mode == check_mode_permissions }}"

# Validate owner if specified
# Check if file has expected owner
- name: Validate owner
  when:
    - r_file_stat.stat.exists
    - check_owner is defined
    - check_owner | length > 0
  ansible.builtin.set_fact:
    owner_valid: "{{ r_file_stat.stat.pw_name == check_owner }}"

# Validate group if specified
# Check if file has expected group
- name: Validate group
  when:
    - r_file_stat.stat.exists
    - check_group is defined
    - check_group | length > 0
  ansible.builtin.set_fact:
    group_valid: "{{ r_file_stat.stat.gr_name == check_group }}"

# Evaluate overall success
# File must exist, match type, and pass all optional checks
- name: Evaluate overall success
  ansible.builtin.set_fact:
    success: >-
      {{
        r_file_stat.stat.exists and
        (type_valid | default(true)) and
        (permissions_valid | default(true)) and
        (owner_valid | default(true)) and
        (group_valid | default(true))
      }}

# Create PASS message
# Report successful validation to student
- name: Create Pass message
  when: success | bool
  ansible.builtin.set_fact:
    grader_output_message: "PASS: {{ task_description_message }}"

# Create FAIL message with detailed error
# Report failure with helpful error message indicating what failed
- name: Create Fail message
  when: not success | bool
  ansible.builtin.set_fact:
    grader_output_message: >-
      FAIL: {{ task_description_message }}: {{ student_error_message }}
      {% if not r_file_stat.stat.exists %}
      (file not found)
      {% elif not (type_valid | default(true)) %}
      (wrong type: expected {{ file_type }})
      {% elif not (permissions_valid | default(true)) %}
      (wrong permissions: expected {{ check_mode_permissions }}, got {{ r_file_stat.stat.mode }})
      {% elif not (owner_valid | default(true)) %}
      (wrong owner: expected {{ check_owner }}, got {{ r_file_stat.stat.pw_name }})
      {% elif not (group_valid | default(true)) %}
      (wrong group: expected {{ check_group }}, got {{ r_file_stat.stat.gr_name }})
      {% endif %}

# Log the grading result
# Call the logging role to append result to report file
- name: Log grading result
  ansible.builtin.import_role:
    name: ftl_run_log_grade_to_log
