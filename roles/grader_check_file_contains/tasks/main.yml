---
# grader_check_file_contains - Check if file exists and contains expected content
# This role validates that a file exists and optionally contains specific content

# Initialize success flag to false
- name: Initialize success flag
  ansible.builtin.set_fact:
    success: false

# Validate required parameters
- name: Validate required variables
  ansible.builtin.assert:
    that:
      - file_path is defined
      - file_path | length > 0
      - task_description_message is defined
      - task_description_message | length > 0
    fail_msg: "Required variables missing: file_path and task_description_message are required"
    quiet: true

# Check if file exists
- name: Check if file exists
  ansible.builtin.stat:
    path: "{{ file_path }}"
  register: r_file_stat

# Read file content if it exists and content check is needed
- name: Read file content
  when:
    - r_file_stat.stat.exists
    - (expected_content is defined or expected_content_regex is defined)
  ansible.builtin.slurp:
    src: "{{ file_path }}"
  register: r_file_content

# Evaluate success - file exists only
- name: Evaluate success (file exists)
  when:
    - expected_content is not defined
    - expected_content_regex is not defined
  ansible.builtin.set_fact:
    success: "{{ r_file_stat.stat.exists }}"

# Evaluate success - exact content match
- name: Evaluate success (exact content match)
  when:
    - r_file_stat.stat.exists
    - expected_content is defined
    - expected_content | length > 0
  ansible.builtin.set_fact:
    success: "{{ expected_content in (r_file_content.content | b64decode) }}"

# Evaluate success - regex pattern match
- name: Evaluate success (regex pattern match)
  when:
    - r_file_stat.stat.exists
    - expected_content_regex is defined
    - expected_content_regex | length > 0
    - expected_content is not defined
  ansible.builtin.set_fact:
    success: "{{ (r_file_content.content | b64decode) is regex(expected_content_regex) }}"

# Create PASS message
- name: Create Pass message
  when: success | bool
  ansible.builtin.set_fact:
    grader_output_message: "PASS: {{ task_description_message }}"

# Create FAIL message - file not found
- name: Create Fail message (file not found)
  when:
    - not success | bool
    - not r_file_stat.stat.exists
  ansible.builtin.set_fact:
    grader_output_message: >-
      FAIL: {{ task_description_message }}: {{ student_error_message | default('File not found') }}
      (expected file: {{ file_path }})

# Create FAIL message - content mismatch
- name: Create Fail message (content mismatch)
  when:
    - not success | bool
    - r_file_stat.stat.exists
    - (expected_content is defined or expected_content_regex is defined)
  ansible.builtin.set_fact:
    grader_output_message: >-
      FAIL: {{ task_description_message }}: {{ student_error_message | default('Expected content not found in file') }}
      (file exists but content does not match)

# Log the grading result
- name: Log grading result
  ansible.builtin.import_role:
    name: ftl_run_log_grade_to_log
