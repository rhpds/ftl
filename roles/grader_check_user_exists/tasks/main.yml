---
# grader_check_user_exists - Verify user account exists
# This role checks if a user account exists and optionally validates groups, shell, and home directory

# Initialize success flag to false
- name: Initialize success flag
  ansible.builtin.set_fact:
    success: false

# Validate required parameters
- name: Validate required variables
  ansible.builtin.assert:
    that:
      - username is defined
      - username | length > 0
      - task_description_message is defined
      - task_description_message | length > 0
    fail_msg: "Required variables missing: username and task_description_message are required"
    quiet: true

# Get user account information
# Using getent module to retrieve user details from system database
- name: Get user account information
  ansible.builtin.getent:
    database: passwd
    key: "{{ username }}"
  register: r_user
  failed_when: false

# Check if user exists
# User exists if getent found an entry in passwd database
- name: Check if user exists
  ansible.builtin.set_fact:
    user_exists: "{{ r_user.ansible_facts.getent_passwd is defined and username in r_user.ansible_facts.getent_passwd }}"

# Set success to true if user exists (basic check)
- name: Set initial success based on user existence
  when: user_exists | bool
  ansible.builtin.set_fact:
    success: true

# Optional: Verify user groups if check_groups is specified
- name: Verify user groups
  when:
    - user_exists | bool
    - check_groups is defined
    - check_groups | length > 0
  block:
    # Get user's group membership
    - name: Get user groups
      ansible.builtin.command: "id -nG {{ username }}"
      register: r_user_groups
      changed_when: false
      failed_when: false

    # Check if all required groups are present
    - name: Validate group membership
      ansible.builtin.set_fact:
        success: "{{ item in r_user_groups.stdout.split() }}"
      loop: "{{ check_groups.split(',') | map('trim') | list }}"
      when: success | bool

# Optional: Verify user shell if check_shell is specified
- name: Verify user shell
  when:
    - user_exists | bool
    - success | bool
    - check_shell is defined
    - check_shell | length > 0
  block:
    # Get user's shell from passwd entry
    - name: Get user shell
      ansible.builtin.set_fact:
        actual_shell: "{{ r_user.ansible_facts.getent_passwd[username][5] }}"

    # Compare actual shell with expected shell
    - name: Validate shell
      ansible.builtin.set_fact:
        success: "{{ actual_shell == check_shell }}"

# Optional: Verify user home directory if check_home is specified
- name: Verify user home directory
  when:
    - user_exists | bool
    - success | bool
    - check_home is defined
    - check_home | length > 0
  block:
    # Get user's home directory from passwd entry
    - name: Get user home directory
      ansible.builtin.set_fact:
        actual_home: "{{ r_user.ansible_facts.getent_passwd[username][4] }}"

    # Compare actual home with expected home
    - name: Validate home directory
      ansible.builtin.set_fact:
        success: "{{ actual_home == check_home }}"

# Create PASS message
- name: Create Pass message
  when: success | bool
  ansible.builtin.set_fact:
    grader_output_message: "PASS: {{ task_description_message }}"

# Create FAIL message
- name: Create Fail message
  when: not success | bool
  ansible.builtin.set_fact:
    grader_output_message: >-
      FAIL: {{ task_description_message }}: {{ student_error_message }}
      (user '{{ username }}' validation failed)

# Log the grading result
- name: Log grading result
  ansible.builtin.import_role:
    name: ftl_run_log_grade_to_log
