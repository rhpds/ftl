---
# grader_check_package_installed - Verify package is installed
# This role checks if an RPM/DNF package is installed using check_mode

# Initialize success flag to false
- name: Initialize success flag
  ansible.builtin.set_fact:
    success: false

# Validate required parameters
- name: Validate required variables
  ansible.builtin.assert:
    that:
      - package_name is defined
      - package_name | length > 0
      - task_description_message is defined
      - task_description_message | length > 0
    fail_msg: "Required variables missing: package_name and task_description_message are required"
    quiet: true

# Check if package is installed using check_mode
# In check_mode, package module reports 'changed' if package would be installed
# If package exists, 'changed' is false
- name: Check if package is installed
  ansible.builtin.package:
    name: "{{ package_name }}"
    state: present
  check_mode: true
  register: r_package
  failed_when: false

# Determine success based on package state
# Package is installed if check_mode shows no changes needed
- name: Determine success
  ansible.builtin.set_fact:
    success: "{{ not r_package.changed }}"

# Create PASS message
- name: Create Pass message
  when: success | bool
  ansible.builtin.set_fact:
    grader_output_message: "PASS: {{ task_description_message }}"

# Create FAIL message
- name: Create Fail message
  when: not success | bool
  ansible.builtin.set_fact:
    grader_output_message: >-
      FAIL: {{ task_description_message }}: {{ student_error_message }}
      (package '{{ package_name }}' not installed)

# Log the grading result
- name: Log grading result
  ansible.builtin.import_role:
    name: ftl_run_log_grade_to_log
